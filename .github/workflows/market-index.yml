name: Market index (monthly)

# Rebuilds the market index — the numbers behind /en/bali-property-prices,
# /en/bali-rent-prices, /en/methodology and the homepage «in numbers» block.
# The live copy goes to Supabase (site_content 'market-index'); that write
# itself queues a targeted page refresh (migrations 146/147), so new numbers
# are on the site within ~15 min without any deploy. The commit below only
# archives lib/market-index.json (code fallback) and data/market-history/ —
# it does NOT deploy (git deploys are disabled in vercel.json).

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

concurrency:
  group: market-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Write .env.local from secrets
        run: |
          cat > .env.local <<ENV
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          ENV

      - name: Build market index
        run: node --import=./scripts/_fetch-retry.mjs scripts/build-market-index.mjs

      - name: Commit if changed
        run: |
          git add lib/market-index.json data/market-history
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "balinsky-bot"
          git config user.email "i@balinsky.info"
          git commit -m "chore(market): ежемесячный пересчёт индекса рынка"
          git push
