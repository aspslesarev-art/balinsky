<body>

<script>
// Размеры — с чертежа «Type Two Bedroom A» (Rise Nyanyi): 1 этаж —
// дом 10.15 × 7.0 м, сад с бассейном и террасой 6.25 м (всего 13.15 м);
// 2 этаж — 10.15 × 8.7 м, нависает над террасой. Сетка осей: 2.1 / 6.75 /
// 1.15 м внизу и 2.1 / 5.4 / 2.5 м наверху. Подписи площадей на чертеже
// мелкие и не читаются надёжно, поэтому площадей в модели нет.
const PLAN = { name: 'Rise Nyanyi 2BR', W: 10.15, HD: 7.0, BACK: 6.2, FRONT: 1.2, H1: 3.0, H2: 3.0, floors: 2 }
</script>
<script src="_toon-kit.js"></script>
<script>
lot()
const y = 0.12
// ============ 1 этаж ============
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  floorPatch(g, 0, HD, 0, W, y, T.terrazzo, 2)
  floorPatch(g, 5.6, HD, 2.1, 3.6, y + 0.004, T.tiles, 0.8)        // гостевой туалет

  wall(HD, 0, HD, W, H1)
  wall(0, 0, HD, 0, H1); wall(0, W, HD, W, H1)
  glassWall(g, 0, 0, 0, W, 0, H1)
  // гостевой туалет и кладовая у задней стены
  wall(5.6, 2.1, HD, 2.1, H1); wall(5.6, 2.1, 5.6, 7.6, H1); wall(5.6, 3.6, HD, 3.6, H1)
  toilet(g, 6.6, 3.0, y); vanity(g, 6.4, 6.95, 2.2, 2.7, y)
  wall(4.8, 9.0, HD, 9.0, H1); wall(4.8, 9.0, 4.8, 9.3, H1)
  door(g, 4.8, 9.35, 10.0, y, true, -0.4)
  // лестница: марш вдоль задней стены и поворотные ступени вниз
  for (let i = 0; i < 9; i++) rect(g, 5.7, 6.9, 7.5 - i * 0.33, 7.83 - i * 0.33, y, 0.18 * (i + 6), M.woodL)
  for (let i = 0; i < 5; i++) rect(g, 4.9 + i * 0.18, 5.08 + i * 0.18, 7.7, 8.9, y, 0.18 * (i + 1), M.woodL)

  // кухня: линия под лестницей, остров с тремя табуретами
  rr(g, 4.9, 5.5, 3.7, 7.5, y, 0.82, M.sage, 0.03)
  rect(g, 4.88, 5.52, 3.68, 7.52, 0.94, 0.05, M.white)
  rr(g, 3.4, 4.0, 4.9, 6.9, y, 0.92, M.woodL, 0.04)
  rect(g, 3.35, 4.05, 4.85, 6.95, 1.04, 0.05, M.white)
  for (const v of [5.3, 5.9, 6.5]) stool(g, 3.1, v, y)
  // столовая на 6
  rr(g, 1.4, 2.3, 5.0, 7.6, y + 0.7, 0.06, M.woodL, 0.03)
  rr(g, 1.6, 2.1, 5.6, 7.0, y, 0.7, M.wood, 0.03)
  for (const v of [5.5, 6.3, 7.1]) { chair(g, 2.6, v, y); chair(g, 1.1, v, y) }
  // гостиная: диван с оттоманкой, столик, кресло, ТВ-консоль
  rr(g, 0.5, 3.3, 1.2, 3.4, y, 0.012, M.cush, 0.005, false)
  rr(g, 0.35, 3.3, 2.7, 3.6, y, 0.42, M.sofa, 0.12)
  rr(g, 0.35, 3.3, 3.3, 3.6, y, 0.85, M.sofa, 0.12)
  rr(g, 0.35, 1.3, 1.9, 2.7, y, 0.42, M.sofa, 0.12)
  rr(g, 1.4, 1.8, 2.9, 3.1, y + 0.42, 0.3, M.cush, 0.1)
  rr(g, 2.4, 2.8, 2.9, 3.1, y + 0.42, 0.3, M.mustard, 0.1)
  rr(g, 1.5, 2.5, 1.5, 2.1, y, 0.38, M.woodL, 0.04)
  rr(g, 3.4, 4.2, 1.1, 1.8, y, 0.45, M.mustard, 0.15)
  rr(g, 0.35, 4.7, 0.12, 0.45, y, 0.5, M.wood, 0.04)
  rect(g, 1.8, 3.2, 0.14, 0.2, 1.0, 0.75, M.dark)
  rr(g, 1.5, 3.5, 9.6, 10.0, y, 0.75, M.wood, 0.04)                 // комод у правой стены
  plant(g, 0.95, 9.6, y, 0.8)
}
// ============ сад: бассейн, терраса, лаунж ============
{
  const g = floor1G, fence = makeWall(siteG, 0)
  rect(g, -BACK, 0, 0, W, 0, 0.1, texMat(T.terrazzo, 4, 2.5), true, false)
  rect(g, -BACK, 0, -1.0, 0, 0, 0.06, texMat(T.grass, 0.5, 3), false, false)
  pool(g, -5.75, -0.75, 1.2, 3.5, 0.1)
  lounger(g, -2.5, -0.6, 4.1, 4.75, 0.1)
  lounger(g, -2.5, -0.6, 5.3, 5.95, 0.1)
  rect(g, -5.95, -3.1, 3.6, W, 0.1, 0.04, texMat(T.deck, 3, 1.4), true, false)
  rr(g, -4.2, -3.45, 5.8, 7.9, 0.14, 0.42, M.sofa, 0.12)
  rr(g, -3.75, -3.45, 5.8, 7.9, 0.14, 0.85, M.sofa, 0.12)
  roundTable(g, -5.0, 6.8, 0.14, 0.4); chair(g, -5.1, 5.1, 0.14, M.coral)
  for (const [u, v] of [[-4.0, 9.2], [-5.3, 9.5], [-4.8, 8.6]]) plant(g, u, v, 0.14, 1.1)
  // ограда сада со входом справа
  fence(-6.2, -1.0, -6.2, W, 1.8)
  fence(-6.2, -1.0, 0, -1.0, 1.8)
  fence(-6.2, W, -1.6, W, 1.8); fence(-0.5, W, 0, W, 1.8)
  door(g, W, -1.5, -0.6, 0.1, false, 0.4)
}

// ============ 2 этаж ============
const Y = H1 + 0.18, YF = Y + 0.04
const U0 = -1.46
{
  const g = floor2G, wall = makeWall(g, Y)
  // перекрытие с проёмом над лестницей
  rect(g, U0, 5.0, 0, W, H1, 0.18, M.wood); rect(g, U0, 5.0, 0, W, Y, 0.04, M.slab, true, false)
  rect(g, 5.0, HD, 0, 2.2, H1, 0.18, M.wood); rect(g, 5.0, HD, 0, 2.2, Y, 0.04, M.slab, true, false)
  rect(g, 5.0, HD, 7.6, W, H1, 0.18, M.wood); rect(g, 5.0, HD, 7.6, W, Y, 0.04, M.slab, true, false)
  rect(g, 5.0, 5.9, 2.2, 3.5, H1, 0.18, M.wood); rect(g, 5.0, 5.9, 2.2, 3.5, Y, 0.04, M.slab, true, false)
  floorPatch(g, U0, HD, 0, 3.4, YF, T.planks, 1.6)
  floorPatch(g, U0, HD, 6.75, W, YF, T.planks, 1.6)
  floorPatch(g, 3.9, 5.0, 3.4, 6.75, YF, T.planks, 1.6)
  floorPatch(g, U0, 3.9, 3.4, 6.75, YF, T.tiles, 0.8)
  railing(g, 5.0, 3.5, 5.0, 7.6, YF); railing(g, 5.0, 3.5, 5.9, 3.5, YF); railing(g, 5.9, 2.2, 5.9, 3.5, YF)

  wall(HD, 0, HD, W, H2)
  wall(U0, 0, HD, 0, H2); wall(U0, W, HD, W, H2)
  wall(U0, 0, U0, 3.4, H2); wall(U0, 6.75, U0, W, H2)
  glassWall(g, U0, 3.4, U0, 6.75, Y, H2)
  // гардеробные в углах
  wall(5.0, 0, 5.0, 2.2, H2); wall(5.0, 2.2, HD, 2.2, H2)
  wall(5.0, 7.6, 5.0, W, H2); wall(5.0, 7.6, HD, 7.6, H2)
  rr(g, 5.2, 6.8, 0.15, 0.6, YF, 2.0, M.woodL, 0.04); rr(g, 6.4, 6.85, 0.6, 2.0, YF, 2.0, M.woodL, 0.04)
  rr(g, 5.2, 6.8, W - 0.6, W - 0.15, YF, 2.0, M.woodL, 0.04); rr(g, 6.4, 6.85, 8.0, W - 0.6, YF, 2.0, M.woodL, 0.04)
  // коридор, две ванные посередине
  wall(3.9, 2.2, 3.9, 7.6, H2)
  wall(U0, 3.4, 1.0, 3.4, H2); wall(1.8, 3.4, 3.9, 3.4, H2)
  wall(U0, 6.75, 1.0, 6.75, H2); wall(1.8, 6.75, 3.9, 6.75, H2)
  wall(U0, 5.1, 3.9, 5.1, H2)
  for (const [a, b] of [[3.4, 5.1], [5.1, 6.75]]) {
    const m = (a + b) / 2
    shower(g, 2.95, 3.8, a + 0.1, b - 0.1, YF)
    toilet(g, 2.2, a < 4 ? a + 0.6 : b - 0.6, YF)
    vanity(g, 0.95, 1.65, a < 4 ? b - 0.55 : a + 0.05, a < 4 ? b - 0.05 : a + 0.55, YF)
    tub(g, U0 + 0.1, -0.2, m - 0.75, m + 0.75, YF)
  }
  // спальни: кровати изголовьем к торцевым стенам
  bed(g, 0.85, 3.05, 0.15, 2.4, 0.15, YF, M.teal)
  bed(g, 0.85, 3.05, 7.75, W - 0.15, W - 0.15, YF, M.coral)
  for (const v of [0.4, W - 0.4]) { rr(g, 0.25, 0.7, v - 0.22, v + 0.22, YF, 0.45, M.woodL, 0.04); rr(g, 3.2, 3.65, v - 0.22, v + 0.22, YF, 0.45, M.woodL, 0.04) }
  rr(g, U0 + 0.1, U0 + 0.55, 0.15, 1.9, YF, 0.75, M.wood, 0.04)
  rr(g, U0 + 0.1, U0 + 0.55, 8.25, W - 0.15, YF, 0.75, M.wood, 0.04)
  plant(g, 4.4, 0.4, YF, 0.7); plant(g, 4.4, W - 0.4, YF, 0.7)
}
P(floor1G, 1.65, 2.6, 4.4, Math.PI / 2, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.78, -2.0, 7.5, -0.6, 0.1, 0x4aa8a8, 0xf3ead8)
P(floor2G, 1.7, 4.45, 5.0, Math.PI / 2, YF, 0x7fae95, 0x4a3a2e)

const Y2 = H1 + 0.2
ToonKit.start({
  sub: '2 ' + Model3D.roomWord('bedroomsPlural'),
  facts: [
    { group: 'floor1', rooms: [['livingKitchen'], ['bath'], ['terrace'], ['pool']] },
    { group: 'floor2', rooms: [['bedroom', undefined, 2], ['bathroom', undefined, 2], ['hall']] },
  ],
  L1: [
    Lb('livingKitchen', undefined, 2.5, 2.0, 5.0),
    Lb('bath', undefined, 6.3, 2.2, 2.85),
    Lb('stairs', undefined, 6.3, 2.6, 6.0),
    Lb('pool', undefined, -3.2, 1.2, 2.35, true),
    Lb('terrace', undefined, -4.5, 1.6, 7.0, true),
    Lb('entrance', undefined, -1.05, 2.2, W + 0.5, true),
  ],
  L2: [
    Lb('bedroom', undefined, 1.8, Y2 + 1.9, 1.5),
    Lb('bedroom', undefined, 1.8, Y2 + 1.9, W - 1.5),
    Lb('bathroom', undefined, 1.2, Y2 + 1.7, 5.1),
    Lb('hall', undefined, 4.45, Y2 + 1.5, 6.4),
  ],
})
</script>
