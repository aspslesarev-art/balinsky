<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Со слайда застройщика «Свадебный сьют НМ.Т, 87,4 м²»: гостиная 28,7 м²,
// спальня 16,9, ванная 3,6, коридоры 3,1 и 4,1, терраса 31 (буквой Г,
// со столом на 6 и джакузи). Размеров нет — масштаб подобран по площадям
// гостиной, спальни и террасы (≈ 8.4 × 10.3 м без террасы).
const PLAN = { name: 'Baza Kedungu НМ.Т', W: 10.25, HD: 8.4, BACK: 2.6, FRONT: 0.5, H1: 3.0, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
const y = 0.12, LV = 4.44, GU = 1.91, EU = 6.48, BU = 4.94, BV = 6.42, CU = 2.72
rect(siteG, -BACK - 0.3, HD + 0.4, -0.3, W + 0.3, -0.3, 0.3, M.stone)
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, EU, 0, LV, 0, 0.12, M.slab)
  rect(g, EU, HD, 0, 2.1, 0, 0.12, M.slab)
  rect(g, GU, EU, LV, W, 0, 0.12, M.slab)
  floorPatch(g, 0, EU, 0, LV, y, T.terrazzo, 1.4)              // гостиная
  floorPatch(g, EU, HD, 0, 2.1, y, T.terrazzo, 1.4)            // коридор у входа
  floorPatch(g, BU, EU, LV, BV, y + 0.004, T.tiles, 0.8)       // ванная
  floorPatch(g, GU, BU, LV, BV, y, T.terrazzo, 1.4)            // коридор
  floorPatch(g, GU, EU, BV, W, y, T.planksDark, 1.6)           // спальня

  // наружные стены
  wall(0, 0, HD, 0, H1)
  wall(HD, 0, HD, 0.3, H1); wall(HD, 1.2, HD, 2.1, H1); door(g, HD, 0.3, 1.2, y)
  wall(EU, 2.1, HD, 2.1, H1); wall(EU, 2.1, EU, W, H1)
  wall(GU, W, EU, W, H1)
  glassWall(g, 0, 0, 0, LV, 0, H1)                             // гостиная к террасе
  wall(0, LV, GU, LV, H1)
  glassWall(g, GU, LV, GU, 8.5, 0, H1); wall(GU, 8.5, GU, W, H1)
  // ванная, коридор, спальня
  wall(CU, LV, 2.83, LV, H1); wall(3.5, LV, EU, LV, H1)
  wall(BU, LV, BU, 5.7, H1); wall(BU, 6.3, BU, BV, H1)
  wall(3.7, BV, EU, BV, H1); wall(GU, BV, CU, BV, H1)
  wall(CU, LV, CU, BV, H1)

  // кухня вдоль стены, остров с табуретами
  rr(g, 0.12, 3.7, 0.08, 0.95, y, 0.82, M.sage, 0.03)
  rect(g, 0.1, 3.7, 0.06, 0.97, 0.94, 0.05, M.white)
  rr(g, 0.12, 3.7, 0.08, 0.45, H1 - 1.1, 0.7, M.sage, 0.03)
  rr(g, 0.93, 3.2, 1.85, 2.6, y, 0.92, M.woodL, 0.04)
  rect(g, 0.9, 3.23, 1.82, 2.63, 1.04, 0.05, M.white)
  for (const u of [1.2, 1.75, 2.3, 2.85]) stool(g, u, 3.0, y)
  // гостиная: диван, столик, кресло
  rr(g, 3.7, 6.0, 1.3, 4.3, y, 0.012, M.cush, 0.005, false)
  rr(g, 5.4, 6.4, 1.55, 4.0, y, 0.42, M.sofa, 0.12)
  rr(g, 6.05, 6.4, 1.55, 4.0, y, 0.85, M.sofa, 0.12)
  rr(g, 5.6, 5.8, 2.0, 2.4, y + 0.42, 0.3, M.cush, 0.1)
  rr(g, 5.6, 5.8, 3.1, 3.5, y + 0.42, 0.3, M.mustard, 0.1)
  cyl(g, 4.5, 2.8, 0.42, 0.38, 0.36, y, M.woodL, 24)
  rr(g, 3.8, 4.6, 3.45, 4.25, y, 0.45, M.mustard, 0.15)
  // коридор у входа: шкаф
  rr(g, 6.6, 8.2, 1.3, 1.85, y, 2.1, M.wood, 0.04)

  // ванная: унитаз, душ; раковина в коридоре; шкаф
  toilet(g, 5.85, 5.1, y)
  shower(g, 5.0, 6.05, 5.45, BV - 0.08, y)
  vanity(g, 3.75, 4.3, 4.55, 6.3, y)
  rr(g, CU - 0.55, CU - 0.05, 4.55, BV - 0.05, y, 2.1, M.wood, 0.04)
  // спальня: кровать изголовьем к дальней стене, кресло
  bedU(g, 3.16, 5.5, 7.3, 9.0, 5.5, y, M.coral)
  rr(g, 5.1, 5.45, 6.8, 7.2, y, 0.45, M.woodL, 0.04); rr(g, 5.1, 5.45, 9.1, 9.5, y, 0.45, M.woodL, 0.04)
  rr(g, 5.75, 6.35, 7.8, 8.4, y, 0.45, M.grey, 0.15)
  plant(g, 2.2, W - 0.4, y, 0.8)
}
// ============ терраса ============
{
  const g = floor1G
  rect(g, -2.53, 0, 0, 9.0, 0, 0.1, texMat(T.deck, 3, 1), true, false)
  rect(g, 0, GU, LV, 9.0, 0, 0.1, texMat(T.deck, 1.6, 0.8), true, false)
  railing(g, -2.53, 0, -2.53, 9.0, 0.1); railing(g, -2.53, 9.0, GU, 9.0, 0.1); railing(g, -2.53, 0, 0, 0, 0.1)
  // стол на 6
  rr(g, -1.67, -1.1, 1.1, 3.64, 0.1 + 0.7, 0.06, M.woodL, 0.03)
  rr(g, -1.5, -1.25, 1.4, 3.3, 0.1, 0.7, M.wood, 0.03)
  for (const v of [1.6, 2.4, 3.2]) { chair(g, -0.6, v, 0.1, M.white); chair(g, -2.15, v, 0.1, M.white) }
  // кресла и столик
  rr(g, 0.4, 1.0, 5.0, 5.6, 0.1, 0.42, M.mustard, 0.15)
  rr(g, 0.9, 1.6, 6.0, 6.7, 0.1, 0.42, M.mustard, 0.15)
  roundTable(g, 1.2, 5.3, 0.1, 0.3)
  // джакузи
  rect(g, -2.35, -0.43, 6.8, 8.7, 0.1, 0.55, M.wood)
  rect(g, -2.2, -0.58, 6.95, 8.55, 0.6, 0.07, waterMat, false, false)
  plant(g, -0.35, 0.35, 0.1, 0.8)
}
P(floor1G, 1.65, 2.0, 3.4, -Math.PI / 2, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.75, -1.0, 4.4, 0.4, 0.1, 0x4aa8a8, 0xf3ead8)

ToonKit.start({
  sub: '87.4 m² · 1 ' + Model3D.roomWord('bedroom'),
  facts: [{ group: 'floor1', rooms: [['livingKitchen', 28.7], ['bedroom', 16.9], ['bathroom', 3.6], ['hall', 3.1], ['hall', 4.1], ['terrace', 31]] }],
  L1: [
    Lb('livingKitchen', 28.7, 3.0, 2.3, 2.6),
    Lb('bedroom', 16.9, 4.4, 2.3, 8.4),
    Lb('bathroom', 3.6, 5.7, 2.6, 5.4),
    Lb('hall', 3.1, 7.4, 2.4, 0.8),
    Lb('hall', 4.1, 3.3, 2.4, 5.4),
    Lb('terrace', 31, -1.3, 1.4, 5.8),
  ],
})
</script>
