<!DOCTYPE html>
<html lang="ru">
<head>

<title>Elysium A9.1 — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Elysium, Block 2, «Apartment 2.3.24 / 2.4.24 / 2.5.24 – A9.1» — угловая
// квартира со скошенной стеной. Площади — из таблицы на листе: комната
// 27.70, ванная 3.65, балконы 3.65 и 1.65, всего 36.65 м². Размеров на плане
// нет: масштаб подогнан под площадь комнаты, форма снята с чертежа.
const PLAN = { name: 'Elysium A9.1', W: 6.52, HD: 8.26, BACK: 0.98, FRONT: 0.4, H1: 3.0, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
const y = 0.12
/** Плоская плита-многоугольник по точкам [u, v]. */
function poly (g, pts, y0, h, mat) {
  const s = new THREE.Shape(pts.map(([u, v]) => new THREE.Vector2(v - cx, -(zOf(u) - cz))))
  const geo = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false }); geo.rotateX(-Math.PI / 2)
  const m = new THREE.Mesh(geo, mat); m.position.y = y0; m.receiveShadow = true; m.castShadow = true; edges(m); g.add(m); return m
}
/** Собрать мебель в осях и повернуть вокруг точки (u, v). */
function rotAround (g, cu, cv, ang, build) {
  const t = new THREE.Group(); build(t)
  const px = cv - cx, pz = zOf(cu) - cz
  t.children.forEach(c => { c.position.x -= px; c.position.z -= pz })
  t.position.set(px, 0, pz); t.rotation.y = ang; g.add(t)
}
const OUT = [[0, 2.88], [0, 6.52], [7.61, 6.52], [8.26, 5.6], [7.55, 4.73], [7.55, 2.88], [5.0, 2.88], [1.85, 0]]
poly(siteG, [[-1.3, 2.4], [-1.3, 6.82], [7.8, 6.82], [8.55, 5.6], [7.85, 4.6], [7.85, 2.6], [5.1, 2.6], [2.0, -0.4], [1.3, -0.5]], -0.3, 0.3, M.stone)
{
  const g = floor1G, wall = makeWall(g, 0)
  poly(g, OUT, 0, 0.12, M.slab)
  poly(g, OUT, y, 0.012, texMat(T.planks, 0.62, 0.62))
  rect(g, 5.0, 7.55, 2.88, 4.73, y + 0.004, 0.012, texMat(T.tiles, 2.3, 3.2), false, false)

  glassWall(g, 0, 2.88, 0, 6.52, 0, H1)
  wall(0, 6.52, 7.61, 6.52, H1)
  wall(8.26, 5.6, 7.55, 4.73, H1); wall(7.55, 4.73, 7.55, 2.88, H1)   // проём входа — на скосе у правой стены
  wall(7.55, 2.88, 5.0, 2.88, H1)
  wall(5.0, 2.88, 1.85, 0, H1)
  glassWall(g, 1.85, 0, 0, 2.88, 0, H1)
  // ванная
  wall(5.0, 2.88, 5.0, 4.73, H1); wall(5.0, 4.73, 6.55, 4.73, H1)
  door(g, 4.73, 6.55, 7.3, y, false, 0.4)
  vanity(g, 5.15, 5.65, 3.0, 3.9, y); toilet(g, 6.2, 3.55, y); shower(g, 6.55, 7.45, 3.0, 3.9, y)
  // шкаф над ванной, кухня вдоль правой стены, стол у окна
  rr(g, 4.24, 4.9, 2.9, 4.7, y, 2.0, M.woodL, 0.04)
  rr(g, 4.24, 6.85, 5.87, 6.47, y, 0.82, M.sage, 0.03)
  rect(g, 4.22, 6.87, 5.85, 6.49, 0.94, 0.05, M.white)
  rr(g, 4.24, 4.84, 5.87, 6.47, y, 1.9, M.steel, 0.06)
  rr(g, 0.27, 1.58, 5.76, 6.41, y, 0.75, M.woodL, 0.04)
  cyl(g, 0.9, 5.4, 0.18, 0.18, 0.45, y, M.white, 14)
  // столовая
  roundTable(g, 3.05, 6.05, y, 0.36)
  chair(g, 2.4, 6.0, y, M.white); chair(g, 3.05, 5.35, y, M.white); chair(g, 3.7, 6.0, y, M.white)
  // кресла со столиком у окна
  rr(g, 0.25, 0.95, 2.45, 3.1, y, 0.45, M.mustard, 0.18); rr(g, 0.25, 0.95, 3.95, 4.6, y, 0.45, M.mustard, 0.18)
  cyl(g, 0.6, 3.5, 0.3, 0.3, 0.5, y, M.white, 18)
  // кровать изголовьем к скошенной стене
  rotAround(g, 2.6, 2.34, -0.741, t => {
    rr(t, 1.6, 3.6, 1.2, 3.6, y, 0.012, M.cush, 0.005, false)
    bed(t, 1.7, 3.5, 1.34, 3.34, 1.34, y, M.teal)
    rr(t, 1.2, 1.6, 1.3, 1.7, y, 0.45, M.woodL, 0.04); rr(t, 3.6, 4.0, 1.3, 1.7, y, 0.45, M.woodL, 0.04)
  })
}
// ============ балконы ============
{
  const g = floor1G
  rect(g, -BACK, 0, 2.85, 6.52, 0, 0.1, texMat(T.deck, 1.6, 0.5), true, false)
  railing(g, -BACK, 2.85, -BACK, 6.52, 0.1); railing(g, -BACK, 6.52, 0, 6.52, 0.1)
  chair(g, -0.5, 5.6, 0.1, M.white); chair(g, -0.5, 6.1, 0.1, M.white)
  poly(g, [[1.85, 0], [0, 2.88], [-0.55, 2.6], [1.45, -0.3]], 0, 0.45, M.stone)
  for (const [u, v] of [[1.3, 0.35], [0.85, 1.05], [0.4, 1.75], [-0.05, 2.45]]) ball(g, u - 0.2, v - 0.15, 0.22, 0.62, M.leaf, 0.8)
}
P(floor1G, 1.65, 2.2, 4.8, -Math.PI / 2, y, 0xf08a6b, 0x4a5a78)

const OPTS = {
  sub: '36.65 m² · 1 ' + Model3D.roomWord('bedroom'),
  facts: [{ group: 'floor1', rooms: [['living', 27.7], ['bathroom', 3.65], ['balcony', 3.65], ['balcony', 1.65]] }],
  L1: [
    Lb('living', 27.7, 3.2, 2.2, 4.3),
    Lb('bathroom', 3.65, 6.2, 2.5, 3.8),
    Lb('balcony', 3.65, -0.5, 1.3, 4.6, true),
  ],
}
// Координаты сняты с чертежа сверху вниз — отражаем по ширине, чтобы
// план не вышел зеркальным (получается тот же план, повёрнутый на 180°).
for (const G of [floor1G, floor2G, siteG, labelsG]) for (const c of G.children) { c.position.x *= -1; c.rotation.y *= -1; c.scale.x *= -1 }
ToonKit.start(OPTS)
</script>
</body>
