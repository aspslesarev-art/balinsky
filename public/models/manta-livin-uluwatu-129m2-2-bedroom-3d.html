<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manta Livin 2BR — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Размеры — с чертежей BODES studio «apartment 128.7 sq.m.» (М 1:40):
// участок 12.5 × 10.0 м, дом 6.1 м в глубину, терраса с бассейном 3.9 м,
// бассейн 6.0 × 2.3 м; 2 этаж 12.5 × 7.0 м с балконами по 1.0 м.
// Площади — из экспликации: гостиная 50.8, туалет 2.0, кладовые 2.2 и 3.6,
// коридор 9.2, спальни по 13.6, гардеробные 4.6 и 4.3, ванные по 8.6,
// балконы по 3.8, терраса 40.1, бассейн 13.8; всего 128.7 м².
const PLAN = { name: 'Manta Livin 2BR', W: 12.5, HD: 5.8, BACK: 4.2, FRONT: 1.2, H1: 3.0, H2: 3.0, floors: 2 }
</script>
<script src="_toon-kit.js"></script>
<script>
lot()
const y = 0.12, VL = 1.1
// ============ 1 этаж ============
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, VL, W, 0, 0.12, M.slab)
  floorPatch(g, 0, 4.5, VL, W, y, T.terrazzo, 2)
  floorPatch(g, 4.5, HD, VL, 8.2, y, T.terrazzo, 2)
  floorPatch(g, 4.3, HD, 8.3, 10.3, y + 0.004, T.tiles, 0.8)
  floorPatch(g, 4.4, HD, 10.4, W, y + 0.004, T.planks, 1.6)
  rect(g, -BACK, HD, 0, VL, 0, 0.06, texMat(T.grass, 0.6, 5), false, false)   // зелёная полоса слева
  for (const u of [-3.4, -1.2, 1.0, 3.0, 5.0]) plant(g, u, 0.5, 0.06, 0.9)

  wall(HD, VL, HD, W, H1)
  wall(4.5, VL, HD, VL, H1); glassWall(g, 0, VL, 4.5, VL, 0, H1)
  wall(0, W, HD, W, H1)
  glassWall(g, 0, VL, 0, 11.6, 0, H1); wall(0, 11.6, 0, W, H1)
  // лестница над кладовой, туалет, кладовая у кухни
  wall(4.5, VL, 4.5, 2.9, H1)
  wall(4.5, 3.0, 4.5, 7.1, 1.1)
  for (let i = 0; i < 14; i++) rect(g, 4.6, 5.7, 3.0 + i * 0.29, 3.29 + i * 0.29, y, 0.21 * (i + 1), M.woodL)
  wall(4.3, 8.3, HD, 8.3, H1); wall(4.3, 8.3, 4.3, 8.8, H1); wall(4.3, 9.6, 4.3, 10.3, H1)
  wall(4.3, 10.3, HD, 10.3, H1); wall(4.4, 10.4, 4.4, 10.7, H1); wall(4.4, 11.5, 4.4, W, H1)
  toilet(g, 5.35, 9.6, y); vanity(g, 4.4, 4.9, 8.4, 8.9, y)
  rr(g, 4.5, 5.7, 11.9, 12.4, y, 2.0, M.woodL, 0.04)

  // гостиная: ТВ на стене лестницы, диван с оттоманкой спинкой к стеклу
  rect(g, 4.4, 4.46, 4.6, 6.6, 0.9, 0.7, M.dark)
  rr(g, 0.6, 3.2, 2.9, 6.6, y, 0.012, M.cush, 0.005, false)
  rr(g, 1.75, 2.75, 4.2, 6.4, y, 0.42, M.sofa, 0.12)
  rr(g, 1.75, 2.05, 3.0, 6.4, y, 0.85, M.sofa, 0.12)
  rr(g, 1.75, 3.4, 3.0, 4.2, y, 0.42, M.sofa, 0.12)
  rr(g, 2.05, 2.25, 4.7, 5.1, y + 0.42, 0.3, M.cush, 0.1); rr(g, 2.05, 2.25, 5.6, 6.0, y + 0.42, 0.3, M.mustard, 0.1)
  cyl(g, 3.6, 5.7, 0.4, 0.36, 0.38, y, M.woodL, 24)
  rr(g, 2.8, 3.8, 1.4, 2.0, y, 0.75, M.wood, 0.04)
  // столовая на 8 вдоль глубины
  rr(g, 1.2, 3.3, 7.4, 8.3, y + 0.7, 0.06, M.wood, 0.03)
  rr(g, 2.0, 2.5, 7.6, 8.1, y, 0.7, M.dark, 0.03)
  for (const u of [1.6, 2.25, 2.9]) { chair(g, u, 7.1, y, M.white); chair(g, u, 8.6, y, M.white) }
  chair(g, 0.9, 7.85, y, M.white); chair(g, 3.6, 7.85, y, M.white)
  // кухня: линия у правой стены, остров с табуретами
  rr(g, 0.1, 4.2, 11.65, W - 0.08, y, 0.82, M.sage, 0.03)
  rect(g, 0.1, 4.2, 11.63, W - 0.08, 0.94, 0.05, M.white)
  rr(g, 3.4, 4.2, 11.65, W - 0.08, y, 2.0, M.steel, 0.06)
  rr(g, 0.9, 3.3, 9.8, 10.6, y, 0.92, M.white, 0.04)
  rect(g, 0.85, 3.35, 9.75, 10.65, 1.04, 0.05, M.white)
  for (const u of [1.3, 1.85, 2.4, 2.95]) stool(g, u, 9.35, y, M.dark)
  plant(g, 0.5, 6.6, y, 0.7)
}
// ============ терраса с бассейном ============
{
  const g = floor1G, fence = makeWall(siteG, 0)
  rect(g, -BACK, 0, VL, W, 0, 0.1, texMat(T.terrazzo, 5, 2), true, false)
  pool(g, -3.7, -1.4, 2.9, 8.9, 0.1)
  lounger(g, -2.2, -1.6, 0.6, 2.6, 0.1, true)
  lounger(g, -3.5, -2.9, 0.6, 2.6, 0.1, true)
  for (const v of [9.8, 11.8]) plant(g, -3.7, v, 0.1, 1.0)
  fence(-BACK, 0, -BACK, W, 2.0); fence(-BACK, 0, HD, 0, 2.0); fence(-BACK, W, 0, W, 2.0)
}
// ============ 2 этаж ============
const Y = H1 + 0.18, YF = Y + 0.04
const UB = -1.2
{
  const g = floor2G, wall = makeWall(g, Y)
  // перекрытие с проёмом над лестницей
  rect(g, UB, 4.6, VL, W, H1, 0.18, M.wood); rect(g, UB, 4.6, VL, W, Y, 0.04, M.slab, true, false)
  rect(g, 4.6, HD, VL, 4.2, H1, 0.18, M.wood); rect(g, 4.6, HD, VL, 4.2, Y, 0.04, M.slab, true, false)
  rect(g, 4.6, HD, 6.8, W, H1, 0.18, M.wood); rect(g, 4.6, HD, 6.8, W, Y, 0.04, M.slab, true, false)
  floorPatch(g, 0, 3.7, VL, 4.0, YF, T.terrazzo, 2)
  floorPatch(g, 0, 3.7, 8.35, W, YF, T.terrazzo, 2)
  floorPatch(g, 3.7, HD, VL, W, YF, T.terrazzo, 2)
  floorPatch(g, UB, 3.7, 4.0, 8.35, YF, T.tiles, 0.8)
  for (const [a, b] of [[VL, 4.0], [8.35, W]]) floorPatch(g, UB, 0, a, b, YF, T.deck, 1)
  railing(g, 4.6, 4.2, 4.6, 6.8, YF); railing(g, 4.6, 6.8, HD, 6.8, YF)

  wall(HD, VL, HD, W, H2)
  wall(UB, VL, HD, VL, H2); wall(UB, W, HD, W, H2)
  glassWall(g, 0, VL, 0, 4.0, Y, H2); glassWall(g, 0, 8.35, 0, W, Y, H2)
  railing(g, UB, VL, UB, 4.0, YF); railing(g, UB, 8.35, UB, W, YF)
  // гардеробные по углам у коридора
  wall(3.7, VL, 3.7, 1.6, H2); wall(3.7, 2.5, 3.7, 4.0, H2); wall(3.7, 2.9, HD, 2.9, H2)
  wall(3.7, 8.35, 3.7, 9.6, H2); wall(3.7, 10.6, 3.7, W, H2); wall(3.7, 9.8, HD, 9.8, H2)
  rr(g, 3.85, 5.6, VL + 0.1, 1.6, YF, 2.1, M.woodL, 0.04); rr(g, 3.85, 5.6, 2.25, 2.75, YF, 2.1, M.woodL, 0.04)
  rr(g, 3.85, 5.6, 9.95, 10.45, YF, 2.1, M.woodL, 0.04); rr(g, 3.85, 5.6, 11.85, W - 0.1, YF, 2.1, M.woodL, 0.04)
  // две ванные посередине: ванна у балкона, раковины у общей стены
  wall(UB, 4.0, 3.7, 4.0, H2); wall(UB, 8.35, 3.7, 8.35, H2)
  wall(3.7, 4.0, 3.7, 4.4, H2); wall(3.7, 5.2, 3.7, 7.15, H2); wall(3.7, 7.95, 3.7, 8.35, H2)
  wall(UB, 6.15, 3.7, 6.15, H2); wall(UB, 4.0, UB, 8.35, H2)
  for (const s of [1, -1]) {
    const V = v => (s === 1 ? v : 12.3 - v)
    const sp = (a, b) => (s === 1 ? [a, b] : [12.3 - b, 12.3 - a])
    toilet(g, 3.2, V(5.6), YF)
    vanity(g, 1.4, 2.9, ...sp(5.55, 6.05), YF)
    shower(g, 0.1, 1.2, ...sp(4.15, 6.0), YF)
    tub(g, UB + 0.1, -0.15, ...sp(4.3, 5.85), YF)
  }
  // спальни: кровати изголовьем к торцевым стенам
  bed(g, 0.8, 2.6, VL + 0.1, 3.1, VL + 0.1, YF, M.teal)
  bed(g, 0.8, 2.6, 10.2, W - 0.1, W - 0.1, YF, M.coral)
  for (const v of [VL + 0.35, W - 0.35]) { rr(g, 0.2, 0.6, v - 0.2, v + 0.2, YF, 0.45, M.woodL, 0.04); rr(g, 2.8, 3.2, v - 0.2, v + 0.2, YF, 0.45, M.woodL, 0.04) }
  rr(g, 0.8, 2.6, 3.5, 3.85, YF, 0.75, M.wood, 0.04); rr(g, 0.8, 2.6, 8.5, 8.85, YF, 0.75, M.wood, 0.04)
  for (const v of [1.8, 10.8]) { rr(g, -0.95, -0.2, v, v + 0.8, YF, 0.45, M.mustard, 0.15); plant(g, -0.6, v - 0.5, YF, 0.6) }
}
P(floor1G, 1.65, 2.5, 9.0, Math.PI / 2, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.78, -2.5, 10.0, -0.5, 0.1, 0x4aa8a8, 0xf3ead8)
P(floor2G, 1.7, 4.2, 7.5, -Math.PI / 2, YF, 0x7fae95, 0x4a3a2e)

const Y2 = H1 + 0.2
ToonKit.start({
  sub: '128.7 m² · 2 ' + Model3D.roomWord('bedroomsPlural'),
  facts: [
    { group: 'floor1', rooms: [['livingKitchen', 50.8], ['bath', 2.0], ['terrace', 40.1], ['pool', 13.8]] },
    { group: 'floor2', rooms: [['bedroom', 13.6, 2], ['bathroom', 8.6, 2], ['balcony', 3.8, 2], ['hall', 9.2]] },
  ],
  L1: [
    Lb('livingKitchen', 50.8, 2.4, 2.2, 6.0),
    Lb('bath', 2.0, 5.0, 2.4, 9.3),
    Lb('stairs', undefined, 5.1, 2.8, 4.0),
    Lb('pool', 13.8, -2.5, 1.2, 5.9, true),
    Lb('terrace', 40.1, -2.6, 1.6, 10.8, true),
  ],
  L2: [
    Lb('bedroom', 13.6, 1.8, Y2 + 1.9, 2.5),
    Lb('bedroom', 13.6, 1.8, Y2 + 1.9, 10.2),
    Lb('bathroom', 8.6, 1.4, Y2 + 1.7, 5.0),
    Lb('bathroom', 8.6, 1.4, Y2 + 1.7, 7.3),
    Lb('hall', 9.2, 4.2, Y2 + 1.5, 8.2),
  ],
})
</script>
