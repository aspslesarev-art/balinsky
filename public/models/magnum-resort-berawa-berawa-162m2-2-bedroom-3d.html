<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnum Resort 2BR — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Рабочий план апартамента с размерами и площадями: гостиная 33.2 м²
// (6.5 × 7.3 м вместе с кухней), кухня 15.5, спальни по 15.5 (3.2 м
// шириной), ванные по 8.7, балкон 50.3. Общей площади на плане нет.
// Квартира ≈ 13.8 × 7.85 м, балкон ≈ 3.65 м во всю ширину.
const PLAN = { name: 'Magnum Resort 2BR', W: 13.8, HD: 7.85, BACK: 3.65, FRONT: 0.5, H1: 3.0, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
rect(siteG, -BACK - 0.3, HD + 0.3, -0.3, W + 0.3, -0.3, 0.3, M.stone)
const y = 0.12, LV = 3.4, RV = 10.0, BU = 5.25, WU = 4.47   // LV/RV — стены гостиной, BU — низ ванных, WU — шкафы
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  floorPatch(g, 0, HD, LV, RV, y, T.terrazzo, 2)                // гостиная и кухня

  wall(0, 0, HD, 0, H1); wall(0, W, HD, W, H1)
  wall(HD, 0, HD, 8.9, H1); wall(HD, 9.75, HD, W, H1)
  door(g, HD, 8.9, 9.75, y)
  glassWall(g, 0, 0, 0, LV, 0, H1); glassWall(g, 0, LV, 0, RV, 0, H1); glassWall(g, 0, RV, 0, W, 0, H1)

  // две одинаковые половины: спальня + ванная, правая — зеркало левой
  for (const s of [1, -1]) {
    const V = v => (s === 1 ? v : W - v)
    const span = (a, b) => (s === 1 ? [a, b] : [W - b, W - a])
    floorPatch(g, 0, BU, ...span(0, LV), y + 0.004, T.planksDark, 1.6)
    floorPatch(g, BU, HD, ...span(0, LV), y + 0.008, T.tiles, 0.8)
    // спальня | гостиная, дверь у кухни
    wall(0, V(LV), 4.5, V(LV), H1); wall(5.2, V(LV), HD, V(LV), H1)
    door(g, V(LV), 4.5, 5.2, y, false, s * 0.5)
    // ванная
    wall(BU, V(0), BU, V(2.0), H1); wall(BU, V(3.1), BU, V(LV), H1)
    // спальня: шкаф, кровать изголовьем к наружной стене, ТВ на стене гостиной
    rr(g, WU, BU - 0.1, ...span(0.15, 1.9), y, 2.1, M.wood, 0.04)
    bed(g, 1.3, 3.3, ...span(0.15, 2.4), V(0.15), y, s === 1 ? M.teal : M.coral)
    rr(g, 0.8, 1.2, ...span(0.15, 0.55), y, 0.45, M.woodL, 0.04); rr(g, 3.4, 3.8, ...span(0.15, 0.55), y, 0.45, M.woodL, 0.04)
    rr(g, 1.4, 3.6, ...span(LV - 0.3, LV - 0.1), y + 0.9, 0.7, M.dark, 0.02)
    rr(g, 1.0, 3.6, ...span(0.9, 2.9), y, 0.012, M.cush, 0.005, false)
    // ванная: душ, туалет, двойная раковина
    shower(g, BU + 0.1, 6.3, ...span(0.15, 1.1), y)
    toilet(g, 6.8, V(0.4), y)
    vanity(g, HD - 0.6, HD - 0.08, ...span(1.6, 2.9), y)
  }

  // кухня вдоль задней стены, колонна, остров с тремя табуретами
  rr(g, HD - 0.6, HD - 0.05, LV + 0.1, 8.45, y, 0.82, M.sage, 0.03)
  rect(g, HD - 0.62, HD - 0.05, LV + 0.05, 8.5, 0.94, 0.05, M.white)
  rr(g, HD - 0.35, HD - 0.05, LV + 0.1, 8.45, H1 - 1.1, 0.7, M.sage, 0.03)
  rr(g, 5.9, 7.1, RV - 0.6, RV - 0.05, y, 2.2, M.steel, 0.05)
  rr(g, 5.8, 6.4, 3.9, 6.5, y, 0.92, M.woodL, 0.04)
  rect(g, 5.75, 6.45, 3.85, 6.55, 1.04, 0.05, M.white)
  for (const v of [4.6, 5.3, 6.0]) stool(g, 5.25, v, y)
  // столовая на 6
  rr(g, 2.0, 4.25, 4.85, 5.75, y + 0.7, 0.06, M.woodL, 0.03)
  rr(g, 2.6, 3.65, 5.1, 5.5, y, 0.7, M.wood, 0.03)
  for (const u of [2.5, 3.1, 3.7]) { chair(g, u, 4.4, y, M.mustard); chair(g, u, 6.2, y, M.mustard) }
  // гостиная: диван буквой Г, столик, кресло
  rr(g, 1.4, 4.4, 6.8, 9.1, y, 0.012, M.cush, 0.005, false)
  rr(g, 1.6, 2.4, 6.9, 8.9, y, 0.42, M.sofa, 0.12); rr(g, 1.6, 1.9, 6.9, 8.9, y, 0.85, M.sofa, 0.12)
  rr(g, 2.4, 4.1, 8.1, 8.9, y, 0.42, M.sofa, 0.12); rr(g, 2.4, 4.1, 8.6, 8.9, y, 0.85, M.sofa, 0.12)
  rr(g, 2.0, 2.2, 7.3, 7.7, y + 0.42, 0.3, M.cush, 0.1); rr(g, 3.0, 3.4, 8.2, 8.4, y + 0.42, 0.3, M.teal, 0.1)
  rr(g, 2.8, 3.5, 7.2, 8.0, y, 0.38, M.woodL, 0.04)
  rr(g, 4.2, 4.9, 7.0, 7.7, y, 0.45, M.mustard, 0.15)
  plant(g, 0.4, RV - 0.4, y, 0.9)
}
// ============ балкон во всю ширину ============
{
  const g = floor1G
  rect(g, -BACK, 0, 0, W, 0, 0.1, texMat(T.deck, 5, 1.4), true, false)
  railing(g, -BACK, 0, -BACK, W, 0.1); railing(g, -BACK, 0, 0, 0, 0.1); railing(g, -BACK, W, 0, W, 0.1)
  for (const v of [LV, 10.3]) regWall(rect(g, -3.3, -2.7, v - 0.3, v + 0.3, 0, H1, M.stone), H1)
  // у спальни 1 — лежак-кровать, у гостиной — шезлонги и стол, у спальни 2 — диван
  rr(g, -2.45, -0.9, 0.3, 2.3, 0.1, 0.4, M.white, 0.1)
  lounger(g, -2.45, -0.6, 3.9, 4.6, 0.1); lounger(g, -2.45, -0.6, 5.3, 6.0, 0.1)
  roundTable(g, -2.0, 5.0, 0.1, 0.3)
  rr(g, -2.25, -1.25, 7.4, 9.6, 0.8, 0.06, M.woodL, 0.15); cyl(g, -1.75, 8.5, 0.12, 0.25, 0.7, 0.1, M.wood, 12)
  for (const v of [7.9, 8.5, 9.1]) { chair(g, -0.85, v, 0.1, M.white); chair(g, -2.65, v, 0.1, M.white) }
  rr(g, -2.6, -0.3, 13.0, 13.6, 0.1, 0.42, M.sofa, 0.12); rr(g, -2.6, -0.3, 13.3, 13.6, 0.1, 0.8, M.sofa, 0.12)
  rr(g, -2.0, -1.2, 11.9, 12.6, 0.1, 0.4, M.woodL, 0.04)
  plant(g, -3.3, 0.4, 0.1, 0.9); plant(g, -3.3, W - 0.4, 0.1, 0.9)
}
P(floor1G, 1.65, 6.9, 7.2, Math.PI, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.78, -1.5, 6.6, 0.3, 0.1, 0x4aa8a8, 0xf3ead8)
P(floor1G, 1.6, 2.6, 11.5, -Math.PI / 2, y, 0x7fae95, 0x4a3a2e)

ToonKit.start({
  sub: '2 ' + Model3D.roomWord('bedroomsPlural'),
  facts: [{ group: 'floor1', rooms: [['living', 33.2], ['kitchen', 15.5], ['bedroom', 15.5, 2], ['bathroom', 8.7, 2], ['balcony', 50.3]] }],
  L1: [
    Lb('living', 33.2, 2.8, 2.3, 6.7),
    Lb('kitchen', 15.5, 6.6, 2.4, 6.2),
    Lb('bedroom', 15.5, 2.2, 2.2, 1.6),
    Lb('bedroom', 15.5, 2.2, 2.2, W - 1.6),
    Lb('bathroom', 8.7, 6.5, 2.4, 1.6),
    Lb('bathroom', 8.7, 6.5, 2.4, W - 1.6),
    Lb('balcony', 50.3, -1.8, 1.4, 10.8),
  ],
})
</script>
</body>
</html>
