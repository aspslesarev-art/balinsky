<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solvyn City 3BR — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Лист застройщика «Solvyn City · Three-Bedroom Villa» (Sansara Development):
// площадь 129 м², участок 126 м², бассейн 15 м², 2 этажа, 3 спальни,
// 3 ванные + гостевой туалет. Размеров и площадей комнат на листе нет —
// масштаб посчитан из площади участка и бассейна (≈ 11.8 × 10.8 м,
// дом 10.7 м + боковая полоса с уличным душем). 2 этаж нависает над
// террасой и бассейном.
const PLAN = { name: 'Solvyn City 3BR', W: 11.8, HD: 10.8, BACK: 0.6, FRONT: 1.6, H1: 3.2, H2: 2.9, floors: 2 }
</script>
<script src="_toon-kit.js"></script>
<script>
lot()
const y = 0.12, HW = 10.7, LV = 3.75, LU = 5.3      // HW — правая стена дома, LV/LU — границы гостиной
// ступени-проступи (лёгкая лестница без подступёнков)
function flightV (g, v1, v2, u1, u2, y1, y2, n = 9) {
  for (let i = 0; i < n; i++) {
    const a = v1 + (v2 - v1) * i / n, b = v1 + (v2 - v1) * (i + 1) / n
    rect(g, u1, u2, Math.min(a, b), Math.max(a, b), y1 + (y2 - y1) * (i + 1) / n - 0.06, 0.06, M.woodL)
  }
}
// ============ 1 этаж ============
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, HW, 0, 0.12, M.slab)
  floorPatch(g, LU, HD, LV, HW, y, T.terrazzo, 2)               // гостиная-кухня
  floorPatch(g, 8.05, HD, 0, LV, y, T.terrazzo, 2)
  floorPatch(g, 0, 5.9, 0, LV, y + 0.004, T.planksDark, 1.6)    // спальня
  floorPatch(g, 5.9, 8.05, 0, LV, y + 0.006, T.tiles, 0.8)      // ванная
  floorPatch(g, 8.15, 9.4, 1.5, 3.65, y + 0.008, T.tiles, 0.8)  // гостевой туалет

  wall(0, 0, HD, 0, H1); wall(HD, 0, HD, HW, H1)
  wall(6.4, HW, HD, HW, H1)                                     // вход сбоку: проём 5.3–6.4
  door(g, HW, 5.4, 6.3, y, false, 0.5)
  wall(0, 0, 0, LV, H1)
  glassWall(g, 0, LV, LU, LV, 0, H1); wall(LU, LV, 5.9, LV, H1)
  glassWall(g, LU, LV, LU, HW, 0, H1)
  // ванная спальни
  wall(5.9, 0, 5.9, 2.5, H1); wall(5.9, 3.4, 5.9, LV, H1)
  wall(8.05, 0, 8.05, LV, H1); wall(5.9, 3.65, 8.05, 3.65, H1)
  // гостевой туалет под лестницей
  wall(8.15, 1.5, 9.4, 1.5, 2.3); wall(9.4, 1.5, 9.4, 3.65, 2.3)
  wall(8.15, 3.65, 8.5, 3.65, 2.3)
  door(g, 3.65, 8.5, 9.3, y, false, -0.5)
  toilet(g, 8.75, 1.9, y); vanity(g, 8.25, 8.65, 2.9, 3.55, y)

  // спальня: кровать изголовьем к левой стене, шкаф у террасы
  bed(g, 2.35, 4.55, 0.15, 2.7, 0.15, y, M.teal)
  cyl(g, 4.9, 0.4, 0.22, 0.22, 0.5, y, M.woodL, 16); cyl(g, 1.9, 0.4, 0.22, 0.22, 0.5, y, M.woodL, 16)
  rr(g, 0.15, 0.8, 0.15, 3.5, y, 2.1, M.wood, 0.04)
  rr(g, 1.4, 2.2, 0.8, 3.0, y, 0.012, M.cush, 0.005, false)
  // ванная: душ, туалет, раковина
  shower(g, 6.1, 7.95, 0.15, 1.3, y)
  toilet(g, 7.6, 1.85, y)
  vanity(g, 7.4, 7.95, 2.6, 3.5, y)

  // кухня вдоль задней стены
  rr(g, HD - 0.7, HD - 0.05, 5.4, HW - 0.1, y, 0.82, M.sage, 0.03)
  rect(g, HD - 0.72, HD - 0.05, 5.35, HW - 0.1, 0.94, 0.05, M.white)
  rr(g, HD - 0.4, HD - 0.05, 5.4, HW - 0.1, H1 - 1.1, 0.7, M.sage, 0.03)
  rr(g, HD - 0.7, HD - 0.05, HW - 0.75, HW - 0.1, y, 1.9, M.steel, 0.06)
  // столовая: круглый стол на 4
  roundTable(g, 7.45, 5.4, y, 0.5)
  for (const [du, dv] of [[0.75, 0], [-0.75, 0], [0, 0.75], [0, -0.75]]) chair(g, 7.45 + du, 5.4 + dv, y, M.teal)
  rr(g, 6.4, 7.4, LV + 0.1, LV + 0.35, y, 0.8, M.wood, 0.04)       // консоль
  // гостиная: диван, ковёр, столик, ТВ у правой стены
  rr(g, 5.9, 8.4, 7.0, 9.3, y, 0.012, M.mustard, 0.005, false)
  rr(g, 6.0, 8.3, 6.8, 7.6, y, 0.42, M.sofa, 0.12)
  rr(g, 6.0, 8.3, 6.8, 7.1, y, 0.85, M.sofa, 0.12)
  rr(g, 6.5, 6.9, 7.15, 7.35, y + 0.42, 0.3, M.cush, 0.1)
  rr(g, 7.4, 7.8, 7.15, 7.35, y + 0.42, 0.3, M.teal, 0.1)
  cyl(g, 7.9, 8.85, 0.3, 0.28, 0.4, y, M.woodL, 20)
  rr(g, 6.4, 7.9, HW - 0.5, HW - 0.1, y, 0.45, M.wood, 0.04)
  rect(g, 6.65, 7.65, HW - 0.2, HW - 0.14, 0.9, 0.6, M.dark)
  plant(g, 5.7, HW - 0.4, y, 0.8)

  // лестница с поворотом: марш вверх к площадке у левой стены и обратно
  const Hm = (H1 + 0.18) / 2
  flightV(g, 3.9, 1.6, 9.45, 10.55, y, Hm)
  rect(g, 8.35, 10.55, 0.2, 1.6, y, Hm - y, M.woodL)
  flightV(g, 1.6, 3.95, 8.35, 9.4, Hm, H1 + 0.18)
}
// ============ терраса, бассейн, боковая дорожка ============
{
  const g = floor1G
  rect(g, 0, LU, LV, W, 0, 0.1, texMat(T.deck, 3, 2), true, false)
  rect(g, LU, HD, HW, W, 0, 0.1, texMat(T.deck, 0.6, 2.5), true, false)
  pool(g, 0.1, 4.3, 7.8, 11.2, 0.1)
  lounger(g, 1.95, 2.6, 4.9, 7.1, 0.1, true)
  lounger(g, 0.4, 1.05, 4.9, 7.1, 0.1, true)
  shower(g, 5.5, 6.2, 11.0, 11.7, 0.1)
  cyl(g, 5.85, 11.35, 0.04, 0.04, 2.1, 0.1, M.steel, 8, false)
  plant(g, HD - 0.4, W - 0.5, 0.1, 0.9); plant(g, 4.9, LV + 0.4, 0.1, 0.8)
}

// ============ 2 этаж ============
const Y = H1 + 0.18, YF = Y + 0.04
const B2 = 5.13, BV = 5.58                  // южный край верхнего блока и правый край спальни 2
{
  const g = floor2G, wall = makeWall(g, Y)
  const slab = (u1, u2, v1, v2) => { rect(g, u1, u2, v1, v2, H1, 0.18, M.wood); rect(g, u1, u2, v1, v2, Y, 0.04, M.slab, true, false) }
  slab(B2, 8.35, 0, W); slab(8.35, HD, 4.0, W); slab(0, B2, 0, BV)
  floorPatch(g, 0, B2, 0, BV, YF, T.planksDark, 1.6)            // спальня 2
  floorPatch(g, B2, 8.8, 5.75, W, YF, T.planksDark, 1.6)        // спальня 3
  floorPatch(g, 8.8, HD, 5.75, 7.6, YF, T.planksDark, 1.6)
  floorPatch(g, 6.0, 8.1, 0, 4.0, YF + 0.004, T.tiles, 0.8)     // ванная 2
  floorPatch(g, 8.8, HD, 7.6, W, YF + 0.004, T.tiles, 0.8)      // ванная 3
  floorPatch(g, B2, 6.0, 0, 4.0, YF, T.planks, 1.6)             // холл
  floorPatch(g, B2, HD, 4.0, 5.75, YF, T.planks, 1.6)

  wall(0, 0, HD, 0, H2); wall(HD, 0, HD, W, H2); wall(B2, W, HD, W, H2)
  glassWall(g, 0, 0, 0, BV, Y, H2); wall(0, BV, B2, BV, H2)
  wall(B2, BV, B2, 7.3, H2); glassWall(g, B2, 7.3, B2, W, Y, H2)
  railing(g, 8.35, 4.0, HD, 4.0, YF); railing(g, 8.35, 0, 8.35, 4.0, YF)
  // спальня 2 | холл, двери
  wall(B2, 0, B2, 2.8, H2); wall(B2, 3.8, B2, BV, H2)
  door(g, B2, 2.8, 3.8, YF)
  // ванная 2
  wall(6.0, 0, 6.0, 4.0, H2); wall(8.1, 0, 8.1, 4.0, H2)
  wall(6.0, 4.0, 6.2, 4.0, H2); wall(7.0, 4.0, 8.1, 4.0, H2)
  // спальня 3 и её ванная
  wall(B2, 5.75, 7.4, 5.75, H2); wall(8.2, 5.75, HD, 5.75, H2)
  door(g, 5.75, 7.4, 8.2, YF, false)
  wall(8.8, 7.6, 8.8, W, H2)
  wall(8.8, 7.6, 9.3, 7.6, H2); wall(10.1, 7.6, HD, 7.6, H2)

  // спальня 2: кровать изголовьем к перегородке-столу
  bedU(g, 0.95, 3.35, 1.45, 3.85, 3.35, YF, M.coral)
  rr(g, 3.45, 3.6, 0.95, 4.25, YF, 1.2, M.wood, 0.03)
  rr(g, 3.65, 4.15, 1.5, 3.7, YF, 0.75, M.woodL, 0.04)
  chair(g, 4.5, 2.6, YF, M.mustard)
  rr(g, 0.6, 1.3, 0.15, 0.45, YF, 0.75, M.woodL, 0.04)
  rr(g, B2 + 0.1, 5.9, 0.25, 2.5, YF, 2.1, M.wood, 0.04)       // шкаф в холле
  // ванная 2
  shower(g, 6.1, 7.95, 0.15, 1.4, YF)
  toilet(g, 7.6, 2.15, YF)
  vanity(g, 7.4, 8.0, 2.9, 3.8, YF)
  // спальня 3: кровать, рабочий стол, консоль
  bedU(g, 6.5, 8.7, 8.35, 10.7, 8.7, YF, M.teal)
  rr(g, 9.6, 10.5, 5.9, 7.4, YF, 0.75, M.woodL, 0.04); chair(g, 9.3, 6.6, YF, M.mustard)
  rr(g, 5.6, 7.1, W - 0.45, W - 0.1, YF, 0.75, M.wood, 0.04)
  plant(g, 5.5, 6.1, YF, 0.7)
  // ванная 3
  vanity(g, 10.05, 10.6, 7.9, 8.8, YF)
  toilet(g, 10.25, 9.6, YF)
  shower(g, 8.9, 10.6, 10.5, W - 0.1, YF)
}
P(floor1G, 1.65, 9.6, 7.0, Math.PI, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.78, 3.4, 5.6, 0.4, 0.1, 0x4aa8a8, 0xf3ead8)
P(floor2G, 1.7, 6.8, 4.8, Math.PI / 2, YF, 0x7fae95, 0x4a3a2e)

const Y2 = H1 + 0.2
ToonKit.start({
  sub: '129 m² · 3 ' + Model3D.roomWord('bedroomsPlural'),
  facts: [
    { group: 'floor1', rooms: [['livingKitchen'], ['bedroom'], ['bathroom'], ['bath'], ['terrace'], ['pool', 15]] },
    { group: 'floor2', rooms: [['bedroom', undefined, 2], ['bathroom', undefined, 2], ['hall']] },
  ],
  L1: [
    Lb('livingKitchen', undefined, 8.0, 2.3, 7.4),
    Lb('bedroom', undefined, 3.0, 2.2, 1.9),
    Lb('bathroom', undefined, 7.0, 2.4, 1.6),
    Lb('bath', undefined, 8.8, 2.6, 2.6),
    Lb('entrance', undefined, 5.85, 1.4, 11.3, true),
    Lb('terrace', undefined, 4.6, 1.2, 7.4, true),
    Lb('pool', 15, 2.2, 1.3, 9.5, true),
  ],
  L2: [
    Lb('bedroom', undefined, 2.2, Y2 + 1.9, 2.8),
    Lb('bedroom', undefined, 6.9, Y2 + 1.9, 9.4),
    Lb('bathroom', undefined, 7.0, Y2 + 1.8, 2.0),
    Lb('bathroom', undefined, 9.7, Y2 + 1.8, 9.6),
    Lb('hall', undefined, 6.8, Y2 + 1.6, 4.9),
  ],
})
</script>
</body>
