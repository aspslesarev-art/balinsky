// Пиксели картинки плана → метры чертежа (u, v). o — где на картинке сторона
// u=0 (двор/стекло): 'b' низ, 't' верх, 'r' право, 'l' лево; s — метров в пикселе;
// x0,y0,x1,y1 — рамка дома на картинке; du/dv — сдвиг (для второго этажа).
function mapPx (o, s, x0, y0, x1, y1, du = 0, dv = 0) {
  const uv = (x, y) => o === 'b' ? [(y1 - y) * s + du, (x - x0) * s + dv]
    : o === 't' ? [(y - y0) * s + du, (x1 - x) * s + dv]
    : o === 'r' ? [(x1 - x) * s + du, (y1 - y) * s + dv]
    : [(x - x0) * s + du, (y - y0) * s + dv]
  const r = (xa, ya, xb, yb) => { const a = uv(xa, ya), b = uv(xb, yb); return [Math.min(a[0], b[0]), Math.max(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[1], b[1])] }
  return { uv, r, s }
}
// Amani Melasti — апартаменты 1 спальня. Площади с плана: гостиная 18,
// спальня 22 (с отдельностоящей ванной), санузел 4, терраса сбоку 13,
// балкон 8. Размеров на плане нет: масштаб (≈0.67 см на пиксель) подобран
// по площадям гостиной и спальни. Скруглённые углы террас показаны прямыми.
const S = 0.0067
const A = mapPx('b', S, 290, 20, 1200, 1365)
const PLAN = { name: 'Amani Melasti 1BR', W: 910 * S, HD: 1345 * S, BACK: 2.45, FRONT: 0.4, H1: 3.0, floors: 1 }
</script>

const rl = (A, g, xa, ya, xb, yb, base) => { const a = A.uv(xa, ya), b = A.uv(xb, yb); railing(g, a[0], a[1], b[0], b[1], base) }

  const X1 = Math.min(xa, xb), X2 = Math.max(xa, xb), Y1 = Math.min(ya, yb), Y2 = Math.max(ya, yb)
  return side === 't' ? A.uv((X1 + X2) / 2, Y1) : side === 'b' ? A.uv((X1 + X2) / 2, Y2) : side === 'l' ? A.uv(X1, (Y1 + Y2) / 2) : A.uv(X2, (Y1 + Y2) / 2)
}
/** Кровать: side — сторона картинки, где изголовье. */
function bedP (A, g, xa, ya, xb, yb, side, y, mat) {
  const [u1, u2, v1, v2] = A.r(xa, ya, xb, yb), h = edgeOf(A, xa, ya, xb, yb, side)

}

}

}

{

  gl(A, g, 320, 460, 320, 605, 0, H1); wl(A, wall, 320, 605, 320, 700, H1); gl(A, g, 320, 700, 320, 840, 0, H1)
  wl(A, wall, 320, 840, 320, 915, H1); gl(A, g, 320, 915, 320, 1360, 0, H1)
  wl(A, wall, 320, 1395, 355, 1395, H1); gl(A, g, 355, 1395, 520, 1395, 0, H1); wl(A, wall, 520, 1395, 825, 1395, H1)
  gl(A, g, 825, 1395, 970, 1395, 0, H1); wl(A, wall, 970, 1395, 1200, 1395, H1)
  wl(A, wall, 320, 615, 850, 615, H1); wl(A, wall, 975, 615, 1088, 615, H1)
  wl(A, wall, 985, 842, 1200, 842, H1); wl(A, wall, 988, 842, 988, 1045, H1); wl(A, wall, 988, 1165, 988, 1395, H1)

  // гостиная
  bx(A, g, 352, 28, 830, 75, y, 0.5, M.wood); rect(g, ...A.r(540, 24, 700, 27), 0.9, 0.7, M.dark)
