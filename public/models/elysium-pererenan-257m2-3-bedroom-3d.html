<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Elysium, «Villa 2». Площади — из спецификации на листе: 1 этаж — гостиная
// 27.15, столовая с кухней 28.55, спальня 15.20, ванная 6.75, санузел 2.20,
// кладовая 3.75; 2 этаж — коридор с лестницей 13.15, спальни 21.30 и 23.25,
// ванные 7.80 и 9.80; крыша — лестница 6.30, терраса с кухней 79.00,
// джакузи 6.20, руфтоп 7.10; снаружи — настил у бассейна 13.95, бассейн
// 23.25, сад 80.55, парковка 21.95. Размеров на листе нет: дом ≈ 9.0 × 9.6 м
// подогнан под площадь 1 этажа 83.6 м², остальное снято по масштабу.
// Второй этаж и крыша выровнены по лестнице и нависают над входом;
// крыша-терраса лежит в группе «2 этаж».
const PLAN = { name: 'Elysium Villa 2', W: 9.0, HD: 9.6, BACK: 8.6, FRONT: 1.8, H1: 3.2, H2: 3.0, floors: 2 }
</script>
<script src="_toon-kit.js"></script>
<script>
lot()
const y = 0.12
const slab = (g, u1, u2, v1, v2, b) => { rect(g, u1, u2, v1, v2, b - 0.18, 0.18, M.wood); rect(g, u1, u2, v1, v2, b, 0.04, M.slab, true, false) }
const flight = (g, u1, u2, va, vb, b, h, n = 9) => {
  const d = (vb - va) / n
  for (let i = 0; i < n; i++) { const a = va + i * d; rect(g, u1, u2, Math.min(a, a + d), Math.max(a, a + d), b, h * (i + 1) / n, M.woodL) }
}
// П-образная лестница в левом верхнем углу: марш вниз по u, площадка, марш назад
const uStair = (g, b, h) => {
  flight(g, 1.3, 2.3, 2.3, 0.3, b, h / 2, 8)
  rect(g, 0.15, 1.3, 0.2, 1.2, b, h / 2, M.woodL)
  for (let i = 0; i < 8; i++) rect(g, 0.15, 1.2, 1.2 + i * 0.13, 1.33 + i * 0.13, b, h / 2 + h / 2 * (i + 1) / 8, M.woodL)
}
// ============ 1 этаж ============
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  floorPatch(g, 0, HD, 0, W, y, T.terrazzo, 2)
  floorPatch(g, 2.4, 6.3, 0.2, 3.83, y + 0.004, T.planksDark, 1.6)
  floorPatch(g, 6.3, HD, 0.2, 3.83, y + 0.004, T.tiles, 0.8)

  wall(0, 0, HD, 0, H1)
  wall(0, 0, 0, 3.9, H1); glassWall(g, 0, 3.9, 0, W, 0, H1)
  glassWall(g, 0, W, 6.4, W, 0, H1); wall(6.4, W, HD, W, H1)
  wall(HD, 0, HD, 4.1, H1); wall(HD, 4.9, HD, W, H1); door(g, HD, 4.1, 4.9, y)
  uStair(g, y, H1 + 0.06)
  wall(2.4, 0, 2.4, 2.47, H1); wall(2.4, 3.3, 2.4, 3.95, H1)
  // спальня 1 | гостиная, ванная, санузел, кладовая
  wall(2.3, 3.95, 7.5, 3.95, H1)
  wall(6.3, 0, 6.3, 0.6, H1); wall(6.3, 1.4, 6.3, 3.95, H1)
  wall(6.3, 2.1, HD, 2.1, H1); wall(7.4, 2.1, 7.4, 3.95, H1)
  wall(8.1, 3.95, HD, 3.95, H1)
  bed(g, 3.27, 5.06, 1.85, 3.8, 3.8, y, M.teal)
  rr(g, 2.85, 3.2, 3.4, 3.8, y, 0.45, M.woodL, 0.04); rr(g, 5.15, 5.5, 3.4, 3.8, y, 0.45, M.woodL, 0.04)
  rr(g, 5.65, 6.2, 1.7, 3.8, y, 2.0, M.wood, 0.04)
  rr(g, 2.6, 3.5, 0.3, 1.0, y, 0.45, M.mustard, 0.15)
  vanity(g, 6.45, 7.4, 1.5, 2.0, y); toilet(g, 7.9, 1.6, y); shower(g, 8.4, 9.45, 0.25, 2.0, y)
  toilet(g, 6.9, 2.8, y)
  rr(g, 7.5, 9.4, 2.2, 2.6, y, 2.0, M.woodL, 0.04)
  // гостиная: встроенный П-образный диван, столик, ТВ на правой стене
  rr(g, 0.37, 3.3, 5.7, 8.4, y, 0.012, M.cush, 0.005, false)
  rr(g, 0.37, 0.95, 5.7, 8.4, y, 0.42, M.woodL, 0.08); rr(g, 0.37, 0.65, 5.7, 8.4, y, 0.8, M.woodL, 0.08)
  rr(g, 0.95, 3.3, 5.7, 6.25, y, 0.42, M.woodL, 0.08); rr(g, 0.95, 3.3, 5.7, 5.95, y, 0.8, M.woodL, 0.08)
  rr(g, 0.95, 2.5, 6.4, 8.3, y, 0.36, M.sofa, 0.1)
  rr(g, 1.4, 2.1, 6.9, 7.5, y + 0.36, 0.08, M.white, 0.03)
  rr(g, 1.3, 2.5, W - 0.25, W - 0.1, y, 0.5, M.wood, 0.04); rect(g, 1.5, 2.3, W - 0.14, W - 0.1, 1.0, 0.6, M.dark)
  // столовая на 6 и кухня у входа
  rr(g, 5.86, 7.84, 5.74, 6.73, y + 0.7, 0.06, M.woodL, 0.03)
  rr(g, 6.5, 7.2, 6.05, 6.45, y, 0.7, M.wood, 0.03)
  for (const u of [6.2, 6.85, 7.5]) { chair(g, u, 5.4, y, M.white); chair(g, u, 7.1, y, M.white) }
  rr(g, 8.83, 9.44, 5.06, 8.7, y, 0.82, M.sage, 0.03)
  rect(g, 8.81, 9.46, 5.04, 8.72, 0.94, 0.05, M.white)
  plant(g, 4.6, 8.5, y, 0.8)
}
// ============ сад: настил, бассейн, диваны вдоль дома ============
{
  const g = floor1G
  rect(g, -1.3, 0, 0, 5.6, 0, 0.1, M.grey, true, false)
  rect(g, -4.7, -1.3, 3.3, 5.6, 0, 0.1, M.grey, true, false)
  pool(g, -8.3, -1.3, 0.1, 3.3, 0.1)
  for (let i = 0; i < 4; i++) rr(g, -0.95, -0.15, 5.0 + i * 1.0, 5.9 + i * 1.0, 0, 0.42, M.navy, 0.1)
  for (let i = 0; i < 7; i++) rr(g, 0.2 + i * 0.95, 1.05 + i * 0.95, W + 0.1, W + 0.9, 0, 0.42, M.navy, 0.1)
  lounger(g, -3.6, -1.6, 3.8, 4.45, 0.1)
  lounger(g, -3.6, -1.6, 4.75, 5.4, 0.1)
  rect(siteG, HD, HD + 1.8, -1.4, W + 1.4, 0, 0.04, M.stone, false, false)    // парковка
  for (const [u, v] of [[-6.5, 5.5], [-3.0, 8.0], [-7.5, 8.0]]) plant(g, u, v, 0, 1.2)
}
// ============ 2 этаж ============
const B2 = H1 + 0.2, B3 = B2 + H2 + 0.2
const U2 = 10.4
{
  const g = floor2G, wall = makeWall(g, B2), F = B2 + 0.04
  slab(g, 0, 3.6, 0, 3.9, B2); slab(g, 3.6, U2, 0, W, B2)
  floorPatch(g, 0, 3.6, 0, 3.9, F, T.planks, 1.6)
  floorPatch(g, 3.6, 8.35, 0, W, F, T.planks, 1.6)
  floorPatch(g, 2.33, 3.6, 0, 3.78, F, T.planks, 1.6)
  floorPatch(g, 8.35, U2, 0, W, F, T.tiles, 0.8)
  railing(g, 0, 3.9, 3.6, 3.9, F); railing(g, 3.6, 3.9, 3.6, W, F)
  uStair(g, F - 3.2, 3.2)

  wall(0, 0, U2, 0, H2); wall(0, 0, 0, 3.9, H2); wall(0, 3.9, 0, W, H2)
  wall(0, W, U2, W, H2); wall(U2, 0, U2, W, H2)
  wall(2.33, 0, 2.33, 2.2, H2); wall(2.33, 2.2, 3.6, 2.2, H2)
  wall(3.6, 2.2, 3.6, 2.9, H2); wall(3.6, 3.78, 3.6, 4.0, H2); wall(3.6, 4.9, 3.6, 5.1, H2)
  wall(3.6, 3.83, U2, 3.83, H2)
  wall(8.35, 0, 8.35, 0.6, H2); wall(8.35, 1.4, 8.35, 3.83, H2)
  wall(8.35, 3.83, 8.35, 6.2, H2); wall(8.35, 7.0, 8.35, W, H2)
  // спальни: кровати изголовьем к общей стене
  bed(g, 5.1, 7.0, 1.74, 3.78, 3.78, F, M.teal)
  bed(g, 5.1, 7.0, 3.88, 5.9, 3.88, F, M.coral)
  rr(g, 2.45, 3.1, 0.1, 2.2, F, 2.0, M.woodL, 0.04)
  rr(g, 7.7, 8.25, 1.6, 3.75, F, 2.0, M.woodL, 0.04); rr(g, 7.7, 8.25, 3.9, 5.9, F, 2.0, M.woodL, 0.04)
  rr(g, 5.1, 6.0, 0.1, 0.45, F, 0.6, M.wood, 0.04); rr(g, 5.1, 6.0, W - 0.45, W - 0.1, F, 0.6, M.wood, 0.04)
  rr(g, 4.0, 4.9, 7.8, 8.6, F, 0.45, M.mustard, 0.15)
  // ванные: раковины у стены, унитаз, душ; во второй — ванна
  vanity(g, 8.45, 8.9, 1.6, 3.7, F); toilet(g, 9.2, 2.0, F); shower(g, 9.2, U2 - 0.1, 2.7, 3.75, F)
  vanity(g, 8.45, 8.9, 3.95, 5.9, F); toilet(g, 9.2, 5.3, F); tub(g, 8.5, U2 - 0.1, 7.8, 8.7, F)
  plant(g, 4.0, 0.4, F, 0.7)
}
// ============ крыша: терраса с кухней, джакузи, руфтоп над лестницей ============
{
  const g = floor2G, wall = makeWall(g, B3), F = B3 + 0.04
  slab(g, 0, U2, 0, W, B3)
  floorPatch(g, 2.4, U2, 0, W, F, T.deck, 1.2)
  floorPatch(g, 0, 2.4, 0, 2.7, F, T.planks, 1.6)
  uStair(g, F - 3.2, 3.2)
  wall(0, 0, 2.4, 0, 2.6); wall(0, 0, 0, 2.7, 2.6); wall(2.4, 0, 2.4, 1.0, 2.6); wall(0, 2.7, 1.7, 2.7, 2.6)
  rect(g, 0, 2.4, 0, 2.7, B3 + 2.6, 0.15, M.wood)                          // руфтоп над лестницей
  railing(g, 0, 0, 0, 2.7, B3 + 2.75); railing(g, 0, 0, 2.4, 0, B3 + 2.75); railing(g, 2.4, 0, 2.4, 2.7, B3 + 2.75); railing(g, 0, 2.7, 2.4, 2.7, B3 + 2.75)
  {                                                                          // винтовая лестница на руфтоп
    const cu = 2.85, cv = 2.65, n = 12, rise = 2.7 / n
    cyl(g, cu, cv, 0.06, 0.06, 3.4, F, M.dark, 10, false)
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 1.6
      const st = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 0.26), M.woodL)
      st.position.set(cv + Math.cos(a) * 0.32 - cx, F + rise * (i + 1), zOf(cu + Math.sin(a) * 0.32) - cz)
      st.rotation.y = -a; st.castShadow = true; edges(st); g.add(st)
    }
  }
  railing(g, 2.4, 0, U2, 0, F); railing(g, 0, 2.7, 0, W, F); railing(g, 0, W, U2, W, F); railing(g, U2, 0, U2, W, F)
  // джакузи в углу
  rect(g, 0.05, 2.6, 6.3, W - 0.05, F, 0.6, M.stone)
  rect(g, 0.3, 2.35, 6.55, W - 0.3, F + 0.55, 0.07, waterMat, false, false)
  // кухня, встроенные лавки, два столика
  rr(g, 2.5, 5.5, 0.1, 0.83, F, 0.9, M.sage, 0.03)
  rr(g, 5.6, 9.1, 0.1, 0.83, F, 0.45, M.woodL, 0.06)
  rr(g, 5.6, 9.1, W - 0.83, W - 0.1, F, 0.45, M.woodL, 0.06)
  rr(g, 9.1, 9.8, 0.1, W - 0.1, F, 0.45, M.woodL, 0.06)
  rr(g, 5.67, 6.87, 1.67, 2.8, F, 0.45, M.white, 0.06); rr(g, 5.67, 6.87, 5.46, 6.6, F, 0.45, M.white, 0.06)
  for (const v of [2.2, 6.0]) { chair(g, 5.2, v, F, M.coral); chair(g, 7.3, v, F, M.coral) }
  for (const v of [3.6, 4.4]) plant(g, 9.95, v, F, 0.6)
}
P(floor1G, 1.65, 4.3, 5.2, -Math.PI / 2, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.78, -2.6, 4.2, 0.3, 0.1, 0x4aa8a8, 0xf3ead8)
P(floor2G, 1.7, 4.5, 6.6, Math.PI, B3 + 0.04, 0x7fae95, 0x4a3a2e)

const OPTS = {
  sub: '3 ' + Model3D.roomWord('bedroomsPlural'),
  facts: [
    { group: 'floor1', rooms: [['living', 27.15], ['kitchen', 28.55], ['bedroom', 15.2], ['bathroom', 6.75], ['bath', 2.2], ['terrace', 13.95], ['pool', 23.25], ['parking', 21.95]] },
    { group: 'floor2', rooms: [['bedroom', 21.3], ['bedroom', 23.25], ['bathroom', 7.8], ['bathroom', 9.8], ['hall', 13.15]] },
    { group: 'roof', rooms: [['terrace', 79], ['stairs', 6.3]] },
  ],
  L1: [
    Lb('living', 27.15, 2.0, 2.2, 6.4),
    Lb('kitchen', 28.55, 7.0, 2.2, 6.6),
    Lb('bedroom', 15.2, 4.3, 2.2, 1.6),
    Lb('bathroom', 6.75, 7.5, 2.4, 1.0),
    Lb('bath', 2.2, 6.9, 2.6, 3.0),
    Lb('pool', 23.25, -4.8, 1.2, 1.7, true),
    Lb('terrace', 13.95, -0.7, 1.4, 2.6, true),
    Lb('parking', 21.95, HD + 0.9, 0.9, 4.5, true),
  ],
  L2: [
    Lb('bedroom', 21.3, 6.0, B2 + 1.9, 1.6),
    Lb('bedroom', 23.25, 6.0, B2 + 1.9, 7.0),
    Lb('bathroom', 7.8, 9.4, B2 + 1.7, 1.2),
    Lb('bathroom', 9.8, 9.4, B2 + 1.7, 6.3),
    Lb('hall', 13.15, 2.9, B2 + 1.6, 3.0),
    Lb('terrace', 79, 7.5, B3 + 1.6, 4.5),
  ],
}
// Координаты сняты с чертежа сверху вниз — отражаем по ширине, чтобы
// план не вышел зеркальным (получается тот же план, повёрнутый на 180°).
for (const G of [floor1G, floor2G, siteG, labelsG]) for (const c of G.children) { c.position.x *= -1; c.rotation.y *= -1; c.scale.x *= -1 }
ToonKit.start(OPTS)
</script>
