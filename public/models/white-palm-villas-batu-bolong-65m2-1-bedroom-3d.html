<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>White Palm Penthouse 1BR — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// С чертежа «Floor plan – 3rd floor – Penthouse» (Archestet, 1:75):
// габарит 5.60 × 12.35 м вместе с балконом. Площади из таблицы
// «Penthouse per unit area»: гостиная 29.1, спальня 13.9, санузел 6.9,
// балкон 14.5, итого 64.4 м². Положение стен снято по масштабу чертежа.
const PLAN = { name: 'White Palm Penthouse', W: 4.82, HD: 9.64, BACK: 3.0, FRONT: 0.5, H1: 3.0, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
const y = 0.12, BU = 4.95, TU = 7.55, CV = 3.9, TV = 1.5
rect(siteG, -BACK - 0.3, HD + 0.3, -0.3, W + 0.3, -0.3, 0.3, M.stone)
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  floorPatch(g, 0, BU, 0, W, y, T.terrazzo, 1.4)              // гостиная
  floorPatch(g, BU, TU, 0, CV, y, T.planks, 1.6)               // спальня
  floorPatch(g, TU, HD, 0, TV, y, T.planks, 1.6)               // гардероб
  floorPatch(g, BU, TU, CV, W, y, T.terrazzo, 1.4)             // коридор
  floorPatch(g, TU, HD, TV, W, y + 0.004, T.tiles, 0.8)        // санузел

  glassWall(g, 0, 0, 0, W, 0, H1)                              // к балкону
  wall(0, 0, HD, 0, H1); wall(HD, 0, HD, W, H1)
  wall(0, W, 5.6, W, H1); wall(6.5, W, HD, W, H1)
  door(g, W, 5.6, 6.5, y, false)
  // спальня
  wall(BU, 0, BU, 2.5, H1); wall(BU, 3.3, BU, CV, H1)
  wall(BU, CV, TU, CV, H1)
  // санузел
  wall(TU, TV, TU, 2.6, H1); wall(TU, 3.3, TU, W, H1)
  wall(TU, TV, HD, TV, H1)

  // гостиная: ТВ-консоль у стены, диван, кресло, круглый стол, кухня вдоль правой стены
  rr(g, 1.0, 4.0, 0.08, 0.5, y, 0.45, M.wood, 0.04)
  rect(g, 1.8, 3.2, 0.08, 0.14, 0.9, 0.7, M.dark)
  rr(g, 0.9, 4.0, 0.3, 2.8, y, 0.012, M.cush, 0.005, false)
  rr(g, 1.56, 3.52, 1.82, 2.6, y, 0.42, M.white, 0.12)
  rr(g, 1.56, 3.52, 2.3, 2.6, y, 0.8, M.white, 0.12)
  rr(g, 2.2, 2.9, 1.0, 1.55, y, 0.38, M.woodL, 0.04)
  roundTable(g, 2.7, 3.25, y, 0.45)
  chair(g, 3.3, 3.25, y, M.white); chair(g, 2.05, 3.25, y, M.white)
  rr(g, 0.15, 4.4, W - 0.6, W - 0.05, y, 0.82, M.sage, 0.03)
  rect(g, 0.15, 4.4, W - 0.62, W - 0.05, 0.94, 0.05, M.white)
  rr(g, 3.5, 4.4, W - 0.6, W - 0.05, y, 2.1, M.steel, 0.04)
  plant(g, 0.35, 0.35, y, 0.8)

  // спальня: кровать изголовьем к стене, туалетный столик, гардероб
  bed(g, 5.6, 7.45, 0.1, 2.2, 0.1, y, M.teal)
  rr(g, 5.15, 5.5, 0.1, 0.5, y, 0.45, M.woodL, 0.04)
  rr(g, 5.2, 6.4, CV - 0.55, CV - 0.1, y, 0.75, M.woodL, 0.04)
  rr(g, TU + 0.1, HD - 0.1, 0.1, 0.65, y, 2.1, M.wood, 0.04)
  // санузел: ванна, унитаз, раковина, душ
  tub(g, TU + 0.1, 8.55, 3.1, W - 0.1, y)
  toilet(g, 9.0, 1.9, y)
  vanity(g, 9.15, HD - 0.08, 2.4, 3.2, y)
  shower(g, 8.7, HD - 0.08, 3.6, W - 0.1, y)
}
// ============ балкон ============
{
  const g = floor1G
  rect(g, -BACK, 0, 0, W, 0, 0.1, texMat(T.deck, 2, 1.2), true, false)
  railing(g, -BACK, 0, -BACK, W, 0.1); railing(g, -BACK, 0, 0, 0, 0.1); railing(g, -BACK, W, 0, W, 0.1)
  rr(g, -2.4, -0.6, 0.15, 0.95, 0.1, 0.42, M.white, 0.12)
  rr(g, -2.4, -0.6, 0.15, 0.4, 0.1, 0.8, M.white, 0.12)
  roundTable(g, -1.0, 2.2, 0.1, 0.4)
  rr(g, -2.4, -1.8, 1.9, 2.5, 0.1, 0.38, M.wood, 0.04)
  chair(g, -0.9, 3.7, 0.1, M.white); chair(g, -1.8, 3.7, 0.1, M.white)
  plant(g, -2.7, W - 0.35, 0.1, 0.8)
}
P(floor1G, 1.65, 1.2, 3.4, -Math.PI / 2, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.75, -1.6, 2.8, 0.4, 0.1, 0x4aa8a8, 0xf3ead8)

ToonKit.start({
  sub: '64.4 m² · 1 ' + Model3D.roomWord('bedroom'),
  facts: [{ group: 'floor1', rooms: [['livingKitchen', 29.1], ['bedroom', 13.9], ['bathroom', 6.9], ['balcony', 14.5]] }],
  L1: [
    Lb('livingKitchen', 29.1, 2.4, 2.3, 2.4),
    Lb('bedroom', 13.9, 6.3, 2.3, 1.6),
    Lb('bathroom', 6.9, 8.6, 2.6, 3.0),
    Lb('balcony', 14.5, -1.5, 1.4, 2.4),
  ],
})
</script>
</body>
