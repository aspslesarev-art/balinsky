<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven Sky Villa B — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Размеры — с рабочего чертежа «Rencana denah villa B» (Dinasti Arsitek для
// PT Seven Sky Villa, 25.04.2025, М 1:100). 1 этаж: дом 7.0 × 10.0 м, слева
// бассейн на настиле 4.7 м, снизу настил 2.5 м. 2 этаж: 9.1 × 6.425 м
// (свесы по 1.05 м), над гостиной второй свет 3.575 м. Площади комнат
// посчитаны по этим размерам, на чертеже их нет.
const PLAN = { name: 'Seven Sky Villa B', W: 10.0, HD: 7.0, BACK: 4.7, FRONT: 1.6, H1: 3.2, H2: 2.9, floors: 2 }
</script>
<script src="_toon-kit.js"></script>
<script>
lot(0, 2.5)
path(2.3, 3.2)
const y = 0.12
// ============ 1 этаж ============
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  floorPatch(g, 0, HD, 1.425, W, y, T.planks, 1.6)
  floorPatch(g, 0, 3.45, 0, 1.425, y, T.planks, 1.6)
  floorPatch(g, 3.45, HD, 0, 1.425, y + 0.004, T.tiles, 0.8)

  // наружные стены: к бассейну и к нижнему настилу — раздвижное стекло
  wall(0, 0, 0, 3.5, H1)
  glassWall(g, 0, 3.5, 0, W, 0, H1)
  wall(0, 0, HD, 0, H1)
  glassWall(g, 0, W, HD, W, 0, H1)
  wall(HD, 0, HD, 2.3, H1); wall(HD, 3.2, HD, W, H1)
  door(g, HD, 2.3, 3.2, y)
  // санузел у кухни: душ | туалет
  wall(3.45, 0, 3.45, 2.2, H1)
  wall(3.45, 1.425, 3.9, 1.425, H1); wall(4.7, 1.425, HD, 1.425, H1)
  wall(5.45, 0, 5.45, 1.425, H1)
  toilet(g, 4.0, 0.35, y); vanity(g, 4.6, 5.3, 0.05, 0.55, y)
  shower(g, 5.6, 6.85, 0.1, 1.3, y)

  // кухня вдоль верхней стены, барная стойка с табуретами
  rr(g, 0.1, 3.35, 0.05, 0.65, y, 0.82, M.sage, 0.03)
  rect(g, 0.1, 3.35, 0.03, 0.68, 0.94, 0.05, M.white)
  rr(g, 0.1, 3.35, 0.05, 0.4, H1 - 1.1, 0.7, M.sage, 0.03)
  rr(g, 0.3, 0.75, 1.7, 3.9, y, 0.95, M.woodL, 0.04)
  rect(g, 0.25, 0.8, 1.65, 3.95, 1.07, 0.05, M.white)
  for (const v of [2.2, 2.8, 3.4]) stool(g, 1.1, v, y)

  // столовая на 8 мест
  rr(g, 2.6, 4.5, 3.1, 3.85, y + 0.7, 0.06, M.woodL, 0.03)
  rr(g, 3.3, 3.8, 3.3, 3.65, y, 0.7, M.wood, 0.03)
  for (const u of [2.85, 3.55, 4.25]) { chair(g, u, 2.75, y); chair(g, u, 4.2, y) }
  chair(g, 2.25, 3.47, y, M.coral); chair(g, 4.85, 3.47, y, M.coral)

  // гостиная: диван буквой Г, кресло, ковёр
  cyl(g, 2.8, 7.4, 1.4, 1.4, 0.015, y, M.mustard, 40, false)
  rr(g, 1.7, 4.2, 8.1, 8.9, y, 0.42, M.sofa, 0.12)
  rr(g, 1.7, 4.2, 8.6, 8.9, y, 0.85, M.sofa, 0.12)
  rr(g, 3.4, 4.2, 6.3, 8.1, y, 0.42, M.sofa, 0.12)
  rr(g, 3.9, 4.2, 6.3, 8.1, y, 0.85, M.sofa, 0.12)
  rr(g, 2.3, 2.7, 8.3, 8.5, y + 0.42, 0.32, M.cush, 0.1)
  rr(g, 3.6, 3.8, 6.8, 7.2, y + 0.42, 0.32, M.teal, 0.1)
  cyl(g, 2.6, 7.2, 0.45, 0.4, 0.36, y, M.woodL, 24)
  rr(g, 0.6, 1.4, 6.3, 7.1, y, 0.45, M.mustard, 0.15)            // кресло
  plant(g, 0.35, W - 0.4, y, 0.9); plant(g, HD - 0.4, W - 0.4, y, 0.9)

  // винтовая лестница на 2 этаж
  {
    const cu = 6.0, cv = 6.0, n = 16, rise = (H1 + 0.18) / n
    cyl(g, cu, cv, 0.07, 0.07, H1 + 1.1, y, M.dark, 10, false)
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 1.75 + Math.PI
      const st = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.05, 0.32), M.woodL)
      st.position.set(cv + Math.cos(a) * 0.4 - cx, y + rise * (i + 1), zOf(cu + Math.sin(a) * 0.4) - cz)
      st.rotation.y = -a; st.castShadow = true; edges(st); g.add(st)
    }
  }
}
// ============ настил, бассейн, шезлонги ============
{
  const g = floor1G
  rect(g, -BACK, 0, 0, W + 2.5, 0, 0.1, texMat(T.deck, 2.8, 1.2), true, false)
  rect(g, 0, HD, W, W + 2.5, 0, 0.1, texMat(T.deck, 0.6, 1.8), true, false)
  pool(g, -4.3, -1.2, 1.15, 8.05, 0.1)
  lounger(g, -4.0, -3.35, 8.5, 10.4, 0.1, true)
  lounger(g, -3.0, -2.35, 8.5, 10.4, 0.1, true)
  plant(g, -0.4, 0.4, 0.1, 0.9); plant(g, -4.4, 0.4, 0.1, 0.8); plant(g, HD - 0.4, W + 2.1, 0.1, 0.9)
}

// ============ 2 этаж ============
const Y = H1 + 0.18, YF = Y + 0.04
const L = -1.05, R = 8.05, B2 = 6.425        // свесы и край над вторым светом
{
  const g = floor2G, wall = makeWall(g, Y)
  // перекрытие с вырезом под лестницу
  rect(g, L, R, 0, 5.25, H1, 0.18, M.wood); rect(g, L, R, 0, 5.25, Y, 0.04, M.slab, true, false)
  rect(g, L, 5.3, 5.25, B2, H1, 0.18, M.wood); rect(g, L, 5.3, 5.25, B2, Y, 0.04, M.slab, true, false)
  rect(g, 6.75, R, 5.25, B2, H1, 0.18, M.wood); rect(g, 6.75, R, 5.25, B2, Y, 0.04, M.slab, true, false)
  floorPatch(g, L, 3.45, 1.25, B2, YF, T.planksDark, 1.6)      // спальня 1
  floorPatch(g, 3.45, R, 1.25, 5.05, YF, T.planksDark, 1.6)    // спальня 2
  floorPatch(g, 3.45, R, 5.05, B2, YF, T.planks, 1.6)          // холл
  floorPatch(g, L, R, 0, 1.25, YF, T.tiles, 0.8)               // санузлы

  wall(L, 0, R, 0, H2)
  wall(L, 0, L, B2, H2); wall(R, 0, R, B2, H2)
  wall(L, B2, 3.45, B2, H2)
  railing(g, 3.45, B2, 5.3, B2, YF); railing(g, 6.75, B2, R, B2, YF)
  // санузлы: две ячейки у каждой спальни
  for (const u of [1.2, 3.45, 5.75]) wall(u, 0, u, 1.25, H2)
  wall(L, 1.25, 0.2, 1.25, H2); wall(1.0, 1.25, 4.3, 1.25, H2); wall(5.1, 1.25, R, 1.25, H2)
  // спальня 1 | холл и спальня 2
  wall(3.45, 1.25, 3.45, 5.4, H2); wall(3.45, 6.2, 3.45, B2, H2)
  wall(3.45, 5.05, 4.3, 5.05, H2); wall(5.1, 5.05, R, 5.05, H2)

  toilet(g, 1.9, 0.35, YF); shower(g, -0.95, 1.1, 0.1, 1.15, YF)
  toilet(g, 5.05, 0.35, YF); shower(g, 5.85, 7.95, 0.1, 1.15, YF)
  vanity(g, 0.2, 1.3, 1.35, 1.8, YF); vanity(g, 6.3, 7.4, 1.35, 1.8, YF)

  // спальня 1: кровать изголовьем к нижней стене, ванна, шкаф
  bed(g, 0.1, 2.0, 4.3, 6.3, 6.35, YF, M.teal)
  rr(g, -0.5, -0.05, 5.8, 6.25, YF, 0.45, M.woodL, 0.04); rr(g, 2.15, 2.6, 5.8, 6.25, YF, 0.45, M.woodL, 0.04)
  cyl(g, 2.37, 6.05, 0.1, 0.14, 0.22, YF + 0.45, M.mustard, 12)
  tub(g, 0.4, 1.9, 2.9, 3.6, YF)
  rr(g, 3.0, 3.38, 2.0, 4.0, YF, 2.1, M.wood, 0.04)              // шкаф
  plant(g, -0.7, 2.0, YF, 0.7)
  // спальня 2
  bed(g, 5.2, 7.0, 2.9, 4.95, 4.95, YF, M.coral)
  rr(g, 4.55, 5.0, 4.5, 4.95, YF, 0.45, M.woodL, 0.04); rr(g, 7.2, 7.65, 4.5, 4.95, YF, 0.45, M.woodL, 0.04)
  rr(g, 4.4, 6.5, 2.3, 2.75, YF, 0.012, M.cush, 0.005, false)
  plant(g, 7.7, 1.7, YF, 0.7)
}
P(floor1G, 1.65, 3.0, 5.4, Math.PI, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.78, -0.8, 6.0, -0.4, 0.1, 0x4aa8a8, 0xf3ead8)
P(floor2G, 1.7, 4.6, 5.7, -Math.PI / 2, YF, 0x7fae95, 0x4a3a2e)

const Y2 = H1 + 0.2
ToonKit.start({
  sub: '2 ' + Model3D.roomWord('bedroomsPlural'),
  facts: [
    { group: 'floor1', rooms: [['livingKitchen', 65], ['bathroom', 4.9], ['pool'], ['terrace']] },
    { group: 'floor2', rooms: [['masterBedroom', 23.2], ['bedroom', 17.3], ['bathroom', 5.7, 2], ['hall', 6.1]] },
  ],
  L1: [
    Lb('livingKitchen', 65, 2.2, 2.2, 5.2),
    Lb('bathroom', 4.9, 5.2, 2.2, 0.7),
    Lb('stairs', undefined, 6.0, 2.6, 7.2),
    Lb('entrance', undefined, HD + 0.9, 1.3, 2.75, true),
    Lb('pool', undefined, -2.7, 1.3, 4.6, true),
    Lb('terrace', undefined, 3.5, 1.2, W + 1.3, true),
  ],
  L2: [
    Lb('masterBedroom', 23.2, 1.2, Y2 + 1.9, 4.6),
    Lb('bedroom', 17.3, 5.8, Y2 + 1.9, 3.0),
    Lb('bathroom', 5.7, 1.2, Y2 + 1.7, 0.6),
    Lb('bathroom', 5.7, 5.8, Y2 + 1.7, 0.6),
    Lb('hall', 6.1, 4.6, Y2 + 1.6, 5.8),
  ],
})
</script>
</body>
