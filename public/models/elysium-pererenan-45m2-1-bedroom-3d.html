// Elysium, квартира с 1 спальней (45 м² в объявлении). Источник — рендер
// планировки сверху; ни размеров, ни площадей на нём нет, поэтому подписи
// без площадей. Размеры ≈ 7.0 × 4.9 м сняты по масштабу (кровать 1.8 м).
// Стена у ванной идёт углом — так и в модели; у окна — цветочный ящик.
const PLAN = { name: 'Elysium 1BR', W: 4.9, HD: 6.99, BACK: 0.8, FRONT: 0.4, H1: 3.0, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
const y = 0.12
function poly (g, pts, y0, h, mat) {
  const s = new THREE.Shape(pts.map(([u, v]) => new THREE.Vector2(v - cx, -(zOf(u) - cz))))
  const geo = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false }); geo.rotateX(-Math.PI / 2)
  const m = new THREE.Mesh(geo, mat); m.position.y = y0; m.receiveShadow = true; m.castShadow = true; edges(m); g.add(m); return m
}
const OUT = [[0, 0], [0, W], [3.25, W], [4.94, 3.87], [5.9, 4.84], [HD, 4.84], [HD, 0]]
poly(siteG, [[-BACK - 0.3, -0.3], [-BACK - 0.3, W + 0.3], [3.4, W + 0.3], [4.94, 4.2], [5.8, 5.14], [HD + 0.3, 5.14], [HD + 0.3, -0.3]], -0.3, 0.3, M.stone)
{
  const g = floor1G, wall = makeWall(g, 0)
  poly(g, OUT, 0, 0.12, M.slab)
  poly(g, OUT, y, 0.012, texMat(T.terrazzo, 0.5, 0.5))
  poly(g, [[5.0, 1.9], [4.97, 3.9], [5.9, 4.84], [HD, 4.84], [HD, 1.9]], y + 0.004, 0.012, texMat(T.tiles, 1.25, 1.25))

  glassWall(g, 0, 0, 0, W, 0, H1)
  wall(0, W, 3.25, W, H1); wall(3.25, W, 4.94, 3.87, H1); wall(4.94, 3.87, 5.9, 4.84, H1); wall(5.9, 4.84, HD, 4.84, H1)
  wall(HD, 4.84, HD, 1.47, H1); wall(HD, 0.65, HD, 0, H1); door(g, HD, 0.65, 1.47, y)
  wall(HD, 0, 0, 0, H1)
  // ванная: душ, унитаз, раковина; вход из прихожей
  wall(5.0, 1.9, 4.94, 3.87, H1)
  wall(5.0, 1.9, 6.1, 1.9, H1)
  shower(g, 6.0, HD - 0.1, 3.6, 4.75, y); toilet(g, 5.85, 3.3, y); vanity(g, 5.1, 5.6, 2.0, 2.8, y)
  // кухня вдоль стены ванной, шкафы у нижней стены
  rr(g, 4.3, 4.92, 2.4, 3.8, y, 0.82, M.sage, 0.03)
  rect(g, 4.28, 4.94, 2.38, 3.82, 0.94, 0.05, M.white)
  rr(g, 4.3, 4.92, 1.78, 2.4, y, 1.9, M.dark, 0.05)
  rr(g, 4.3, 6.85, 0.08, 0.53, y, 0.9, M.woodL, 0.04)
  // кровать изголовьем к верхней стене, ковёр
  rr(g, 0.95, 2.8, 1.7, 2.8, y, 0.012, M.grey, 0.005, false)
  bed(g, 0.94, 2.78, 2.75, 4.75, 4.82, y, M.coral)
  cyl(g, 3.0, 4.6, 0.2, 0.2, 0.5, y, M.white, 16); cyl(g, 0.75, 4.6, 0.2, 0.2, 0.5, y, M.woodL, 16)
  // кресло у окна, столовая, рабочий стол
  rr(g, 0.1, 0.6, 4.1, 4.6, y, 0.45, M.coral, 0.15)
  cyl(g, 0.3, 3.75, 0.2, 0.2, 0.45, y, M.grey, 16)
  roundTable(g, 3.4, 0.62, y, 0.35)
  chair(g, 3.97, 0.62, y, M.coral); chair(g, 2.85, 0.62, y, M.coral); chair(g, 3.4, 1.2, y, M.coral)
  rr(g, 0.34, 0.88, 0.16, 1.5, y, 0.75, M.sage, 0.15)
  chair(g, 1.15, 0.85, y, M.coral)
  plant(g, 0.5, 3.2, y, 0.7)
}
// ============ цветочный ящик за окном ============
{
  const g = floor1G
  rect(g, -BACK, 0, 2.9, W, 0, 0.5, M.stone)
  for (const v of [3.3, 3.9, 4.5]) ball(g, -0.4, v, 0.26, 0.72, M.leaf, 0.8)
  rect(g, -0.6, 0, 0, 2.9, 0, 0.1, M.stone)
}
P(floor1G, 1.65, 2.6, 1.2, Math.PI / 2, y, 0xf08a6b, 0x4a5a78)

  sub: '1 ' + Model3D.roomWord('bedroom'),

    Lb('bedroom', undefined, 1.8, 2.0, 3.7),

})
