<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edem II Type XS — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Edem II, «Type XS». Площади — из таблицы на плане: спальня 16.4,
// кухня 5.6, ванная 5.10 (итого 27.10), бассейн 5.70, терраса 4.10,
// сад 3.3, всего 40.00 м². Размеров на плане нет — дом 3.4 × 7.9 м
// подогнан под площадь 27.1 м², остальное снято по масштабу чертежа.
const PLAN = { name: 'Edem II Type XS', W: 3.42, HD: 7.9, BACK: 3.85, FRONT: 1.0, H1: 3.0, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
lot()
const y = 0.12
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  floorPatch(g, 0, 6.5, 0, W, y, T.planks, 1.6)
  floorPatch(g, 6.5, HD, 0, W, y + 0.004, T.tiles, 0.8)

  wall(HD, 0, HD, W, H1)
  wall(0, 0, HD, 0, H1)
  wall(0, W, 6.4, W, H1); wall(7.2, W, HD, W, H1)
  door(g, W, 6.4, 7.2, y, false, 0.5)
  glassWall(g, 0, 0, 0, 2.5, 0, H1)
  door(g, 0, 2.55, 3.35, y, true, -0.5)
  // ванная: душ за стеклом, унитаз; раковина у входа
  wall(6.5, 0, 6.5, 2.6, H1); wall(6.5, 2.6, HD, 2.6, H1)
  glassWall(g, 6.5, 1.25, HD, 1.25, 0, 2.0)
  shower(g, 6.6, 7.8, 0.1, 1.15, y)
  toilet(g, 7.4, 1.8, y)
  vanity(g, 7.35, 7.85, 2.7, 3.3, y)
  // кухня вдоль левой стены
  rr(g, 5.8, 6.45, 0.05, 2.6, y, 0.82, M.sage, 0.03)
  rect(g, 5.78, 6.47, 0.03, 2.62, 0.94, 0.05, M.white)
  // шкаф, кровать изголовьем к левой стене, ТВ напротив
  rr(g, 4.23, 4.83, 0.1, 2.05, y, 2.0, M.woodL, 0.04)
  cyl(g, 4.5, 2.5, 0.22, 0.22, 0.85, y, M.white, 16)
  bed(g, 1.55, 3.38, 0.05, 2.1, 0.05, y, M.teal)
  cyl(g, 3.65, 0.3, 0.18, 0.18, 0.5, y, M.woodL, 16); cyl(g, 1.25, 0.3, 0.18, 0.18, 0.5, y, M.woodL, 16)
  rr(g, 1.2, 3.7, 3.1, 3.4, y, 0.5, M.wood, 0.04)
  rect(g, 1.9, 3.0, 3.36, 3.4, 1.0, 0.6, M.dark)
}
// ============ терраса, бассейн, садик ============
{
  const g = floor1G, fence = makeWall(siteG, 0)
  rect(g, -1.12, 0, 0, W, 0, 0.1, M.stone, true, false)
  rect(g, -BACK, -1.12, 0, W, 0, 0.1, texMat(T.deck, 1.2, 1), true, false)
  pool(g, -3.6, -1.3, 0.45, 2.2, 0.1)
  rect(g, -BACK, -1.12, 2.4, W, 0, 0.11, texMat(T.grass, 0.5, 1.3), false, false)
  for (const u of [-1.6, -2.3, -3.0]) rr(g, u - 0.25, u + 0.25, 2.6, 3.2, 0.11, 0.04, M.stone, 0.02, false)
  for (const u of [-1.4, -2.2, -3.0, -3.6]) plant(g, u, 0.2, 0.1, 0.45)
  rr(g, -1.05, -0.35, 0.3, 1.6, 0.1, 0.42, M.white, 0.08)
  fence(-BACK, 0, -BACK, W, 1.8); fence(-BACK, 0, 0, 0, 1.8); fence(-BACK, W, -3.0, W, 1.8)
  for (const u of [6.1, 6.6, 7.1]) rr(siteG, u, u + 0.4, W + 0.3, W + 1.0, 0, 0.05, M.stone, 0.02, false)
}
P(floor1G, 1.65, 4.0, 1.6, Math.PI, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.78, -0.7, 2.2, 0.3, 0.1, 0x4aa8a8, 0xf3ead8)

ToonKit.start({
  sub: '40 m² · 1 ' + Model3D.roomWord('bedroom'),
  facts: [{ group: 'floor1', rooms: [['bedroom', 16.4], ['kitchen', 5.6], ['bathroom', 5.1], ['terrace', 4.1], ['pool', 5.7]] }],
  L1: [
    Lb('bedroom', 16.4, 2.6, 2.2, 1.7),
    Lb('kitchen', 5.6, 5.3, 2.3, 1.7),
    Lb('bathroom', 5.1, 7.2, 2.5, 1.3),
    Lb('terrace', 4.1, -0.6, 1.4, 1.7),
    Lb('pool', 5.7, -2.5, 1.0, 1.3),
  ],
})
</script>
</body>
</html>
