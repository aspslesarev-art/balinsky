<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CITRINE Villa — 3D планировка</title>
<style>
  /* Палитра и типографика — как на balinsky.info (app/globals.css). */
  :root{
    --bg:#F8FAF8; --panel:#FFFFFF; --line:#E5E7EB;
    --ink:#111827; --muted:#4B5563;
    --accent:#1F8B5F; --accent-hover:#197551; --accent-soft:#E2F0E8;
    --font:system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--ink)}
  body{background:radial-gradient(ellipse at 50% 35%,#ffffff 0%,#eef6f0 55%,#dcebe1 100%)}
  /* До первого клика жесты уходят странице: touch-action не блокируем,
     колесо не перехватываем. После клика модель забирает управление. */
  /* touch-action:pan-y держим всегда: вертикальный свайп остаётся за
     страницей, иначе секция становится ловушкой для прокрутки на телефоне.
     Горизонтальное вращение и пинч-зум модели это не мешает. */
  #c{display:block;width:100%;height:100%;cursor:pointer;touch-action:pan-y}
  #c.engaged{cursor:grab}
  #c.engaged:active{cursor:grabbing}
  .tapme{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:500;color:#fff;box-shadow:0 4px 16px rgba(31,139,95,.28);pointer-events:none;transition:opacity .2s}
  .tapme.hide{opacity:0}
  /* Панель выровнена по левому краю контентной колонки сайта
     (PageContainer: max-w-[1280px] mx-auto px-6), чтобы стоять в один
     ряд с остальными блоками страницы, а не у края широкого фрейма. */
  .hud{position:fixed;left:max(24px,calc((100vw - 1280px)/2 + 24px));top:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:320px;box-shadow:0 4px 16px rgba(17,24,39,.06)}
  .hud h1{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .hud .sub{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.06em;text-transform:uppercase}
  .row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  button{font-family:inherit;font-size:12px;font-weight:500;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button.on:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chk{margin-top:10px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
  .chk input{accent-color:var(--accent)}
  .facts{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.7}
  .facts b{color:var(--ink);font-weight:600}
  .hint{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.5}
  /* На узком экране панель — компактная полоса сверху во всю ширину, а не
     карточка поверх дома: иначе она съедала половину кадра. */
  @media(max-width:640px){
    .facts,.hint{display:none}
    .hud{left:8px;right:8px;top:8px;max-width:none;padding:10px 12px;border-radius:10px}
    .hud h1{font-size:14px}
    .hud .sub{font-size:10px}
    .row{gap:5px;margin-top:8px}
    button{font-size:11px;padding:5px 9px;border-radius:7px}
    .chk{margin-top:7px;font-size:11px}
    .tapme{font-size:12px;padding:8px 14px}
  }
</style>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <h1>CITRINE Villa</h1>
  <div class="sub" id="sub"></div>
  <div class="row">
    <button id="lA" class="on" data-i18n="layoutA"></button>
    <button id="lB" data-i18n="layoutB"></button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="b1" data-i18n="floor1"></button>
    <button id="b2" data-i18n="floor2"></button>
    <button id="bAll" class="on" data-i18n="wholeHouse"></button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="wAuto" class="on" data-i18n="wallsCut"></button>
    <button id="wUp" data-i18n="wallsUp"></button>
    <button id="wDown" data-i18n="wallsDown"></button>
  </div>
  <label class="chk"><input type="checkbox" id="lbl" checked> <span data-i18n="roomLabels"></span></label>
  <label class="chk"><input type="checkbox" id="spin" checked> <span data-i18n="autoRotate"></span></label>
  <div class="facts" id="facts"></div>
  <div class="hint" data-i18n="hint"></div>
</div>

<div class="tapme" id="tapme" data-i18n="tapToControl"></div>

<script src="_model-i18n.js"></script>
<script>
// Площади — со слайдов презентации KAMRITA CITRINE (планировка 1 этажа,
// вариант А «Две мастер-спальни», вариант Б «2 спальни + кабинет»).
Model3D.setDocumentMeta('CITRINE Villa');
Model3D.applyStatic();
document.getElementById('sub').textContent =
  '109.4 m² + ' + Model3D.roomWord('pool') + ' 10.25 m²';
const FACTS1 = { group: 'floor1', rooms: [['livingKitchen', 28.9], ['bath', 1.8], ['laundry', 0.7], ['terrace', 13.25], ['pool', 10.25]] };
const FACTS2 = {
  a: { group: 'floor2', rooms: [['masterBedroom', 12.32], ['bedroom', 11.52], ['bathroom', 4.93], ['bathroom', 3.24], ['hall', 1.39]] },
  b: { group: 'floor2', rooms: [['masterBedroom', 12.32], ['bedroom', 8.6], ['study', 3.8], ['bathroom', 4.93], ['bathroom', 3.24], ['hall', 2.39]] },
};
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============ размеры (метры) ============
// Сняты со слайдов планировок по масштабу: чаша бассейна 10.25 м² ≈ 94 px/м.
// Координаты чертежа: u — от стеклянной стены у бассейна к фасаду со входом,
// v — поперёк дома. В сцене x = v, z = HD − u (фасад к камере, бассейн сзади).
const W = 6.2;             // ширина дома
const HD = 9.14;           // глубина с входным тамбуром
const FRONT1 = 7.76;       // фасад 1 этажа (тамбур выступает дальше)
const POOL_D = 5.6;        // терраса с бассейном за домом
const H1 = 3.0, H2 = 2.9;
const WALL = 0.16;
</script>
<script>
// ============ сцена — мультяшный стиль (как в Sims) ============
// Тун-шейдинг в три ступени света, тёмные контуры, скруглённая мебель,
// текстуры полов по комнатам, участок-«лот» с газоном и пальмами.
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);   // фон — CSS-градиент неба под холстом

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0xcfdcc0, 0.5));
const sun = new THREE.DirectionalLight(0xfff1d6, 0.85);
sun.position.set(10, 20, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-16; sun.shadow.camera.right=16;
sun.shadow.camera.top=16; sun.shadow.camera.bottom=-16;
sun.shadow.bias = -0.0006;
scene.add(sun);

// ---- тун: три ступени освещённости ----
const toonRamp = (()=>{
  const v=[120,190,235], d=new Uint8Array(v.length*4);
  v.forEach((x,i)=>{d.set([x,x,x,255],i*4);});
  const t=new THREE.DataTexture(d,v.length,1,THREE.RGBAFormat);
  t.minFilter=t.magFilter=THREE.NearestFilter; t.generateMipmaps=false; t.needsUpdate=true;
  return t;
})();
const toon = (color, extra={}) => new THREE.MeshToonMaterial(Object.assign({color, gradientMap:toonRamp}, extra));

// ---- рисованные текстуры (canvas) ----
function tex(draw, size=256){
  const c=document.createElement('canvas'); c.width=c.height=size;
  draw(c.getContext('2d'), size);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=4;
  return t;
}
const T = {
  planks: tex((x,s)=>{                       // светлый дуб, доски вразбежку
    x.fillStyle='#e2b47c'; x.fillRect(0,0,s,s);
    const n=6, h=s/n;
    for(let i=0;i<n;i++){
      x.fillStyle=['#dcaa70','#e8bd88','#d9a56a','#e4b67e','#dfae74','#e9c08c'][i];
      x.fillRect(0,i*h+1,s,h-2);
      x.fillStyle='#b9824c'; x.fillRect(0,i*h,s,2);
      const j=(i%2?.35:.8)*s; x.fillRect(j,i*h,2,h);
    }
  }),
  planksDark: tex((x,s)=>{                   // спальни — тон теплее
    x.fillStyle='#c98f5e'; x.fillRect(0,0,s,s);
    const n=6, h=s/n;
    for(let i=0;i<n;i++){
      x.fillStyle=['#c58a58','#d29a68','#c08454','#cd9462','#c78c5a','#d49d6c'][i];
      x.fillRect(0,i*h+1,s,h-2);
      x.fillStyle='#9a6638'; x.fillRect(0,i*h,s,2);
      const j=(i%2?.3:.75)*s; x.fillRect(j,i*h,2,h);
    }
  }),
  tiles: tex((x,s)=>{                        // санузлы — светло-голубая плитка
    x.fillStyle='#a9cfd6'; x.fillRect(0,0,s,s);
    const n=4, h=s/n;
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){
      x.fillStyle=(i+j)%2?'#d9eef1':'#cbe6ea'; x.fillRect(j*h+2,i*h+2,h-4,h-4);
    }
  }),
  terrazzo: tex((x,s)=>{                     // вход — терраццо
    x.fillStyle='#ece5da'; x.fillRect(0,0,s,s);
    const cols=['#c9b9a3','#a99a86','#e0a37c','#9fb7a8'];
    for(let i=0;i<220;i++){x.fillStyle=cols[i%4];x.beginPath();x.arc(Math.random()*s,Math.random()*s,1+Math.random()*3,0,7);x.fill();}
  }),
  deck: tex((x,s)=>{                         // настил у бассейна
    x.fillStyle='#c79a6b'; x.fillRect(0,0,s,s);
    for(let i=0;i<8;i++){x.fillStyle='#a87a4c';x.fillRect(i*s/8,0,3,s);}
  }),
  grass: tex((x,s)=>{
    x.fillStyle='#78b955'; x.fillRect(0,0,s,s);
    for(let i=0;i<500;i++){x.fillStyle=Math.random()<.5?'#6dad4b':'#85c561';x.fillRect(Math.random()*s,Math.random()*s,3,6);}
  }),
  water: tex((x,s)=>{                        // вода с бликами, текстура плывёт
    x.fillStyle='#3fb6d3'; x.fillRect(0,0,s,s);
    x.strokeStyle='rgba(255,255,255,.55)'; x.lineWidth=4; x.lineCap='round';
    for(let i=0;i<14;i++){
      const px=Math.random()*s, py=Math.random()*s, l=20+Math.random()*30;
      x.beginPath(); x.moveTo(px,py); x.quadraticCurveTo(px+l/2,py-8,px+l,py); x.stroke();
    }
  }),
};
function texMat(t, rw, rd, color=0xffffff){
  const m=t.clone(); m.needsUpdate=true; m.repeat.set(rw,rd);
  return toon(color,{map:m});
}

// материалы — сочнее, чем на рендерах, но в той же гамме
const M = {
  wall:  toon(0xefd9b8),
  cap:   toon(0x8a5a36),
  wood:  toon(0x9a6a44),
  woodL: toon(0xc89566),
  slab:  toon(0xe9dfd0),
  sofa:  toon(0x9fc490),
  cush:  toon(0xf08a6b),
  mustard: toon(0xf0bd4f),
  teal:  toon(0x4aa8a8),
  coral: toon(0xf08a6b),
  sage:  toon(0x7fae95),
  white: toon(0xfdfcf9),
  steel: toon(0xd7e0e3),
  dark:  toon(0x4a3a2e),
  leaf:  toon(0x4fb35a),
  leafD: toon(0x3f9a4a),
  trunk: toon(0xa77a52),
  pot:   toon(0xd9774c),
  dirt:  toon(0xa9744a),
  stone: toon(0xd8d2c6),
  poolTile: toon(0x2f8fb0),
  glass: new THREE.MeshBasicMaterial({color:0xbfe6f2, transparent:true, opacity:.25, side:THREE.DoubleSide, depthWrite:false}),
};
const waterTex = T.water.clone(); waterTex.needsUpdate=true; waterTex.repeat.set(1.5,1);
const waterMat = new THREE.MeshBasicMaterial({map:waterTex, transparent:true, opacity:.92});

const floor1G = new THREE.Group();
const floor2G = new THREE.Group();
const siteG   = new THREE.Group();
const labelsG = new THREE.Group();
scene.add(floor1G, floor2G, siteG, labelsG);

const cx = W/2, cz = (HD+POOL_D)/2;
const zOf = u => HD - u;

// ---- контуры: тонкая тёмная линия по рёбрам ----
const EDGE = new THREE.LineBasicMaterial({color:0x4a3526, transparent:true, opacity:.6});
function edges(m, thr=30){ m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, thr), EDGE)); }
// для скруглённых предметов — «оболочка» с обратными гранями (комиксный контур)
const HULL = new THREE.MeshBasicMaterial({color:0x4a3526, side:THREE.BackSide});

function box(g, w,h,d, x,y,z, mat, shadow=true, outline=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x-cx, y, z-cz);
  m.castShadow = shadow; m.receiveShadow = true;
  if(outline) edges(m);
  g.add(m); return m;
}
function rect(g, u1,u2, v1,v2, y,h, mat, shadow=true, outline=true){
  return box(g, v2-v1, h, u2-u1, (v1+v2)/2, y+h/2, zOf((u1+u2)/2), mat, shadow, outline);
}
// скруглённый брусок: низ на y, высота h, радиус r
function roundGeo(w,d,h,r){
  r=Math.max(.01,Math.min(r, w/2-.01, d/2-.01, h/2-.01));
  const a=w/2-r, b=d/2-r, rc=Math.min(a,b)*.6;
  const s=new THREE.Shape();
  s.moveTo(-a+rc,-b); s.lineTo(a-rc,-b); s.quadraticCurveTo(a,-b,a,-b+rc);
  s.lineTo(a,b-rc); s.quadraticCurveTo(a,b,a-rc,b); s.lineTo(-a+rc,b);
  s.quadraticCurveTo(-a,b,-a,b-rc); s.lineTo(-a,-b+rc); s.quadraticCurveTo(-a,-b,-a+rc,-b);
  const geo=new THREE.ExtrudeGeometry(s,{depth:Math.max(.001,h-2*r), bevelEnabled:true, bevelThickness:r, bevelSize:r, bevelSegments:3, curveSegments:4});
  geo.rotateX(-Math.PI/2); geo.translate(0,r,0);
  return geo;
}
function rr(g, u1,u2, v1,v2, y,h, mat, r=.08, hull=true){
  const w=v2-v1, d=u2-u1;
  const m=new THREE.Mesh(roundGeo(w,d,h,r), mat);
  m.position.set((v1+v2)/2-cx, y, zOf((u1+u2)/2)-cz);
  m.castShadow=m.receiveShadow=true;
  if(hull){
    const t=.035, o=new THREE.Mesh(m.geometry, HULL);
    o.scale.set(1+2*t/w, 1+2*t/h, 1+2*t/d); o.position.y=-t;
    m.add(o);
  }
  g.add(m); return m;
}
function cyl(g, u,v, r1,r2,h, y, mat, seg=24, outline=true){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg), mat);
  m.position.set(v-cx, y+h/2, zOf(u)-cz); m.castShadow=true; m.receiveShadow=true;
  if(outline){ const o=new THREE.Mesh(m.geometry,HULL); o.scale.set(1.06,1.04,1.06); m.add(o); }
  g.add(m); return m;
}
function ball(g, u,v, r, y, mat, sy=1){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10), mat);
  m.scale.y=sy; m.position.set(v-cx, y, zOf(u)-cz); m.castShadow=true;
  const o=new THREE.Mesh(m.geometry,HULL); o.scale.setScalar(1.07); m.add(o);
  g.add(m); return m;
}

// стены, которые срезаются как в Sims; сверху — тёмная «шапка» среза
const cutWalls=[];
function regWall(m,h){cutWalls.push({m,h,bottom:m.position.y-h/2});}
function makeWall(g, base){
  return (u1,v1,u2,v2,h,mat=M.wall)=>{
    const x1=v1, z1=zOf(u1), x2=v2, z2=zOf(u2);
    const dx=x2-x1, dz=z2-z1, len=Math.hypot(dx,dz);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len+WALL,h,WALL), mat);
    m.position.set((x1+x2)/2-cx, base+h/2, (z1+z2)/2-cz);
    m.rotation.y = -Math.atan2(dz,dx);
    m.castShadow=m.receiveShadow=true; edges(m);
    const cap=new THREE.Mesh(new THREE.BoxGeometry(len+WALL+.02,.07,WALL+.03), M.cap);
    cap.position.y=h/2; m.add(cap);
    // плинтус
    const sk=new THREE.Mesh(new THREE.BoxGeometry(len+WALL+.01,.1,WALL+.02), M.woodL);
    sk.position.y=-h/2+.05; m.add(sk);
    g.add(m); regWall(m,h); return m;
  };
}
function glassWall(g, u1,v1,u2,v2, base, h){
  const x1=v1, z1=zOf(u1), x2=v2, z2=zOf(u2);
  const len=Math.hypot(x2-x1,z2-z1), ry=-Math.atan2(z2-z1,x2-x1);
  const m=new THREE.Mesh(new THREE.BoxGeometry(len,h,.05), M.glass);
  m.position.set((x1+x2)/2-cx, base+h/2, (z1+z2)/2-cz); m.rotation.y=ry;
  // рама: верх, низ и импосты через ~1.5 м
  const fr=(w,hh,y,x)=>{const f=new THREE.Mesh(new THREE.BoxGeometry(w,hh,.09),M.dark);f.position.set(x,y,0);m.add(f);};
  fr(len,.08,h/2-.04,0); fr(len,.06,-h/2+.03,0);
  const n=Math.max(1,Math.round(len/1.5));
  for(let i=0;i<=n;i++) fr(.06,h,0,-len/2+len*i/n);
  g.add(m); regWall(m,h);
}
// пол комнаты — тонкая накладка с текстурой поверх плиты
function floorPatch(g, u1,u2, v1,v2, y, t, k=1){
  return rect(g, u1,u2, v1,v2, y, .012, texMat(t, (v2-v1)/k, (u2-u1)/k), false, false);
}

// ---- мебель ----
function plant(g, u,v, y, s=1){
  cyl(g, u,v, .17*s,.13*s,.32*s, y, M.pot, 16);
  ball(g, u,v, .3*s, y+.55*s, M.leaf, 1.1);
  ball(g, u+.1*s,v-.12*s, .2*s, y+.8*s, M.leafD);
}
function palm(g, u,v, h=4.2, lean=.8){
  // ствол — плавная трубка с наклоном, листья веером
  const base=new THREE.Vector3(v-cx, 0, zOf(u)-cz);
  const curve=new THREE.CatmullRomCurve3([
    base.clone(), base.clone().add(new THREE.Vector3(lean*.15,h*.35,0)),
    base.clone().add(new THREE.Vector3(lean*.5,h*.7,0)), base.clone().add(new THREE.Vector3(lean,h,0))]);
  const tr=new THREE.Mesh(new THREE.TubeGeometry(curve,16,.13,10,false), M.trunk);
  tr.castShadow=true; g.add(tr);
  const top=curve.getPoint(1);
  for(let i=0;i<9;i++){
    const a=i/9*Math.PI*2;
    const lf=new THREE.Mesh(new THREE.SphereGeometry(1,12,6), i%2?M.leaf:M.leafD);
    lf.scale.set(1.15,.07,.3);
    const piv=new THREE.Group(); piv.position.copy(top); piv.rotation.y=-a;
    lf.position.set(1.0,-.25,0); lf.rotation.z=-.4; lf.castShadow=true;
    piv.add(lf); g.add(piv);
  }
  const nut=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8), M.trunk); nut.position.copy(top); g.add(nut);
}
function bed(g, u1,u2, v1,v2, headAtV, Yb, blanket){
  rr(g, u1,u2, v1,v2, Yb, .28, M.woodL, .05);                // рама
  rr(g, u1+.05,u2-.05, v1+.05,v2-.05, Yb+.28, .2, M.white, .08, false); // матрас

const plumbobs=[];
function makePerson(g, h, x, z, ry, yBase, shirtC, pantsC){
  const p = new THREE.Group();
  const skin = toon(0xe7b48d), shirt = toon(shirtC), pants = toon(pantsC), hair = toon(0x5a3a26);
  const legH=h*.42, torH=h*.33, headR=h*.1;                     // голова крупнее — мультяшнее
  const mesh=(geo,mat,y)=>{const m=new THREE.Mesh(geo,mat);m.position.y=y;m.castShadow=true;
    const o=new THREE.Mesh(geo,HULL);o.scale.setScalar(1.08);m.add(o);p.add(m);return m;};
  const lg=new THREE.CylinderGeometry(h*.05,h*.045,legH,10);
  mesh(lg,pants,legH/2).position.x=-h*.06;
  mesh(lg,pants,legH/2).position.x= h*.06;
  mesh(new THREE.CylinderGeometry(h*.1,h*.085,torH,12), shirt, legH+torH/2);
  mesh(new THREE.SphereGeometry(h*.1,12,8), shirt, legH+torH);
  const arm=new THREE.CylinderGeometry(h*.035,h*.03,torH*.9,8);
  const aL=mesh(arm,skin,legH+torH*.55); aL.position.x=-h*.14; aL.rotation.z=.15;
  const aR=mesh(arm,skin,legH+torH*.55); aR.position.x= h*.14; aR.rotation.z=-.15;
  const hy=legH+torH+headR*1.15;
  mesh(new THREE.SphereGeometry(headR,16,12), skin, hy);
  const hr=mesh(new THREE.SphereGeometry(headR*1.04,16,12,0,Math.PI*2,0,Math.PI*.55), hair, hy+headR*.08);
  hr.rotation.x=-.25;
  const pb = new THREE.Mesh(new THREE.OctahedronGeometry(h*.08),
    new THREE.MeshToonMaterial({color:0x3fe04a, emissive:0x1f9a27, gradientMap:toonRamp}));
  pb.scale.y = 1.7;
  pb.position.y = hy+headR*2.6+h*.08;
  pb.userData.baseY = pb.position.y;
  p.add(pb); plumbobs.push(pb);
  p.position.set(x-cx, yBase, z-cz);
  p.rotation.y=ry;
  g.add(p); return p;
}

<script>

let theta=-.75, phi=1.05, dist=17, target=new THREE.Vector3(0,1.6,0);

function updCam(){
  phi=Math.max(.15,Math.min(1.45,phi));

  camera.position.set(
    target.x+dist*Math.sin(phi)*Math.sin(theta),
    target.y+dist*Math.cos(phi),
    target.z+dist*Math.sin(phi)*Math.cos(theta));

}
let drag=null;

// Модель встроена фреймом в длинную страницу, поэтому она не забирает
// жесты, пока по ней не кликнули: иначе колесо зумило бы модель вместо
// прокрутки страницы, а свайп на телефоне не давал бы пролистать секцию.
// Автоповорот при этом идёт всегда — модель «живая» и до клика.
let engaged=false;
const tapme=document.getElementById('tapme');
function engage(){
  if(engaged)return;
  engaged=true; canvas.classList.add('engaged'); tapme.classList.add('hide');
}
function disengage(){
  if(!engaged||drag)return;
  engaged=false; canvas.classList.remove('engaged'); tapme.classList.remove('hide');
}
// Уводя курсор со сцены, пользователь возвращает прокрутку странице.
// Только для мыши: на тач-устройстве pointerleave прилетает сразу после
// отрыва пальца и сбрасывал бы активацию каждым касанием.
canvas.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')disengage();});
addEventListener('blur',()=>{drag=null;disengage();});

canvas.addEventListener('pointerdown',e=>{
  // Первое касание только включает управление — оно не должно ни крутить
  // модель, ни глотать свайп страницы.
  if(!engaged){engage();return;}
  drag={x:e.clientX,y:e.clientY,b:e.button};auto=false;spinChk.checked=false;canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(drag.b===2){
    const s=dist*.0012;
    const right=new THREE.Vector3().subVectors(camera.position,target).cross(camera.up).normalize();
    target.addScaledVector(right,dx*s);
    target.y+=dy*s;
  }else{ theta-=dx*.006; phi-=dy*.006; }
  drag.x=e.clientX; drag.y=e.clientY; updCam();
});
canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{
  if(!engaged)return;            // не перехватываем — страница скроллится
  e.preventDefault();dist*=1+Math.sign(e.deltaY)*.08;updCam();
},{passive:false});
// pinch
let pinch=null;
canvas.addEventListener('touchmove',e=>{
  if(!engaged)return;
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinch) {dist*=pinch/d; updCam();}
    pinch=d; e.preventDefault();
  }
},{passive:false});
canvas.addEventListener('touchend',()=>pinch=null);

// ============ UI ============
const b1=document.getElementById('b1'),b2=document.getElementById('b2'),bAll=document.getElementById('bAll');
const lA=document.getElementById('lA'),lB=document.getElementById('lB');
const lblChk=document.getElementById('lbl'), spinChk=document.getElementById('spin');
// ?layout=b открывает сразу вариант Б.
let layout = new URLSearchParams(location.search).get('layout') === 'b' ? 'b' : 'a';
let curMode=0;
function apply(){
  const L2 = layout==='a' ? L2A : L2B;
  floor2A.visible = layout==='a';
  floor2B.visible = layout==='b';
  L2A.forEach(s=>s.visible=false); L2B.forEach(s=>s.visible=false);
  if(curMode===1){floor1G.visible=true; floor2G.visible=false;
    L1.forEach(s=>s.visible=lblChk.checked);}
  if(curMode===2){floor1G.visible=true; floor2G.visible=true;
    L1.forEach(s=>s.visible=false); L2.forEach(s=>s.visible=lblChk.checked);}
  if(curMode===0){floor1G.visible=true; floor2G.visible=true;
    // «Весь дом»: подписи 1 этажа закрыты вторым — показываем только верхние и двор
    L1.forEach((s,i)=>s.visible=lblChk.checked && i>=5); L2.forEach(s=>s.visible=lblChk.checked);}
  [b1,b2,bAll].forEach(b=>b.classList.remove('on'));
  (curMode===1?b1:curMode===2?b2:bAll).classList.add('on');
  lA.classList.toggle('on', layout==='a'); lB.classList.toggle('on', layout==='b');
  Model3D.renderFacts(document.getElementById('facts'), [FACTS1, FACTS2[layout]]);
}
b1.onclick=()=>{curMode=1;apply();};
b2.onclick=()=>{curMode=2;apply();};
bAll.onclick=()=>{curMode=0;apply();};
// Смена варианта показывает 2 этаж — разница только там.
lA.onclick=()=>{layout='a'; if(curMode===1)curMode=2; apply();};
lB.onclick=()=>{layout='b'; if(curMode===1)curMode=2; apply();};
lblChk.onchange=apply;
spinChk.onchange=()=>auto=spinChk.checked;
apply();

// ---- режимы стен (Sims-механика) ----
const wAuto=document.getElementById('wAuto'),wUp=document.getElementById('wUp'),wDown=document.getElementById('wDown');
let wallMode='auto'; // auto = стены со стороны камеры срезаются
function setWalls(m,btn){wallMode=m;[wAuto,wUp,wDown].forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
wAuto.onclick=()=>setWalls('auto',wAuto);
wUp.onclick=()=>setWalls('up',wUp);
wDown.onclick=()=>setWalls('down',wDown);

const STUB=.09; // высота "пенька" стены
const houseCtr=new THREE.Vector3(0,0,HD/2-cz);
const _cd=new THREE.Vector3(), _wo=new THREE.Vector3();
function updateWalls(){
  _cd.set(camera.position.x-houseCtr.x,0,camera.position.z-houseCtr.z).normalize();
  for(const w of cutWalls){
    let target=1;
    if(wallMode==='down') target=STUB;
    else if(wallMode==='auto'){
      _wo.set(w.m.position.x-houseCtr.x,0,w.m.position.z-houseCtr.z);
      if(_wo.lengthSq()>.01){
        _wo.normalize();
        if(_wo.dot(_cd)>.25) target=STUB; // стена между камерой и домом
      }
    }
    w.m.scale.y += (target-w.m.scale.y)*.18;
    w.m.position.y = w.bottom + w.h*w.m.scale.y/2;
  }
}

// ============ кадрирование ============
// Модель крутится вокруг вертикальной оси, поэтому «влезает при любом угле»
// = влезает описанная вокруг неё сфера. Радиус берём по габаритам геометрии,
// дистанцию — из угла обзора, причём по меньшей из двух сторон кадра:
// в узком фрейме ограничение даёт горизонталь, в широком — вертикаль.
scene.updateMatrixWorld(true);
// В кадре гарантируется САМ ДОМ. Двор с бассейном тянется на 4.7 м назад, и
// если требовать его целиком на любом угле, дом приходится отодвигать почти
// вдвое — модель становится мелкой ради газона. Край газона на крайних
// ракурсах может уйти за границу, дом — никогда.
const fitBox = new THREE.Box3();
[floor1G, floor2G].forEach(g=>fitBox.expandByObject(g));
target.copy(fitBox.getCenter(new THREE.Vector3()));   // ось вращения через центр
const FIT_MARGIN = 1.04;                              // запас на подписи комнат
const fitCorners = [];
for(const x of [fitBox.min.x,fitBox.max.x])
  for(const y of [fitBox.min.y,fitBox.max.y])
    for(const z of [fitBox.min.z,fitBox.max.z])
      fitCorners.push(new THREE.Vector3(x,y,z).sub(target));

/**
 * Минимальная дистанция, при которой все восемь углов габарита остаются в
 * кадре на полном обороте. Описанная сфера здесь врала бы в запас: дом
 * вытянутый (≈15 м в глубину против 4.7 в ширину), и её радиус отодвигал
 * камеру дальше, чем нужно. Считаем честно — по проекции углов.
 */
/**
 * Свободная область просмотрщика в пикселях: холст минус панель управления
 * слева и минус нижняя полоса с подсказкой и легендой.
 *
 * Модель центрируется по ней, а не по холсту: панель занимает левый край,
 * и «по центру холста» читалось как «прижато влево, справа дыра».
 * На узком экране панель лежит поверх сцены — вычитать нечего.
 */
function layoutBox(){
  const W = innerWidth, H = innerHeight;
  const wide = W > 640;   // совпадает с @media(max-width:640px): панель слева до этой ширины
  const hud = document.querySelector('.hud');
  // Всё служебное собрано в панели слева, поэтому справа от неё вся высота
  // холста принадлежит модели. На узком экране панель лежит поверх сцены —
  // вычитать нечего.
  if(!hud) return { x: 0, y: 0, w: W, h: H, W, H };
  const r = hud.getBoundingClientRect();
  // Широкий кадр: панель слева, модель справа от неё.
  // Узкий: панель полосой сверху, модель под ней.
  if(wide){
    const left = r.right + 16
    return { x: left, y: 0, w: Math.max(180, W - left), h: H, W, H };
  }
  const top = r.bottom + 8
  return { x: 0, y: top, w: W, h: Math.max(140, H - top), W, H };
}

function fitDistance(){
  // Тангенсы ужимаем до доли свободной области: модель должна влезать
  // в неё, а не в весь холст.
  const b = layoutBox();
  const t = Math.tan(camera.fov*Math.PI/360);
  const vT = t * (b.h / b.H);
  const hT = t * camera.aspect * (b.w / b.W);
  const up = new THREE.Vector3(0,1,0);
  const zc = new THREE.Vector3(), xc = new THREE.Vector3(), yc = new THREE.Vector3();
  let need = 0;
  for(let i=0;i<72;i++){
    const th = i*Math.PI/36;
    zc.set(Math.sin(phi)*Math.sin(th), Math.cos(phi), Math.sin(phi)*Math.cos(th)).normalize();
    xc.crossVectors(up,zc).normalize();
    yc.crossVectors(zc,xc);
    for(const p of fitCorners){
      // Точка видна, пока её смещение от оси взгляда укладывается в конус
      // обзора на её же глубине: |px| <= (dist - along)*tg. Отсюда dist.
      const along=p.dot(zc);
      need = Math.max(need, Math.abs(p.dot(xc))/hT + along, Math.abs(p.dot(yc))/vT + along);
    }
  }
  return need*FIT_MARGIN;
}

// ============ рендер ============
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  // Сдвигаем окно проекции так, чтобы центром кадра стал центр свободной
  // области, а не центр холста: модель уезжает правее панели и выше
  // подсказки, вместо того чтобы висеть в середине с пустотой справа.
  const b = layoutBox();
  const bx = b.x + b.w/2, by = b.y + b.h/2;
  camera.setViewOffset(w, h, w/2 - bx, h/2 - by, w, h);
  camera.updateProjectionMatrix();
  // Подсказка — по центру модели, а не холста.
  const tap = document.getElementById('tapme');
  if(tap){ tap.style.left = bx + 'px'; tap.style.top = by + 'px'; }
  // Пока управление не перехвачено, держим модель вписанной в кадр —
  // в том числе после поворота телефона. После клика зум пользователя.
  if(!engaged){dist=fitDistance();}
  updCam();
}
addEventListener('resize',resize); resize();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduced){auto=false;spinChk.checked=false;}
updCam();
// Родительская страница сообщает, видно ли секцию. Пока модель за экраном
// или вкладка скрыта, кадры не рисуем: WebGL с тенями иначе молотит 60 fps
// всё время, пока открыта страница.
let offscreen = false;
addEventListener('message', e=>{
  if(e.origin!==location.origin) return;
  const d=e.data;
  if(d && d.type==='model:visible') offscreen = !d.visible;
});

(function loop(t){
  requestAnimationFrame(loop);
  if(offscreen || document.hidden) return;
  if(auto){theta+=.0018;updCam();}
  const s=(t||0)*.001;
  for(const pb of plumbobs){
    pb.rotation.y = s*1.6;
    pb.position.y = pb.userData.baseY + Math.sin(s*2.2)*0.03;
  }
  waterTex.offset.set(s*.025, Math.sin(s*.4)*.05);
  updateWalls();
  renderer.render(scene,camera);
})();
</script>
