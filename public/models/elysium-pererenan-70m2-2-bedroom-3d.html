<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elysium 2BR 70 м² — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Площади — со слайда застройщика: юнит 69.95 м², этаж 1 — 27.05,
// этаж 2 — 33.40, бассейн с террасой 9.50, 2 спальни. Площадей комнат
// нет. Размеров нет: метры сняты с вида сверху по масштабу, подогнанному
// под 27.05 м² первого этажа (1 px ≈ 1.75 см). 2 этаж шире первого и
// нависает над ним; угол над лестницей открыт вниз.
const k = 0.0175, X0 = 35, X1 = 600, YT = 10, YB = 292
const PLAN = { name: 'Elysium 2BR', W: (X1 - X0) * k, HD: (YB - YT) * k, BACK: 0.6, FRONT: 0.6, H1: 2.9, H2: 2.8, floors: 2 }
</script>
<script src="_toon-kit.js"></script>
<script>
const V = p => (p - X0) * k, U = p => (YB - p) * k
const pr = (x1, x2, y1, y2) => [U(y2), U(y1), V(x1), V(x2)]
const wl = wall => (x1, y1, x2, y2, h) => wall(U(y1), V(x1), U(y2), V(x2), h)
function stairsV (g, va, vb, u1, u2, y0, y1, n = 14) {
  const d = (vb - va) / n, r = (y1 - y0) / n
  for (let i = 0; i < n; i++) { const a = va + d * i, b = a + d; rect(g, u1, u2, Math.min(a, b), Math.max(a, b), y0, r * (i + 1), M.woodL) }
}
rect(siteG, ...pr(25, 610, 0, 302), -0.3, 0.3, M.stone)
const y = 0.12
// ============ 1 этаж ============
{
  const g = floor1G, w = wl(makeWall(g, 0))
  rect(g, ...pr(170, 600, 72, 292), 0, 0.12, M.slab)
  floorPatch(g, ...pr(170, 495, 72, 292), y, T.terrazzo, 1.4)
  floorPatch(g, ...pr(495, 600, 72, 245), y + 0.004, T.tiles, 0.8)

  w(170, 72, 600, 72, H1); w(600, 72, 600, 245, H1); w(170, 292, 520, 292, H1)
  glassWall(g, U(75), V(170), U(292), V(170), 0, H1)              // стекло к бассейну
  w(495, 72, 495, 175, H1); w(490, 192, 545, 285, H1); w(545, 285, 600, 245, H1)
  // ванная
  shower(g, ...pr(505, 560, 82, 120), y); vanity(g, ...pr(545, 592, 120, 152), y); toilet(g, U(215), V(560), y)
  // гостиная: круглый ковёр, диван, кресло, столик; столовая; рабочий стол
  cyl(g, U(150), V(290), 0.95, 0.95, 0.015, y, M.mustard, 40, false)
  rr(g, ...pr(210, 255, 140, 220), y, 0.42, M.coral, 0.12); rr(g, ...pr(250, 335, 175, 222), y, 0.42, M.coral, 0.12)
  rr(g, ...pr(210, 228, 140, 220), y, 0.8, M.coral, 0.1); rr(g, ...pr(250, 335, 205, 222), y, 0.8, M.coral, 0.1)
  rr(g, ...pr(268, 298, 130, 160), y, 0.4, M.grey, 0.04)
  roundTable(g, U(95), V(400), y, 0.45)
  for (const [x, yy] of [[370, 95], [430, 95], [400, 125]]) chair(g, U(yy), V(x), y, M.coral)
  rr(g, ...pr(410, 488, 190, 222), y, 0.75, M.dark, 0.03)
  plant(g, U(95), V(205), y, 0.8)
  stairsV(g, V(240), V(372), U(285), U(237), y, H1 + 0.18)
}
// ============ терраса с бассейном ============
{
  const g = floor1G
  rect(g, ...pr(35, 170, 72, 292), 0, 0.1, texMat(T.deck, 1.2, 2), true, false)
  pool(g, ...pr(45, 160, 160, 255), 0.1)
  for (const x of [60, 100, 140]) ball(g, U(270), V(x), 0.22, 0.3, M.leaf, 0.8)
  plant(g, U(95), V(150), 0.1, 0.8)
  railing(g, U(72), V(35), U(292), V(35), 0.1); railing(g, U(72), V(35), U(72), V(170), 0.1); railing(g, U(292), V(35), U(292), V(170), 0.1)
}
// ============ 2 этаж: две спальни ============
const Y = H1 + 0.18, YF = Y + 0.04
{
  const g = floor2G, w = wl(makeWall(g, Y))
  const slab = (...a) => { rect(g, ...pr(...a), H1, 0.18, M.wood); rect(g, ...pr(...a), Y, 0.04, M.slab, true, false) }
  slab(175, 600, 10, 178); slab(400, 600, 178, 292)
  floorPatch(g, ...pr(175, 400, 10, 178), YF, T.planks, 1.6)
  floorPatch(g, ...pr(400, 600, 10, 178), YF, T.planks, 1.6)
  floorPatch(g, ...pr(480, 600, 180, 292), YF + 0.004, T.tiles, 0.8)
  floorPatch(g, ...pr(400, 480, 178, 292), YF, T.planks, 1.6)

  w(175, 10, 600, 10, H2); w(175, 10, 175, 292, H2); w(600, 10, 600, 292, H2); w(400, 292, 600, 292, H2)
  railing(g, U(178), V(175), U(178), V(400), YF); railing(g, U(178), V(400), U(292), V(400), YF)
  w(402, 10, 402, 135, H2)
  w(480, 205, 480, 292, H2); w(480, 182, 600, 182, H2)
  // спальня 1: кровать изголовьем к верхней стене
  bedU(g, ...pr(230, 330, 25, 150), U(25), YF, M.coral)
  rr(g, ...pr(205, 225, 25, 45), YF, 0.45, M.woodL, 0.04); rr(g, ...pr(335, 355, 25, 45), YF, 0.45, M.woodL, 0.04)
  rr(g, ...pr(225, 330, 130, 172), YF, 0.012, M.grey, 0.005, false)
  // спальня 2: кровать изголовьем к правой стене, стол
  bed(g, ...pr(460, 570, 45, 145), V(578), YF, M.coral)
  rr(g, ...pr(560, 590, 22, 42), YF, 0.45, M.woodL, 0.04); rr(g, ...pr(560, 590, 148, 168), YF, 0.45, M.woodL, 0.04)
  rr(g, ...pr(405, 440, 60, 145), YF, 0.75, M.dark, 0.03); chair(g, U(100), V(385), YF, M.coral)
  // угловое помещение: тумба с раковиной
  vanity(g, ...pr(505, 550, 260, 288), YF)
}
P(floor1G, 1.65, U(160), V(370), Math.PI / 2, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.75, U(110), V(110), 0.4, 0.1, 0x4aa8a8, 0xf3ead8)
P(floor2G, 1.7, U(200), V(440), Math.PI, YF, 0x7fae95, 0x4a3a2e)

ToonKit.start({
  sub: '69.95 m² · 2 ' + Model3D.roomWord('bedroomsPlural'),
  facts: [
    { group: 'floor1', rooms: [['living'], ['bathroom'], ['stairs'], ['terrace', 9.5], ['pool']] },
    { group: 'floor2', rooms: [['bedroom', undefined, 2]] },
  ],
  L1: [
    Lb('living', undefined, U(130), 2.2, V(330)),
    Lb('bathroom', undefined, U(150), 2.4, V(550)),
    Lb('stairs', undefined, U(262), 2.2, V(305)),
    Lb('terrace', 9.5, U(110), 1.3, V(100), true),
  ],
  L2: [
    Lb('bedroom', undefined, U(90), Y + 2.0, V(285)),
    Lb('bedroom', undefined, U(95), Y + 2.0, V(515)),
  ],
})
</script>
</body>
</html>
