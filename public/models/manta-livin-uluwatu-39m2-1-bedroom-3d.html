// Размеры и площади — с чертежа «Plan of furniture and equipment
// arrangement 38 м², 1:40» (BODES studio): квартира 6.5 × 5.8 м,
// основная комната (кухня, гостиная и спальная зона) 30.33 м²,
// ванная 3.88, прихожая с гардеробом 2.35. Мебель — по чертежу.
const PLAN = { name: 'Manta Livin 38 m²', W: 5.8, HD: 6.5, BACK: 0.4, FRONT: 0.6, H1: 3.0, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
const y = 0.12, PU = 4.0, BV = 1.75, HV = 2.87
rect(siteG, -0.4, HD + 0.6, -0.3, W + 0.3, -0.3, 0.3, M.stone)
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  floorPatch(g, 0, PU, 0, W, y, T.planks, 1.6)                 // комната
  floorPatch(g, PU, HD, HV, W, y, T.planks, 1.6)               // кухня и вход
  floorPatch(g, PU, HD, 0, BV, y + 0.004, T.tiles, 0.8)        // ванная
  floorPatch(g, PU, HD, BV, HV, y, T.terrazzo, 1.4)            // прихожая

  glassWall(g, 0, 0, 0, W, 0, H1)                              // окно во всю стену
  wall(0, 0, HD, 0, H1); wall(0, W, HD, W, H1)
  wall(HD, 0, HD, 3.0, H1); wall(HD, 3.9, HD, W, H1)
  door(g, HD, 3.0, 3.9, y)
  // ванная и прихожая
  wall(PU, 0, PU, HV, H1)
  wall(PU, BV, 5.25, BV, H1); wall(6.0, BV, HD, BV, H1)
  wall(PU, HV, 5.0, HV, H1); wall(5.95, HV, HD, HV, H1)

  // ванная: раковина, унитаз, душ
  vanity(g, 5.25, 6.3, 0.05, 0.46, y)
  toilet(g, 5.95, 1.05, y)
  shower(g, 4.25, 5.1, 0.08, 1.65, y)
  // прихожая: шкафы по краям
  rr(g, 5.95, 6.45, BV + 0.08, HV - 0.08, y, 2.1, M.wood, 0.04)
  rr(g, PU + 0.05, 4.55, BV + 0.08, HV - 0.08, y, 2.1, M.wood, 0.04)

  // спальная зона: кровать изголовьем к перегородке, ванна у окна
  bedU(g, 1.9, PU - 0.08, 0.56, 2.45, PU - 0.08, y, M.coral)
  rr(g, 3.55, 3.95, 0.07, 0.45, y, 0.45, M.woodL, 0.04); rr(g, 3.55, 3.95, 2.55, 2.95, y, 0.45, M.woodL, 0.04)
  tub(g, 0.2, 1.12, 0.7, 2.38, y)
  plant(g, 0.5, 0.35, y, 0.7)
  // гостиная: угловой диван, ТВ-консоль
  rr(g, 0.2, 2.73, 3.3, 4.4, y, 0.42, M.grey, 0.12)
  rr(g, 0.2, 2.73, 3.3, 3.6, y, 0.85, M.grey, 0.12)
  rr(g, 0.2, 1.3, 4.4, 4.97, y, 0.42, M.grey, 0.12)
  rr(g, 1.6, 2.0, 3.65, 3.85, y + 0.42, 0.3, M.cush, 0.1)
  rr(g, 0.6, 1.0, 3.65, 3.85, y + 0.42, 0.3, M.mustard, 0.1)
  rr(g, 0.2, 2.73, W - 0.35, W - 0.06, y, 0.45, M.wood, 0.04)
  rect(g, 0.8, 2.1, W - 0.16, W - 0.1, 0.9, 0.7, M.dark)
  // кухня: столешница у входа, остров с варочной панелью и табуретами
  rr(g, 5.9, HD - 0.05, 4.0, W - 0.05, y, 0.82, M.sage, 0.03)
  rect(g, 5.88, HD - 0.05, 4.0, W - 0.05, 0.94, 0.05, M.white)
  rr(g, 5.9, HD - 0.05, 5.15, W - 0.05, y, 1.9, M.steel, 0.06)
  rr(g, 4.0, 4.93, 4.0, W - 0.05, y, 0.92, M.woodL, 0.04)
  rect(g, 3.95, 4.98, 3.95, W - 0.05, 1.04, 0.05, M.white)
  for (const v of [4.4, 4.9, 5.4]) stool(g, 3.6, v, y)
}
P(floor1G, 1.65, 3.0, 3.2, Math.PI, y, 0xf08a6b, 0x4a5a78)

ToonKit.start({
  sub: '38 m² · 1 ' + Model3D.roomWord('bedroom'),
  facts: [{ group: 'floor1', rooms: [['livingKitchen', 30.33], ['bathroom', 3.88], ['hall', 2.35]] }],
  L1: [
    Lb('livingKitchen', 30.33, 1.6, 2.3, 4.2),
    Lb('bedroom', undefined, 2.9, 2.0, 1.5),
    Lb('bathroom', 3.88, 5.2, 2.6, 0.8),
    Lb('hall', 2.35, 5.2, 2.4, 2.3),
  ],
})
