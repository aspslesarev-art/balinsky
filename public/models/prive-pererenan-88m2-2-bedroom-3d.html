<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prive 2BR — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Площади — с плана «Вилла с 2 спальнями, 1 тип планировки»: 1 этаж —
// гостиная 21.50, кухня 17.02, санузел 1.79, лестница 4.41; 2 этаж —
// лестница 7.01, спальня 1 11.41, спальня 2 15.12, санузлы по 2.91,
// гардеробы 2.11 и 1.79 (в словаре нет «гардероба» — без подписи).
// Размеров нет: метры сняты по масштабу картинки (1 px ≈ 1.66 см,
// подогнано под площади гостиной и кухни).
const k = 0.0166, X0 = 434, X1 = 1020, YT = 190, YB = 494
const PLAN = { name: 'Prive 2BR', W: (X1 - X0) * k, HD: (YB - YT) * k, BACK: 1.6, FRONT: 1.6, H1: 3.0, H2: 2.9, floors: 2 }
</script>
<script src="_toon-kit.js"></script>
<script>
const V = p => (p - X0) * k, U = p => (YB - p) * k
const pr = (x1, x2, y1, y2) => [U(y2), U(y1), V(x1), V(x2)]
const wl = wall => (x1, y1, x2, y2, h) => wall(U(y1), V(x1), U(y2), V(x2), h)
function stairsV (g, va, vb, u1, u2, y0, y1, n = 14) {
  const d = (vb - va) / n, r = (y1 - y0) / n
  for (let i = 0; i < n; i++) { const a = va + d * i, b = a + d; rect(g, u1, u2, Math.min(a, b), Math.max(a, b), y0, r * (i + 1), M.woodL) }
}
lot()
const y = 0.12
// ============ 1 этаж ============
{
  const g = floor1G, w = wl(makeWall(g, 0))
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  floorPatch(g, ...pr(434, 645, 190, 494), y, T.terrazzo, 1.4)        // кухня
  floorPatch(g, ...pr(645, 1020, 290, 494), y, T.planks, 1.6)         // гостиная
  floorPatch(g, ...pr(645, 1020, 190, 290), y + 0.004, T.planks, 1.6)
  floorPatch(g, ...pr(645, 745, 190, 288), y + 0.008, T.tiles, 0.8)   // санузел

  w(434, 190, 1020, 190, H1); w(434, 494, 1020, 494, H1); w(434, 190, 434, 494, H1)
  w(1020, 190, 1020, 290, H1)
  glassWall(g, U(290), V(1020), U(494), V(1020), 0, H1)
  w(645, 190, 645, 290, H1); w(645, 288, 655, 288, H1); w(710, 288, 745, 288, H1); w(745, 190, 745, 290, H1)
  toilet(g, U(215), V(690), y); vanity(g, ...pr(720, 742, 230, 280), y)

  // лестница вдоль верхней стены: подъём справа налево, под ней шкафы
  stairsV(g, V(915), V(752), U(265), U(195), y, H1 + 0.18)
  rr(g, ...pr(972, 1012, 200, 285), y, 2.0, M.wood, 0.03)
  // кухня: столешница вдоль верхней стены, остров, обеденный стол
  rr(g, ...pr(450, 640, 198, 235), y, 0.82, M.sage, 0.03)
  rect(g, ...pr(450, 640, 196, 237), 0.94, 0.05, M.white)
  rr(g, ...pr(473, 583, 305, 375), y, 0.95, M.sage, 0.04)
  rect(g, ...pr(470, 586, 302, 378), 1.07, 0.05, M.white)
  rr(g, ...pr(515, 685, 360, 425), y + 0.7, 0.06, M.woodL, 0.03)
  rr(g, ...pr(585, 615, 380, 405), y, 0.7, M.wood, 0.03)
  for (const x of [603, 645]) chair(g, U(342), V(x), y)
  for (const x of [545, 598, 650]) chair(g, U(440), V(x), y)
  // гостиная: угловой диван, ТВ-тумба
  cyl(g, U(400), V(830), 1.1, 1.1, 0.015, y, M.mustard, 40, false)
  rr(g, ...pr(765, 940, 440, 468), y, 0.85, M.sofa, 0.12)
  rr(g, ...pr(765, 860, 395, 468), y, 0.42, M.sofa, 0.12)
  rr(g, ...pr(862, 940, 370, 468), y, 0.42, M.sofa, 0.12)
  rr(g, ...pr(790, 815, 420, 438), y + 0.42, 0.3, M.cush, 0.1)
  rr(g, ...pr(785, 845, 362, 382), y, 0.45, M.wood, 0.04)
  plant(g, U(470), V(995), y, 0.9)
}
// ============ 2 этаж ============
const Y = H1 + 0.18, YF = Y + 0.04
{
  const g = floor2G, w = wl(makeWall(g, Y))
  const slab = (x1, x2, y1, y2) => { rect(g, ...pr(x1, x2, y1, y2), H1, 0.18, M.wood); rect(g, ...pr(x1, x2, y1, y2), Y, 0.04, M.slab, true, false) }
  slab(434, 752, 190, 494); slab(752, 1020, 265, 494); slab(915, 1020, 190, 265)
  floorPatch(g, ...pr(434, 645, 190, 393), YF, T.planksDark, 1.6)
  floorPatch(g, ...pr(645, 1020, 265, 494), YF, T.planksDark, 1.6)
  floorPatch(g, ...pr(645, 752, 190, 265), YF, T.planks, 1.6)
  floorPatch(g, ...pr(434, 518, 393, 494), YF, T.planks, 1.6)
  floorPatch(g, ...pr(518, 665, 393, 494), YF + 0.004, T.tiles, 0.8)
  floorPatch(g, ...pr(680, 822, 393, 494), YF + 0.004, T.tiles, 0.8)

  w(434, 190, 1020, 190, H2); w(434, 494, 1020, 494, H2); w(434, 190, 434, 494, H2); w(1020, 190, 1020, 494, H2)
  w(645, 190, 645, 393, H2)                         // спальня 1 | холл
  w(434, 393, 580, 393, H2); w(518, 393, 518, 494, H2)
  w(665, 393, 665, 494, H2)
  w(680, 393, 680, 494, H2); w(680, 393, 735, 393, H2); w(785, 393, 822, 393, H2); w(822, 393, 822, 494, H2)
  w(727, 355, 727, 393, H2)
  railing(g, U(268), V(752), U(268), V(915), YF)
  w(920, 190, 920, 290, H2); w(920, 290, 945, 290, H2)    // гардероб 2

  // спальня 1
  bedU(g, ...pr(487, 610, 215, 345), U(215), YF, M.teal)
  rr(g, ...pr(458, 482, 218, 242), YF, 0.45, M.woodL, 0.04); rr(g, ...pr(615, 638, 218, 242), YF, 0.45, M.woodL, 0.04)
  rr(g, ...pr(440, 512, 455, 488), YF, 2.0, M.wood, 0.03)        // гардероб 1
  // санузлы
  toilet(g, U(450), V(607), YF); shower(g, ...pr(640, 662, 400, 470), YF); vanity(g, ...pr(530, 575, 470, 490), YF)
  toilet(g, U(450), V(755), YF); shower(g, ...pr(792, 818, 400, 470), YF); vanity(g, ...pr(690, 735, 470, 490), YF)
  // спальня 2: изголовье к нижней стене
  bedU(g, ...pr(827, 947, 345, 470), U(470), YF, M.coral)
  rr(g, ...pr(955, 985, 445, 470), YF, 0.45, M.woodL, 0.04)
  rr(g, ...pr(850, 910, 270, 285), YF, 0.6, M.dark, 0.03)
  rr(g, ...pr(925, 1015, 200, 230), YF, 2.0, M.wood, 0.03)       // гардероб 2
}
P(floor1G, 1.65, U(330), V(700), Math.PI / 2, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.78, U(330), V(900), -0.4, y, 0x4aa8a8, 0xf3ead8)
P(floor2G, 1.7, U(330), V(690), Math.PI, YF, 0x7fae95, 0x4a3a2e)

ToonKit.start({
  sub: '2 ' + Model3D.roomWord('bedroomsPlural'),
  facts: [
    { group: 'floor1', rooms: [['living', 21.5], ['kitchen', 17.02], ['bathroom', 1.79], ['stairs', 4.41]] },
    { group: 'floor2', rooms: [['bedroom', 11.41], ['bedroom', 15.12], ['bathroom', 2.91, 2], ['stairs', 7.01]] },
  ],
  L1: [
    Lb('living', 21.5, U(330), 2.2, V(880)),
    Lb('kitchen', 17.02, U(270), 2.2, V(540)),
    Lb('bathroom', 1.79, U(240), 2.6, V(695)),
    Lb('stairs', 4.41, U(230), 2.8, V(840)),
  ],
  L2: [
    Lb('bedroom', 11.41, U(290), Y + 2.0, V(545)),
    Lb('bedroom', 15.12, U(340), Y + 2.0, V(900)),
    Lb('bathroom', 2.91, U(445), Y + 1.6, V(590)),
    Lb('bathroom', 2.91, U(445), Y + 2.2, V(750)),
    Lb('stairs', 7.01, U(320), Y + 1.6, V(695)),
  ],
})
</script>
</body>
</html>
