// Слайд «Односпальные апартаменты AL, 38,6 м²». Площади с плана: ванная

// по масштабу кровати (≈4.4 × 8.4 м). Спальная ниша отделена стеллажом.
const PLAN = { name: 'Baza Kedungu · AL', W: 4.4, HD: 8.4, BACK: 0.4, FRONT: 0.6, H1: 2.9, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
rect(siteG, -0.4, HD + 0.4, -0.4, W + 0.4, -0.3, 0.3, M.stone)
const y = 0.12
const UB = 6.33, VB = 1.63
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  floorPatch(g, 0, HD, 0, W, y, T.planks, 1.6)
  floorPatch(g, UB, HD, VB, W, y + 0.004, T.tiles, 0.8)

  glassWall(g, 0, 0, 0, W, 0, H1)
  wall(0, 0, HD, 0, H1); wall(0, W, HD, W, H1)
  wall(HD, 0, HD, 0.88, H1); wall(HD, 1.55, HD, W, H1)
  door(g, HD, 0.88, 1.55, y)
  // ванная: дверь из коридора
  wall(UB, VB, UB, W, H1)
  wall(UB, VB, 6.75, VB, H1); wall(7.6, VB, HD, VB, H1)
  door(g, VB, 6.75, 7.6, y, false, 0.6)
  toilet(g, 7.0, 2.5, y); shower(g, UB + 0.1, HD - 0.1, 3.25, W - 0.1, y); vanity(g, HD - 0.5, HD - 0.05, 1.85, 2.95, y)
  // коридор со шкафом, кухня и рабочий стол вдоль левой стены

  rr(g, 4.0, 6.45, 0.05, 0.7, y, 0.82, M.sage, 0.03); rect(g, 4.0, 6.45, 0.03, 0.72, 0.94, 0.05, M.white)
  rr(g, 4.0, 6.45, 0.05, 0.4, H1 - 1.0, 0.7, M.sage, 0.03)

  // спальная ниша: кровать изголовьем к ванной, стеллаж

  rr(g, 0.7, 3.5, 1.8, 3.9, y, 0.012, M.mustard, 0.005, false)
  rr(g, 1.1, 3.2, 3.3, W - 0.15, y, 0.42, M.sofa, 0.12); rr(g, 1.1, 3.2, W - 0.45, W - 0.15, y, 0.85, M.sofa, 0.12)
  cyl(g, 2.1, 2.6, 0.38, 0.34, 0.38, y, M.woodL, 24)
  chair(g, 0.75, 2.6, y, M.teal)

P(floor1G, 1.65, 3.0, 1.4, Math.PI, y, 0xf08a6b, 0x4a5a78)

  ],
})
