<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elysium A3 — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Elysium, «Apartment Type A3». Площади — из таблицы на листе: комната
// 20.60, ванная 4.20, балкон 1.70, всего 26.50 м². Размеров на плане нет:
// квартира ≈ 3.5 × 7.3 м подогнана под эти площади, остальное — по масштабу.
const PLAN = { name: 'Elysium A3', W: 3.46, HD: 7.33, BACK: 1.1, FRONT: 0.4, H1: 3.0, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
rect(siteG, -BACK - 0.3, HD + 0.3, -0.3, W + 0.3, -0.3, 0.3, M.stone)
const y = 0.12
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  floorPatch(g, 0, HD, 0, W, y, T.planks, 1.6)
  floorPatch(g, 4.48, HD, 0, 1.44, y + 0.004, T.tiles, 0.8)

  wall(HD, 0, HD, 2.63, H1); door(g, HD, 2.63, 3.4, y)
  wall(0, 0, HD, 0, H1); wall(0, W, HD, W, H1)
  glassWall(g, 0, 0, 0, W, 0, H1)
  // ванная у входа
  wall(4.48, 0, 4.48, 1.44, H1); wall(4.48, 1.44, 6.5, 1.44, H1)
  toilet(g, 5.85, 0.35, y); vanity(g, 6.5, 7.2, 0.05, 0.5, y); shower(g, 4.6, 5.4, 0.1, 1.35, y)
  door(g, 1.44, 6.55, 7.25, y, false, 0.4)
  // кухня: линия вдоль стенки ванной и у правой стены
  rr(g, 4.38, 6.4, 1.52, 2.25, y, 0.82, M.sage, 0.03)
  rect(g, 4.36, 6.42, 1.5, 2.27, 0.94, 0.05, M.white)
  rr(g, 5.75, 6.4, 1.52, 2.25, y, 1.9, M.steel, 0.06)
  rr(g, 3.05, 4.6, 3.05, W - 0.05, y, 0.82, M.sage, 0.03)
  // кровать изголовьем к левой стене, ТВ напротив
  bed(g, 1.0, 2.94, 0.04, 2.12, 0.04, y, M.teal)
  rr(g, 0.6, 0.98, 0.05, 0.45, y, 0.45, M.woodL, 0.04); rr(g, 2.96, 3.34, 0.05, 0.45, y, 0.45, M.woodL, 0.04)
  rr(g, 1.3, 2.8, W - 0.35, W - 0.05, y, 0.5, M.wood, 0.04); rect(g, 1.6, 2.5, W - 0.09, W - 0.05, 1.0, 0.55, M.dark)
  // стол и тумба у стенки ванной, кресло у окна
  rr(g, 3.67, 4.33, 0.05, 0.95, y, 0.8, M.woodL, 0.04)
  rr(g, 3.67, 4.33, 0.95, 2.25, y + 0.72, 0.05, M.woodL, 0.03)
  cyl(g, 3.4, 1.6, 0.18, 0.18, 0.45, y, M.coral, 14)
  rr(g, 0.1, 0.75, 0.25, 0.95, y, 0.45, M.mustard, 0.15)
  cyl(g, 0.4, 1.2, 0.22, 0.22, 0.45, y, M.white, 16)
}
// ============ балкон и цветочный ящик ============
{
  const g = floor1G
  rect(g, -BACK, 0, 1.45, W, 0, 0.1, texMat(T.deck, 1.2, 0.5), true, false)
  rect(g, -0.55, 0, 0, 1.4, 0, 0.5, M.stone)
  for (const v of [0.35, 0.95]) ball(g, -0.28, v, 0.25, 0.7, M.leaf, 0.8)
  railing(g, -BACK, 1.45, -BACK, W, 0.1); railing(g, -BACK, 1.45, 0, 1.45, 0.1); railing(g, -BACK, W, 0, W, 0.1)
  chair(g, -0.55, 2.9, 0.1, M.white)
}
P(floor1G, 1.65, 3.6, 2.6, Math.PI, y, 0xf08a6b, 0x4a5a78)

const OPTS = {
  sub: '26.5 m² · 1 ' + Model3D.roomWord('bedroom'),
  facts: [{ group: 'floor1', rooms: [['living', 20.6], ['bathroom', 4.2], ['balcony', 1.7]] }],
  L1: [
    Lb('living', 20.6, 2.6, 2.2, 1.7),
    Lb('bathroom', 4.2, 5.8, 2.5, 0.8),
    Lb('balcony', 1.7, -0.6, 1.3, 2.4, true),
  ],
}
// Координаты сняты с чертежа сверху вниз — отражаем по ширине, чтобы
// план не вышел зеркальным (получается тот же план, повёрнутый на 180°).
for (const G of [floor1G, floor2G, siteG, labelsG]) for (const c of G.children) { c.position.x *= -1; c.rotation.y *= -1; c.scale.x *= -1 }
ToonKit.start(OPTS)
</script>
</body>
</html>
