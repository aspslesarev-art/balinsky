<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>White Palm 2BR Studio — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// С чертежа Archestet «Floor plan — 1st floor — 2BR» (М 1:50, лист A-102):
// юнит 11.20 × 6.00 м + терраса 1.50 м. Площади из таблицы: студия
// (гостиная с кухней) 27.4, спальни по 14.1, ванные по 4.8, терраса 16.7,
// всего 81.7 м². Юнит симметричный: спальни с ванными по краям.
const k = 0.0175, X0 = 226, X1 = 866, YT = 157, YB = 580
const PLAN = { name: 'White Palm 2BR', W: 11.2, HD: (YB - YT) * k, BACK: 0.6, FRONT: 0.6, H1: 3.0, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
const V = p => (p - X0) * k, U = p => (YB - p) * k
const pr = (x1, x2, y1, y2) => [U(y2), U(y1), V(x1), V(x2)]
const M2 = x => 1092 - x            // зеркало правой половины
rect(siteG, ...pr(214, 878, 145, 600), -0.3, 0.3, M.stone)
const y = 0.12
{
  const g = floor1G, wall = makeWall(g, 0)
  const w = (x1, y1, x2, y2, h) => wall(U(y1), V(x1), U(y2), V(x2), h)
  rect(g, ...pr(226, 866, 157, 495), 0, 0.12, M.slab)
  floorPatch(g, ...pr(410, 682, 157, 495), y, T.terrazzo, 1.4)
  w(226, 157, 866, 157, H1); w(226, 157, 226, 495, H1); w(866, 157, 866, 495, H1)
  for (const s of [1, -1]) {
    const X = x => (s === 1 ? x : M2(x)), sp = (a, b) => (s === 1 ? [a, b] : [M2(b), M2(a)])
    const R = (x1, x2, y1, y2) => pr(...sp(x1, x2), y1, y2)
    floorPatch(g, ...R(228, 410, 157, 262), y + 0.004, T.tiles, 0.8)
    floorPatch(g, ...R(228, 410, 262, 495), y, T.planksDark, 1.6)
    w(X(410), 157, X(410), 282, H1); w(X(410), 302, X(410), 495, H1)
    w(X(226), 262, X(325), 262, H1); w(X(360), 262, X(410), 262, H1)
    w(X(226), 222, X(320), 222, H1)
    glassWall(g, U(495), V(X(226)), U(495), V(X(410)), 0, H1)
    // ванная: душ, раковина, унитаз; шкаф
    shower(g, ...R(232, 318, 165, 215), y); vanity(g, ...R(328, 408, 162, 192), y); toilet(g, U(228), V(X(395)), y)
    rr(g, ...R(235, 320, 228, 260), y, 2.0, M.wood, 0.03)
    // спальня
    bed(g, ...R(240, 355, 318, 438), V(X(236)), y, s === 1 ? M.teal : M.coral)
    cyl(g, U(300), V(X(248)), 0.17, 0.17, 0.5, y, M.woodL, 16)
    rr(g, ...R(400, 408, 340, 440), y, 0.012, M.cush, 0.005, false)
    chair(g, U(458), V(X(272)), y, M.mustard)
    // терраса: два кресла и столик
    for (const x of [285, 390]) chair(g, U(530), V(X(x)), 0.1, M.white)
    roundTable(g, U(555), V(X(337)), 0.1, 0.38)
  }
  glassWall(g, U(495), V(410), U(495), V(682), 0, H1)
  // студия: кухня вдоль верхней стены, стол на 4, диван, ТВ
  rr(g, ...pr(415, 676, 162, 195), y, 0.82, M.white, 0.03); rect(g, ...pr(413, 678, 160, 197), 0.94, 0.05, M.grey)
  rr(g, ...pr(500, 588, 252, 298), y + 0.7, 0.06, M.white, 0.03); rr(g, ...pr(530, 558, 265, 285), y, 0.7, M.wood, 0.03)
  for (const [x, yy] of [[488, 275], [600, 275], [522, 315], [565, 315]]) chair(g, U(yy), V(x), y, M.white)
  rr(g, ...pr(505, 550, 350, 478), y, 0.42, M.sofa, 0.12); rr(g, ...pr(505, 598, 437, 478), y, 0.42, M.sofa, 0.12)
  rr(g, ...pr(505, 520, 350, 478), y, 0.85, M.sofa, 0.12)
  cyl(g, U(395), V(597), 0.3, 0.3, 0.4, y, M.white, 20)
  rr(g, ...pr(418, 443, 360, 460), y, 0.5, M.white, 0.03)
  plant(g, U(470), V(660), y, 0.7)
}
// терраса во всю ширину и кашпо
{
  const g = floor1G
  rect(g, ...pr(226, 866, 495, 580), 0, 0.1, M.stone, true, false)
  for (const [a, b] of [[245, 395], [530, 655], [697, 847]]) { rect(g, ...pr(a, b, 580, 598), 0, 0.5, M.white); rect(g, ...pr(a + 3, b - 3, 582, 596), 0.5, 0.05, M.leaf, false, false) }
}
P(floor1G, 1.65, U(330), V(640), Math.PI / 2, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.75, U(540), V(500), 0.3, 0.1, 0x4aa8a8, 0xf3ead8)

ToonKit.start({
  sub: '81.7 m² · 2 ' + Model3D.roomWord('bedroomsPlural'),
  facts: [{ group: 'floor1', rooms: [['livingKitchen', 27.4], ['bedroom', 14.1, 2], ['bathroom', 4.8, 2], ['terrace', 16.7]] }],
  L1: [
    Lb('livingKitchen', 27.4, U(330), 2.3, V(546)),
    Lb('bedroom', 14.1, U(380), 2.2, V(300)),
    Lb('bedroom', 14.1, U(380), 2.2, V(M2(300))),
    Lb('bathroom', 4.8, U(200), 2.6, V(320)),
    Lb('bathroom', 4.8, U(200), 2.6, V(M2(320))),
    Lb('terrace', 16.7, U(540), 1.3, V(546), true),
  ],
})
</script>
</body>
</html>
