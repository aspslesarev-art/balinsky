<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>White Palm Studio 32 — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Размеры — с чертежа Archestet «Floor plan – 2nd floor – 1BR» (М 1:50):
// студия 5.60 × 6.00 м, за окном цветочный ящик 0.60 м. Площади — из
// таблицы на листе: студия 26.6, ванная 5.4, всего 32.0 м².
const PLAN = { name: 'White Palm Studio 32', W: 5.6, HD: 5.95, BACK: 0.6, FRONT: 0.4, H1: 3.0, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
rect(siteG, -BACK - 0.3, HD + 0.3, -0.3, W + 0.3, -0.3, 0.3, M.stone)
const y = 0.12
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  floorPatch(g, 0, HD, 0, W, y, T.terrazzo, 2)
  floorPatch(g, 0.05, 2.82, 0.05, 2.22, y + 0.004, T.tiles, 0.8)

  wall(HD, 0, HD, 1.2, H1); wall(HD, 2.0, HD, W, H1); door(g, HD, 1.2, 2.0, y)
  wall(0, 0, HD, 0, H1); wall(0, W, HD, W, H1)
  wall(0, 0, 0, 1.5, H1); glassWall(g, 0, 1.5, 0, W, 0, H1)
  // ванная в углу у окна
  wall(2.82, 0, 2.82, 2.22, H1); wall(0, 2.22, 2.05, 2.22, H1)
  door(g, 2.22, 2.05, 2.8, y, false, 0.4)
  toilet(g, 1.43, 0.4, y); vanity(g, 2.1, 2.7, 0.1, 0.6, y)
  shower(g, 0.1, 1.5, 1.74, 2.15, y)
  // кухня вдоль левой стены
  rr(g, 2.9, 5.86, 0.08, 0.7, y, 0.82, M.sage, 0.03)
  rect(g, 2.9, 5.86, 0.06, 0.72, 0.94, 0.05, M.white)
  rr(g, 2.9, 3.6, 0.08, 0.7, y, 1.9, M.steel, 0.06)
  // кровать изголовьем к правой стене
  rr(g, 0.3, 3.0, 3.0, 5.0, y, 0.012, M.mustard, 0.005, false)
  bed(g, 0.6, 2.4, 3.2, 5.45, 5.45, y, M.teal)
  cyl(g, 0.4, 5.2, 0.2, 0.2, 0.5, y, M.woodL, 16)
  // диван спиной к кровати, столик, ТВ у входной стены
  rr(g, 3.43, 4.17, 3.0, 4.87, y, 0.42, M.sofa, 0.12)
  rr(g, 3.43, 3.73, 3.0, 4.87, y, 0.85, M.sofa, 0.12)
  rr(g, 3.8, 4.0, 3.4, 3.8, y + 0.42, 0.3, M.cush, 0.1)
  rr(g, 4.2, 5.4, 3.0, 4.9, y, 0.012, M.cush, 0.005, false)
  rr(g, 4.4, 4.9, 3.5, 4.4, y, 0.36, M.white, 0.04)
  rr(g, 5.55, 5.88, 3.0, 4.9, y, 0.5, M.wood, 0.04)
  plant(g, 5.5, W - 0.35, y, 0.7)
  // столовая
  roundTable(g, 4.4, 2.5, y, 0.4)
  chair(g, 3.75, 2.5, y, M.coral); chair(g, 5.05, 2.5, y, M.coral)
}
// ============ цветочный ящик за окном ============
{
  const g = floor1G
  rect(g, -BACK, 0, 1.48, 5.53, 0, 0.5, M.stone)
  rect(g, -BACK + 0.05, -0.05, 1.53, 5.48, 0.5, 0.02, texMat(T.grass, 2, 0.3), false, false)
  for (const v of [2.0, 2.9, 3.8, 4.7]) ball(g, -0.3, v, 0.28, 0.72, M.leaf, 0.8)
}
P(floor1G, 1.65, 4.6, 1.6, Math.PI / 2, y, 0xf08a6b, 0x4a5a78)

const OPTS = {
  sub: '32 m² · 1 ' + Model3D.roomWord('bedroom'),
  facts: [{ group: 'floor1', rooms: [['livingKitchen', 26.6], ['bathroom', 5.4]] }],
  L1: [
    Lb('livingKitchen', 26.6, 3.0, 2.2, 3.9),
    Lb('bathroom', 5.4, 1.4, 2.5, 1.1),
  ],
}
// Координаты сняты с чертежа сверху вниз — отражаем по ширине, чтобы
// план не вышел зеркальным (получается тот же план, повёрнутый на 180°).
for (const G of [floor1G, floor2G, siteG, labelsG]) for (const c of G.children) { c.position.x *= -1; c.rotation.y *= -1; c.scale.x *= -1 }
ToonKit.start(OPTS)
</script>
</body>
</html>
