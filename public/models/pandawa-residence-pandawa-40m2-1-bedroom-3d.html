<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solvyn City Studio — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// План «Solvyn City · Studio Apartment, Phase 1» (Sansara Development):
// 40 м², балкон, одна ванная. Размеров и площадей комнат на плане нет —
// метры сняты по масштабу кровати (≈7.75 × 4.47 м + балкон ≈1.5 м).
const PLAN = { name: 'Solvyn City · Studio', W: 4.47, HD: 7.75, BACK: 1.5, FRONT: 0.4, H1: 2.9, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
rect(siteG, -1.9, HD + 0.4, -0.4, W + 0.4, -0.3, 0.3, M.stone)
const y = 0.12
const UB = 5.64, VB = 2.75
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  floorPatch(g, 0, HD, 0, W, y, T.planks, 1.6)
  floorPatch(g, UB, HD, 0, VB, y + 0.004, T.tiles, 0.8)

  glassWall(g, 0, 0, 0, W, 0, H1)
  wall(0, 0, HD, 0, H1); wall(0, W, HD, W, H1)
  wall(HD, 0, HD, 2.95, H1); wall(HD, 3.75, HD, W, H1)
  door(g, HD, 2.95, 3.75, y)
  // ванная в углу у входа, дверь снизу
  wall(UB, 0, UB, VB, H1)
  wall(UB, VB, 6.3, VB, H1); wall(7.0, VB, HD, VB, H1)
  door(g, VB, 6.3, 7.0, y, false, 0.6)
  shower(g, UB + 0.1, HD - 0.1, 0.1, 1.15, y)
  vanity(g, UB + 0.1, 6.25, 1.5, 2.4, y); toilet(g, 7.3, 1.9, y)
  // кровать изголовьем к стене, тумбы
  bed(g, 1.35, 3.15, 0.1, 2.05, 0.1, y, M.teal)
  rr(g, 0.85, 1.25, 0.1, 0.5, y, 0.45, M.woodL, 0.04); rr(g, 3.25, 3.65, 0.1, 0.5, y, 0.45, M.woodL, 0.04)
  // диван, ковёр, столик
  rr(g, 3.9, 5.5, 0.6, 2.2, y, 0.012, M.mustard, 0.005, false)
  rr(g, 3.75, 5.15, 0.1, 0.8, y, 0.42, M.sofa, 0.12); rr(g, 3.75, 5.15, 0.1, 0.38, y, 0.85, M.sofa, 0.12)
  rr(g, 4.2, 4.6, 0.42, 0.62, y + 0.42, 0.3, M.cush, 0.1)
  cyl(g, 5.1, 1.4, 0.28, 0.25, 0.42, y, M.woodL, 20)
  // длинная столешница: кухня и ТВ; стол у балкона
  rr(g, 1.45, HD - 0.1, W - 0.6, W - 0.05, y, 0.82, M.sage, 0.03); rect(g, 1.45, HD - 0.1, W - 0.62, W - 0.03, 0.94, 0.05, M.white)
  rect(g, 2.6, 3.6, W - 0.15, W - 0.1, 1.2, 0.6, M.dark)
  rr(g, 0.95, 1.4, 3.2, W - 0.05, y + 0.72, 0.05, M.woodL, 0.03); rr(g, 1.0, 1.35, 3.25, 3.5, y, 0.72, M.wood, 0.03)
  chair(g, 0.6, 3.8, y, M.coral)
  plant(g, 0.35, 2.4, y, 0.6)
}
// ============ балкон ============
{
  const g = floor1G
  rect(g, -1.5, 0, 0, W, 0, 0.1, texMat(T.deck, 1.6, 0.6), true, false)
  rr(g, -1.15, -0.4, 3.3, 4.2, 0.1, 0.45, M.mustard, 0.15)
  roundTable(g, -0.9, 2.5, 0.1, 0.3)
  plant(g, -1.15, 0.5, 0.1, 0.7)
  railing(g, -1.5, 0, -1.5, W, 0.1)
}
P(floor1G, 1.65, 4.4, 2.8, -Math.PI / 2, y, 0xf08a6b, 0x4a5a78)

ToonKit.start({
  sub: '40 m² · 1 ' + Model3D.roomWord('bedroom'),
  facts: [{ group: 'floor1', rooms: [['living'], ['bathroom'], ['balcony']] }],
  L1: [
    Lb('living', undefined, 3.0, 2.2, 2.2),
    Lb('bathroom', undefined, 6.7, 2.4, 1.2),
    Lb('balcony', undefined, -0.8, 1.3, 1.6, true),
  ],
})
</script>
</body>
</html>
