<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edem II Type XXS — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Чертёж «First floor plan, Type XXS»: дом 3.5 × 5.6 м (санузел 1.45,
// спальня 4.15), терраса 1.1 м, за ней бассейн и садик с калиткой.
// Площади из таблицы: спальня 14.80, санузел 5.10, бассейн 5.70,
// терраса 4.10, сад 3.3, всего 33 м². Глубина зоны бассейна (~2.6 м) — по масштабу.
const PLAN = { name: 'Edem II · Type XXS', W: 3.5, HD: 5.6, BACK: 3.7, FRONT: 1.2, H1: 3.0, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
lot()
const y = 0.12
const UB = 4.15
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  floorPatch(g, 0, UB, 0, W, y, T.planksDark, 1.6)
  floorPatch(g, UB, HD, 0, W, y + 0.004, T.tiles, 0.8)

  wall(0, 0, HD, 0, H1); wall(0, W, HD, W, H1); wall(HD, 0, HD, W, H1)
  glassWall(g, 0, 0, 0, 2.6, 0, H1)
  wall(0, 2.6, 0, 2.75, H1)
  door(g, 0, 2.75, 3.4, y)                            // выход на террасу
  // санузел: душ, унитаз, раковина; дверь справа
  wall(UB, 0, UB, 2.5, H1)
  wall(UB, 1.25, HD, 1.25, H1)
  shower(g, UB + 0.1, HD - 0.1, 0.1, 1.15, y)
  toilet(g, HD - 0.4, 1.85, y)
  vanity(g, HD - 0.55, HD - 0.08, 2.55, 3.4, y)
  door(g, UB, 2.6, 3.35, y, true, 0.9)

  // спальня: кровать изголовьем к левой стене, шкаф, кресло, ТВ-полка
  bed(g, 0.95, 2.75, 0.15, 2.05, 0.15, y, M.teal)
  rr(g, 0.4, 0.85, 0.15, 0.55, y, 0.45, M.woodL, 0.04); rr(g, 2.85, 3.3, 0.15, 0.55, y, 0.45, M.woodL, 0.04)
  rr(g, 3.5, 4.05, 0.1, 2.4, y, 2.1, M.wood, 0.04)                 // шкаф
  chair(g, 3.1, 1.8, y, M.mustard)
  rr(g, 0.6, 2.9, W - 0.35, W - 0.1, y, 0.5, M.wood, 0.04)         // тумба с ТВ
  rect(g, 1.2, 2.3, W - 0.18, W - 0.13, 0.95, 0.55, M.dark)
}
// ============ терраса, бассейн, садик ============
{
  const g = floor1G
  rect(g, -1.1, 0, 0, W, 0, 0.1, texMat(T.deck, 1.2, 0.5), true, false)
  roundTable(g, -0.55, 1.1, 0.1, 0.3)
  chair(g, -0.55, 0.45, 0.1, M.white); chair(g, -0.55, 1.75, 0.1, M.white)
  rect(g, -BACK, -1.1, 0, 2.4, 0, 0.1, M.stone, true, false)
  pool(g, -3.5, -1.3, 0.25, 2.2, 0.1)
  for (let i = 0; i < 4; i++) rr(siteG, -3.4 + i * 0.6, -3.0 + i * 0.6, 2.65, 3.3, 0, 0.05, M.stone, 0.02, false)
  railing(g, -BACK, 0, -BACK, 2.4, 0.1)
  railing(g, -BACK, 0, -1.1, 0, 0.1)
  railing(g, -BACK, W, -1.1, W, 0.1)
  plant(g, -1.4, 3.1, 0, 0.7)
}
P(floor1G, 1.65, 3.0, 2.6, Math.PI, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.78, -0.5, 2.8, 0.3, 0.1, 0x4aa8a8, 0xf3ead8)

ToonKit.start({
  sub: '33 m² · 1 ' + Model3D.roomWord('bedroom'),
  facts: [{ group: 'floor1', rooms: [['bedroom', 14.8], ['bathroom', 5.1], ['terrace', 4.1], ['pool', 5.7]] }],
  L1: [
    Lb('bedroom', 14.8, 2.0, 2.0, 1.6),
    Lb('bathroom', 5.1, 4.9, 2.4, 1.75),
    Lb('terrace', 4.1, -0.55, 1.3, 2.6, true),
    Lb('pool', 5.7, -2.4, 1.3, 1.2, true),
  ],
})
</script>
</body>
</html>
