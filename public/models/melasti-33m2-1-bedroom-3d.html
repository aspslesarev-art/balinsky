<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melasti 33 м² — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// План апартамента застройщика: комната 21 м² (спальня с кухней вдоль
// стены), санузел 4 м², балкон 8 м². Размеров нет — масштаб по площадям
// (и кровати 1.8 м): комната ≈ 5.8 × 4.35 м, балкон ≈ 1.8 × 4.35 м.
const PLAN = { name: 'Melasti 33 m²', W: 4.35, HD: 5.8, BACK: 1.85, FRONT: 0.6, H1: 2.9, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
rect(siteG, -BACK - 0.3, HD + 0.3, -0.3, W + 0.3, -0.3, 0.3, M.stone)
const y = 0.12, BU = 4.15, BV = 2.5       // санузел: u от 4.15, v до 2.5
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  floorPatch(g, 0, HD, 0, W, y, T.planks, 1.6)
  floorPatch(g, BU, HD, 0, BV, y + 0.006, T.tiles, 0.8)

  wall(0, 0, HD, 0, H1); wall(0, W, HD, W, H1)
  wall(HD, 0, HD, 2.75, H1); wall(HD, 3.6, HD, W, H1)
  door(g, HD, 2.75, 3.6, y)
  glassWall(g, 0, 0, 0, W, 0, H1)
  // санузел
  wall(BU, 0, BU, BV, H1); wall(BU, BV, 4.3, BV, H1); wall(5.1, BV, HD, BV, H1)

  // кровать изголовьем к стене, тумбы, ковёр
  rr(g, 0.75, 3.4, 0.85, 2.95, y, 0.012, M.cush, 0.005, false)
  bed(g, 1.17, 2.95, 0.12, 2.4, 0.12, y, M.teal)
  rr(g, 0.62, 1.1, 0.12, 0.5, y, 0.45, M.woodL, 0.04); rr(g, 3.0, 3.5, 0.12, 0.5, y, 0.45, M.woodL, 0.04)
  cyl(g, 0.85, 0.3, 0.1, 0.14, 0.22, y + 0.45, M.mustard, 12)
  // кухня вдоль нижней стены, два табурета, шкаф у входа
  rr(g, 0.05, 4.0, W - 0.58, W - 0.05, y, 0.82, M.sage, 0.03)
  rect(g, 0.05, 4.0, W - 0.6, W - 0.03, 0.94, 0.05, M.white)
  rr(g, 0.05, 4.0, W - 0.35, W - 0.05, H1 - 1.0, 0.65, M.sage, 0.03)
  for (const u of [0.6, 1.38]) stool(g, u, W - 0.85, y)
  rr(g, 4.05, HD - 0.08, W - 0.58, W - 0.05, y, 2.1, M.wood, 0.04)
  // санузел: душ, туалет, раковина
  shower(g, BU + 0.05, 5.4, 0.08, 0.78, y)
  toilet(g, 4.55, 1.33, y)
  vanity(g, 5.3, HD - 0.08, 1.5, 2.3, y)
}
// ============ балкон ============
{
  const g = floor1G
  rect(g, -BACK, 0, 0, W, 0, 0.1, texMat(T.deck, 1.6, 0.8), true, false)
  rr(g, -1.85, -0.5, 0.12, 0.75, 0.1, 0.42, M.sofa, 0.12); rr(g, -1.85, -0.5, 0.12, 0.35, 0.1, 0.8, M.sofa, 0.12)
  rr(g, -1.75, -1.35, 0.4, 0.6, 0.52, 0.3, M.cush, 0.1)
  rr(g, -1.75, -1.15, 1.95, 2.55, 0.1, 0.45, M.mustard, 0.15)
  rr(g, -1.75, -1.4, 2.85, 3.2, 0.1, 0.5, M.woodL, 0.04)
  rr(g, -1.2, -0.6, 3.6, 4.2, 0.1, 0.45, M.mustard, 0.15)
  plant(g, -1.65, W - 0.35, 0.1, 0.8)
  railing(g, -BACK, 0, -BACK, W, 0.1); railing(g, -BACK, 0, 0, 0, 0.1); railing(g, -BACK, W, 0, W, 0.1)
}
P(floor1G, 1.65, 2.2, 3.4, Math.PI, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.78, -1.0, 1.5, -Math.PI / 2, 0.1, 0x4aa8a8, 0xf3ead8)

ToonKit.start({
  sub: '33 m² · 1 ' + Model3D.roomWord('bedroom'),
  facts: [{ group: 'floor1', rooms: [['bedroom', 21], ['bathroom', 4], ['balcony', 8]] }],
  L1: [
    Lb('bedroom', 21, 2.0, 2.2, 2.6),
    Lb('bathroom', 4, 4.95, 2.4, 1.2),
    Lb('balcony', 8, -1.0, 1.3, 2.2),
  ],
})
</script>
</body>
</html>
