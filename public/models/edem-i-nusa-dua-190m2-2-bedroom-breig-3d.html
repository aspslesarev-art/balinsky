<script>
// Пиксели картинки плана → метры чертежа (u, v). o — где на картинке сторона
// u=0 (двор/стекло): 'b' низ, 't' верх, 'r' право, 'l' лево; s — метров в пикселе;
// x0,y0,x1,y1 — рамка дома на картинке; du/dv — сдвиг (для второго этажа).
function mapPx (o, s, x0, y0, x1, y1, du = 0, dv = 0) {
  const uv = (x, y) => o === 'b' ? [(y1 - y) * s + du, (x - x0) * s + dv]
    : o === 't' ? [(y - y0) * s + du, (x1 - x) * s + dv]
    : o === 'r' ? [(x1 - x) * s + du, (y1 - y) * s + dv]
    : [(x - x0) * s + du, (y - y0) * s + dv]
  const r = (xa, ya, xb, yb) => { const a = uv(xa, ya), b = uv(xb, yb); return [Math.min(a[0], b[0]), Math.max(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[1], b[1])] }
  return { uv, r, s }
}
// Edem I, Nusa Dua — 2 спальни. На плане нет ни размеров, ни площадей:
// масштаб оценён по кровати (≈1.7 м) и дверям (≈0.9 м), ≈1.9 см на пиксель.
// 1 этаж: гостиная со столовой, кухня, спальня, ванная, внутренняя
// лестница; во дворе бассейн. 2 этаж: спальня с ванной, санузел, над
// гостиной — открытая крыша-терраса, к ней наружная лестница.
const S = 0.019
const A = mapPx('r', S, 110, 185, 375, 735)
const B = mapPx('r', S, 690, 185, 955, 735)
const PLAN = { name: 'Edem I 2BR', W: 550 * S, HD: 265 * S, BACK: 3.9, FRONT: 1.8, H1: 3.0, H2: 2.9, floors: 2 }
</script>
<script src="_toon-kit.js"></script>
<script>
// ---- помощники: всё в пикселях картинки плана через mapPx ----
const wl = (A, wall, xa, ya, xb, yb, h) => { const a = A.uv(xa, ya), b = A.uv(xb, yb); wall(a[0], a[1], b[0], b[1], h) }
const gl = (A, g, xa, ya, xb, yb, base, h) => { const a = A.uv(xa, ya), b = A.uv(xb, yb); glassWall(g, a[0], a[1], b[0], b[1], base, h) }
const rl = (A, g, xa, ya, xb, yb, base) => { const a = A.uv(xa, ya), b = A.uv(xb, yb); railing(g, a[0], a[1], b[0], b[1], base) }
const fp = (A, g, xa, ya, xb, yb, y, t, k) => floorPatch(g, ...A.r(xa, ya, xb, yb), y, t, k)
const bx = (A, g, xa, ya, xb, yb, y, h, mat, r = 0.04) => rr(g, ...A.r(xa, ya, xb, yb), y, h, mat, r)
function edgeOf (A, xa, ya, xb, yb, side) {
  const X1 = Math.min(xa, xb), X2 = Math.max(xa, xb), Y1 = Math.min(ya, yb), Y2 = Math.max(ya, yb)
  return side === 't' ? A.uv((X1 + X2) / 2, Y1) : side === 'b' ? A.uv((X1 + X2) / 2, Y2) : side === 'l' ? A.uv(X1, (Y1 + Y2) / 2) : A.uv(X2, (Y1 + Y2) / 2)
}
/** Кровать: side — сторона картинки, где изголовье. */
function bedP (A, g, xa, ya, xb, yb, side, y, mat) {
  const [u1, u2, v1, v2] = A.r(xa, ya, xb, yb), h = edgeOf(A, xa, ya, xb, yb, side)
  if (Math.abs(h[0] - u1) < 0.01 || Math.abs(h[0] - u2) < 0.01) bedU(g, u1, u2, v1, v2, h[0], y, mat)
  else bed(g, u1, u2, v1, v2, h[1], y, mat)
}
/** Диван: side — сторона спинки. */
function sofaP (A, g, xa, ya, xb, yb, side, y, mat = M.sofa) {
  const t = 0.28 / A.s, X1 = Math.min(xa, xb), X2 = Math.max(xa, xb), Y1 = Math.min(ya, yb), Y2 = Math.max(ya, yb)
  rr(g, ...A.r(X1, Y1, X2, Y2), y, 0.42, mat, 0.12)
  const b = side === 't' ? [X1, Y1, X2, Y1 + t] : side === 'b' ? [X1, Y2 - t, X2, Y2] : side === 'l' ? [X1, Y1, X1 + t, Y2] : [X2 - t, Y1, X2, Y2]
  rr(g, ...A.r(...b), y, 0.85, mat, 0.12)
}
/** Кухонная столешница. */
function ctr (A, g, xa, ya, xb, yb, y, h = 0.82) {
  const r = A.r(xa, ya, xb, yb)
  rr(g, ...r, y, h, M.sage, 0.03); rect(g, r[0] - 0.02, r[1] + 0.02, r[2] - 0.02, r[3] + 0.02, y + h, 0.05, M.white)
}
/** Марш лестницы: side — сторона картинки, куда ступени поднимаются. */
function stairsP (A, g, xa, ya, xb, yb, side, y0, y1, n = 12) {
  const X1 = Math.min(xa, xb), X2 = Math.max(xa, xb), Y1 = Math.min(ya, yb), Y2 = Math.max(ya, yb), Wd = X2 - X1, Hd = Y2 - Y1
  for (let i = 0; i < n; i++) {
    const f0 = i / n, f1 = (i + 1) / n
    const q = side === 't' ? [X1, Y2 - f1 * Hd, X2, Y2 - f0 * Hd] : side === 'b' ? [X1, Y1 + f0 * Hd, X2, Y1 + f1 * Hd]
      : side === 'l' ? [X2 - f1 * Wd, Y1, X2 - f0 * Wd, Y2] : [X1 + f0 * Wd, Y1, X1 + f1 * Wd, Y2]
    rect(g, ...A.r(...q), y0, (y1 - y0) * f1, i % 2 ? M.woodL : toon(0xd6a777))
  }
}
const at = (A, x, y) => A.uv(x, y)
const LbP = (A, key, area, x, y, h, out) => { const p = A.uv(x, y); return Lb(key, area, p[0], h, p[1], out) }
const PP = (A, g, hh, x, y, ry, yb, c1, c2) => { const p = A.uv(x, y); return P(g, hh, p[0], p[1], ry, yb, c1, c2) }
lot(0, 1.2)
{ const a = A.uv(110, 440), b = A.uv(110, 385); path(a[1], b[1]) }
const y = 0.12
// ============ 1 этаж ============
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  fp(A, g, 118, 192, 368, 478, y, T.planks, 1.6)          // гостиная-кухня
  fp(A, g, 172, 478, 368, 628, y, T.planksDark, 1.6)      // спальня
  fp(A, g, 118, 478, 172, 628, y, T.planks, 1.6)          // лестница
  fp(A, g, 118, 628, 368, 728, y + 0.004, T.tiles, 0.8)   // ванная

  wl(A, wall, 115, 190, 370, 190, H1); wl(A, wall, 115, 730, 370, 730, H1)
  wl(A, wall, 115, 190, 115, 730, H1)
  wl(A, wall, 370, 190, 370, 220, H1); gl(A, g, 370, 220, 370, 290, 0, H1); gl(A, g, 370, 290, 370, 360, 0, H1)
  wl(A, wall, 370, 360, 370, 385, H1); wl(A, wall, 370, 440, 370, 505, H1); gl(A, g, 370, 505, 370, 610, 0, H1)
  wl(A, wall, 370, 610, 370, 640, H1); wl(A, wall, 370, 690, 370, 730, H1)
  wl(A, wall, 172, 478, 322, 478, H1); wl(A, wall, 172, 478, 172, 628, H1)
  wl(A, wall, 115, 628, 322, 628, H1)

  // гостиная: ТВ у фасада, диван, столовая у окон
  bx(A, g, 121, 235, 132, 345, y, 0.5, M.wood); rect(g, ...A.r(117, 255, 119, 325), 0.9, 0.6, M.dark)
  rr(g, ...A.r(145, 262, 177, 325), y, 0.3, M.woodL, 0.05)
  sofaP(A, g, 210, 230, 255, 355, 'r', y, M.navy)
  rr(g, ...A.r(225, 255, 238, 280), y + 0.42, 0.3, M.cush, 0.1)
  rr(g, ...A.r(285, 237, 325, 335), y + 0.7, 0.06, M.woodL, 0.03); rr(g, ...A.r(297, 260, 313, 312), y, 0.7, M.wood, 0.03)
  for (const yy of [262, 312]) { chair(g, ...at(A, 274, yy), y); chair(g, ...at(A, 337, yy), y) }
  ctr(A, g, 178, 448, 320, 475, y)
  bx(A, g, 323, 448, 355, 475, y, 1.9, M.steel)
  plant(g, ...at(A, 350, 205), y, 0.8)
  stairsP(A, g, 120, 430, 170, 622, 't', y, H1 + 0.18, 14)
  // спальня
  bedP(A, g, 205, 525, 297, 622, 'b', y, M.teal)
  bx(A, g, 180, 600, 200, 622, y, 0.45, M.woodL); bx(A, g, 302, 600, 322, 622, y, 0.45, M.woodL)
  bx(A, g, 178, 486, 280, 500, y, 2.0, M.wood)
  // ванная
  tub(g, ...A.r(127, 640, 170, 722), y); shower(g, ...A.r(180, 675, 236, 724), y)
  toilet(g, ...at(A, 266, 706), y); vanity(g, ...A.r(295, 690, 345, 724), y)
}
// ============ двор: настил, бассейн, наружная лестница на крышу ============
{
  const g = floor1G
  rect(g, ...A.r(375, 185, 580, 735), 0, 0.1, texMat(T.deck, 2, 4), true, false)
  pool(g, ...A.r(440, 378, 558, 710), 0.1)
  lounger(g, ...A.r(392, 470, 426, 560), 0.1)
  lounger(g, ...A.r(392, 580, 426, 670), 0.1)
  plant(g, ...at(A, 395, 205), 0.1, 0.8); plant(g, ...at(A, 560, 720), 0.1, 0.9)
  stairsP(A, g, 178, 132, 385, 183, 'l', 0, H1 + 0.18, 14)
}
// ============ 2 этаж ============
const Y = H1 + 0.18, YF = Y + 0.04
const R = B.r(690, 425, 990, 700)            // жилая часть 2 этажа (со свесом над двором)
const St = A.r(120, 430, 170, 622)           // проём лестницы
{
  const g = floor2G, wall = makeWall(g, Y)
  const sl = (a, b, c, d) => { rect(g, a, b, c, d, H1, 0.18, M.wood); rect(g, a, b, c, d, Y, 0.04, M.slab, true, false) }
  sl(R[0], R[1], R[2], St[2]); sl(R[0], R[1], St[3], R[3])
  sl(R[0], St[0], St[2], St[3]); sl(St[1], R[1], St[2], St[3])
  // крыша-терраса над гостиной
  fp(A, g, 118, 192, 368, 425, YF, T.deck, 1)
  sl(0, R[1], R[3], W)
  fp(B, g, 750, 432, 985, 600, YF, T.planksDark, 1.6)     // спальня 2
  fp(B, g, 835, 605, 985, 692, YF + 0.004, T.tiles, 0.8)  // санузел
  fp(B, g, 695, 432, 750, 692, YF, T.planks, 1.6)

  wl(B, wall, 692, 428, 692, 698, H2); wl(B, wall, 692, 698, 988, 698, H2)
  wl(B, wall, 692, 428, 780, 428, H2); gl(B, g, 780, 428, 870, 428, Y, H2); gl(B, g, 930, 428, 988, 428, Y, H2)
  wl(B, wall, 988, 428, 988, 445, H2); gl(B, g, 988, 445, 988, 565, Y, H2); wl(B, wall, 988, 565, 988, 698, H2)
  wl(B, wall, 748, 435, 748, 635, H2)
  wl(B, wall, 835, 602, 988, 602, H2); wl(B, wall, 835, 602, 835, 698, H2)
  // ограждение крыши-террасы
  { const a = R[3]; railing(g, 0, a, 0, W, YF); railing(g, 0, W, HD, W, YF); railing(g, HD, a, HD, W - 1.1, YF) }

  bedP(B, g, 757, 465, 855, 552, 'l', YF, M.coral)
  bx(B, g, 757, 445, 775, 462, YF, 0.45, M.woodL); bx(B, g, 757, 555, 775, 572, YF, 0.45, M.woodL)
  tub(g, ...B.r(932, 470, 972, 555), YF)
  shower(g, ...B.r(920, 610, 978, 690), YF); toilet(g, ...at(B, 900, 672), YF); vanity(g, ...B.r(842, 655, 875, 690), YF)
  // крыша: шезлонги и столик
  lounger(g, ...A.r(160, 240, 200, 330), YF)
  lounger(g, ...A.r(215, 240, 255, 330), YF)
  roundTable(g, ...at(A, 300, 300), YF, 0.4)
  chair(g, ...at(A, 300, 255), YF, M.white); chair(g, ...at(A, 300, 345), YF, M.white)
  plant(g, ...at(A, 355, 205), YF, 0.8)
}
PP(A, floor1G, 1.65, 290, 380, -Math.PI / 2, y, 0xf08a6b, 0x4a5a78)
PP(A, floor1G, 1.75, 400, 330, 0.4, 0.1, 0x4aa8a8, 0xf3ead8)
PP(B, floor2G, 1.7, 900, 520, Math.PI / 2, YF, 0x7fae95, 0x4a3a2e)

const Y2 = H1 + 0.2
ToonKit.start({
  sub: '2 ' + Model3D.roomWord('bedroomsPlural'),
  facts: [
    { group: 'floor1', rooms: [['livingKitchen'], ['bedroom'], ['bathroom'], ['pool']] },
    { group: 'floor2', rooms: [['bedroom'], ['bathroom'], ['terrace']] },
  ],
  L1: [
    LbP(A, 'livingKitchen', undefined, 240, 330, 2.2),
    LbP(A, 'bedroom', undefined, 260, 560, 2.0),
    LbP(A, 'bathroom', undefined, 240, 680, 2.0),
    LbP(A, 'stairs', undefined, 145, 520, 2.4),
    LbP(A, 'pool', undefined, 500, 540, 1.3, true),
  ],
  L2: [
    LbP(B, 'bedroom', undefined, 860, 520, Y2 + 1.9),
    LbP(B, 'bathroom', undefined, 900, 640, Y2 + 1.6),
    LbP(A, 'terrace', undefined, 240, 300, Y2 + 1.2),
  ],
})
</script>
