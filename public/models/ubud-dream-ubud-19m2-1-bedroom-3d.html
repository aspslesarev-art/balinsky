<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubud Dreams 19 м² — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Рабочий лист Snaar Group «Ubud dreams · Apartment 10 (2.19) · Furniture»
// (апартамент 9 — такой же). Площади из таблицы: комната 15 м², санузел
// 4 м², всего 19. Размеры сняты с листа по масштабу площадей: ≈ 4.2 × 4.95 м,
// санузел ≈ 3.15 × 1.65. Снаружи окна — деревянные ламели.
const PLAN = { name: 'Ubud Dreams 19 m²', W: 4.95, HD: 4.22, BACK: 0.4, FRONT: 0.4, H1: 2.9, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
rect(siteG, -BACK - 0.2, HD + 0.3, -0.3, W + 0.3, -0.3, 0.3, M.stone)
const y = 0.12, BU = 3.15, BV = 1.65
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, 0, HD, 0, W, 0, 0.12, M.slab)
  floorPatch(g, 0, HD, BV, W, y, T.terrazzo, 2)
  floorPatch(g, BU, HD, 0, BV, y, T.terrazzo, 2)
  floorPatch(g, 0, BU, 0, BV, y + 0.006, T.tiles, 0.8)

  wall(0, 0, HD, 0, H1); wall(0, W, HD, W, H1)
  wall(HD, 0, HD, 0.78, H1); wall(HD, 1.55, HD, W, H1)
  door(g, HD, 0.78, 1.55, y)
  wall(0, 0, 0, BV, H1); glassWall(g, 0, BV, 0, W, 0, H1)
  // деревянные ламели снаружи окна
  for (let v = 0.1; v < W; v += 0.25) regWall(rect(g, -0.32, -0.08, v, v + 0.05, 0, H1, M.woodL, true, false), H1)
  // санузел
  wall(0, BV, BU, BV, H1); wall(BU, 0, BU, 0.8, H1)
  door(g, BU, 0.8, 1.6, y)
  shower(g, 0.15, 1.2, 0.12, BV - 0.1, y)
  glassWall(g, 1.25, 0.1, 1.25, BV - 0.1, 0, 2.0)
  toilet(g, 1.75, 0.35, y)
  vanity(g, 2.1, 3.0, 0.08, 0.55, y)
  // шкаф у входа
  rr(g, 3.2, HD - 0.1, 0.1, 0.72, y, 2.1, M.wood, 0.04)

  // кровать изголовьем к дальней стене, тумбы, растение у окна
  bed(g, 1.26, 3.15, 2.77, W - 0.08, W - 0.08, y, M.sage)
  rr(g, 0.83, 1.24, W - 0.55, W - 0.1, y, 0.45, M.woodL, 0.04); rr(g, 3.17, 3.6, W - 0.55, W - 0.1, y, 0.45, M.woodL, 0.04)
  plant(g, 0.6, 2.35, y, 0.9)
  rr(g, 3.5, 4.1, 2.2, 2.8, y, 0.45, M.mustard, 0.15)
}
P(floor1G, 1.65, 2.2, 2.2, 0, y, 0xf08a6b, 0x4a5a78)

ToonKit.start({
  sub: '19 m² · 1 ' + Model3D.roomWord('bedroom'),
  facts: [{ group: 'floor1', rooms: [['bedroom', 15], ['bathroom', 4]] }],
  L1: [
    Lb('bedroom', 15, 2.2, 2.0, 3.6),
    Lb('bathroom', 4, 1.4, 2.7, 0.8),
  ],
})
</script>
</body>
</html>
