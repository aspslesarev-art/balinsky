<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elysium 2BR 83 м² — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Площади — со слайда застройщика: юнит 83.10 м², этаж 1 — 37.75,
// этаж 2 — 29.10, бассейн с террасой 16.25, 2 спальни. Площадей комнат
// нет. Размеров нет: метры сняты с вида сверху по масштабу, подогнанному
// под 37.75 м² первого этажа (1 px ≈ 2.33 см). Юнит в плане — трапеция
// со скошенной стеной; над частью гостиной у стекла — второй свет.
const k = 0.0233, X0 = 85, X1 = 580, YT = 350, YB = 632
const PLAN = { name: 'Elysium 2BR', W: (X1 - X0) * k, HD: (YB - YT) * k, BACK: 0.6, FRONT: 0.6, H1: 3.0, H2: 2.9, floors: 2 }
</script>
<script src="_toon-kit.js"></script>
<script>
const V = p => (p - X0) * k, U = p => (YB - p) * k
const pr = (x1, x2, y1, y2) => [U(y2), U(y1), V(x1), V(x2)]
const wl = wall => (x1, y1, x2, y2, h) => wall(U(y1), V(x1), U(y2), V(x2), h)
const diag = x => 480 + (x - 85) * (595 - 480) / (460 - 85)       // скошенная стена
// трапеция полосами: верх yTop, низ по скосу
function trap (x1, x2, fn, n = 30) { const a = []; for (let i = 0; i < n; i++) { const xa = x1 + (x2 - x1) * i / n, xb = x1 + (x2 - x1) * (i + 1) / n; a.push([xa, xb, fn((xa + xb) / 2)]) } return a }
function stairsV (g, va, vb, u1, u2, y0, y1, n = 14) {
  const d = (vb - va) / n, r = (y1 - y0) / n
  for (let i = 0; i < n; i++) { const a = va + d * i, b = a + d; rect(g, u1, u2, Math.min(a, b), Math.max(a, b), y0, r * (i + 1), M.woodL) }
}
for (const [a, b, yb] of trap(70, 595, x => diag(x) + 15)) rect(siteG, ...pr(a, b, 335, Math.min(yb, 645)), -0.3, 0.3, M.stone, true, false)
const y = 0.12
// ============ 1 этаж ============
{
  const g = floor1G, w = wl(makeWall(g, 0))
  for (const [a, b, yb] of trap(85, 455, diag)) { rect(g, ...pr(a, b, 350, yb), 0, 0.12, M.slab, true, false); floorPatch(g, ...pr(a, b, 350, yb), y, a < 150 ? T.tiles : T.terrazzo, a < 150 ? 0.8 : 1.4) }
  w(85, 350, 455, 350, H1); w(85, 350, 85, 480, H1); w(85, 480, 455, diag(455), H1)
  glassWall(g, U(352), V(455), U(diag(455)), V(455), 0, H1)
  w(150, 350, 150, 410, H1); w(150, 450, 150, diag(150), H1)
  // ванная
  shower(g, ...pr(90, 145, 355, 395), y); toilet(g, U(425), V(122), y); vanity(g, ...pr(90, 110, 430, 470), y)
  // кухня у стены ванной, барная стойка
  rr(g, ...pr(152, 185, 360, 460), y, 0.82, M.dark, 0.03); rect(g, ...pr(150, 187, 360, 460), 0.94, 0.05, M.white)
  rr(g, ...pr(232, 252, 362, 448), y, 1.05, M.white, 0.04)
  for (const yy of [375, 400, 425]) stool(g, U(yy), V(262), y)
  // гостиная: круглый ковёр, полукруглый диван, столик
  cyl(g, U(455), V(368), 0.85, 0.85, 0.015, y, M.mustard, 40, false)
  rr(g, ...pr(330, 420, 488, 522), y, 0.42, M.coral, 0.12); rr(g, ...pr(330, 352, 440, 522), y, 0.42, M.coral, 0.12)
  rr(g, ...pr(330, 420, 508, 522), y, 0.8, M.coral, 0.1)
  rr(g, ...pr(355, 380, 445, 468), y, 0.4, M.grey, 0.04)
  rr(g, ...pr(212, 240, 500, 528), y, 0.5, M.dark, 0.03)
  plant(g, U(370), V(340), y, 0.8)
  stairsV(g, V(290), V(392), U(548), U(512), y, H1 + 0.18)
}
// ============ терраса с бассейном ============
{
  const g = floor1G
  const tdiag = x => diag(455) + (x - 455) * (632 - diag(455)) / (580 - 455)
  for (const [a, b, yb] of trap(455, 580, tdiag, 10)) rect(g, ...pr(a, b, 350, yb), 0, 0.1, texMat(T.deck, (b - a) * k, 2), true, false)
  pool(g, ...pr(465, 575, 372, 435), 0.1)
  for (const x of [475, 515]) rr(g, ...pr(x, x + 30, 455, 487), 0.1, 0.25, M.white, 0.05)
  for (let x = 470; x < 575; x += 22) ball(g, U(362), V(x), 0.15, 0.25, M.leaf, 0.8)
  plant(g, U(590), V(500), 0.1, 0.8)
  railing(g, U(350), V(580), U(632), V(580), 0.1); railing(g, U(350), V(455), U(350), V(580), 0.1)
  railing(g, U(diag(455)), V(455), U(632), V(580), 0.1)
}
// ============ 2 этаж: две спальни, второй свет у стекла ============
const Y = H1 + 0.18, YF = Y + 0.04
{
  const g = floor2G, w = wl(makeWall(g, Y))
  for (const [a, b, yb] of trap(85, 385, diag, 24)) {
    const top = (a >= 290) ? 350 : 350
    const end = (a >= 290) ? Math.min(yb, 505) : yb               // проём над лестницей
    rect(g, ...pr(a, b, top, end), H1, 0.18, M.wood, true, false); rect(g, ...pr(a, b, top, end), Y, 0.04, M.slab, true, false)
    floorPatch(g, ...pr(a, b, top, Math.min(end, 520)), YF, T.planks, 1.6)
  }
  w(85, 350, 455, 350, H2); w(85, 350, 85, 480, H2); w(85, 480, 455, diag(455), H2)
  glassWall(g, U(352), V(455), U(diag(455)), V(455), Y, H2)
  w(228, 350, 228, 505, H2)
  glassWall(g, U(352), V(385), U(500), V(385), Y, H2)              // стекло спальни ко второму свету
  railing(g, U(505), V(290), U(505), V(385), YF)
  // спальни: кровати изголовьем к верхней стене
  bedU(g, ...pr(115, 195, 368, 460), U(368), YF, M.coral)
  rr(g, ...pr(92, 110, 362, 380), YF, 0.45, M.dark, 0.04); rr(g, ...pr(200, 220, 362, 380), YF, 0.45, M.dark, 0.04)
  rr(g, ...pr(120, 190, 470, 490), YF, 0.012, M.grey, 0.005, false)
  bedU(g, ...pr(265, 350, 368, 460), U(368), YF, M.coral)
  rr(g, ...pr(240, 260, 362, 380), YF, 0.45, M.dark, 0.04); rr(g, ...pr(355, 375, 362, 380), YF, 0.45, M.dark, 0.04)
}
P(floor1G, 1.65, U(420), V(290), Math.PI / 2, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.75, U(520), V(520), 0.4, 0.1, 0x4aa8a8, 0xf3ead8)
P(floor2G, 1.7, U(495), V(240), Math.PI, YF, 0x7fae95, 0x4a3a2e)

ToonKit.start({
  sub: '83.1 m² · 2 ' + Model3D.roomWord('bedroomsPlural'),
  facts: [
    { group: 'floor1', rooms: [['livingKitchen'], ['bathroom'], ['stairs'], ['terrace', 16.25], ['pool']] },
    { group: 'floor2', rooms: [['bedroom', undefined, 2]] },
  ],
  L1: [
    Lb('livingKitchen', undefined, U(420), 2.3, V(300)),
    Lb('bathroom', undefined, U(400), 2.6, V(118)),
    Lb('terrace', 16.25, U(520), 1.3, V(520), true),
    Lb('pool', undefined, U(400), 1.1, V(520), true),
  ],
  L2: [
    Lb('bedroom', undefined, U(420), Y + 2.0, V(155)),
    Lb('bedroom', undefined, U(420), Y + 2.0, V(305)),
  ],
})
</script>
</body>
</html>
