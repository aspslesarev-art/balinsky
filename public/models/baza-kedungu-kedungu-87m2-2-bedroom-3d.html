<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baza Kedungu Люкс P — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Площади — со слайда «Президентский люкс P, 87 м²»: гостиная 32.8,
// спальни 19.0 и 14.2, ванные 5.6, 4.8 и 3.2, коридор 3.2, терраса 4.2.
// Размеров нет: метры сняты по масштабу, подогнанному под 32.8 м²
// гостиной (1 px ≈ 2.9 см).
const k = 0.029, X0 = 70, X1 = 445, YT = 335, YB = 697
const PLAN = { name: 'Baza Kedungu P', W: (X1 - X0) * k, HD: (YB - YT) * k, BACK: 0.6, FRONT: 0.6, H1: 3.0, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
const V = p => (p - X0) * k, U = p => (YB - p) * k
const pr = (x1, x2, y1, y2) => [U(y2), U(y1), V(x1), V(x2)]
const wl = wall => (x1, y1, x2, y2, h) => wall(U(y1), V(x1), U(y2), V(x2), h)
rect(siteG, ...pr(55, 460, 320, 712), -0.3, 0.3, M.stone)
const y = 0.12
{
  const g = floor1G, w = wl(makeWall(g, 0))
  rect(g, ...pr(70, 238, 335, 697), 0, 0.12, M.slab); rect(g, ...pr(238, 405, 335, 660), 0, 0.12, M.slab)
  floorPatch(g, ...pr(70, 270, 335, 442), y, T.planksDark, 1.6)       // спальня 14.2
  floorPatch(g, ...pr(270, 302, 335, 442), y, T.planks, 1.6)          // коридор
  floorPatch(g, ...pr(302, 405, 335, 415), y + 0.004, T.tiles, 0.8)   // ванная 3.2
  floorPatch(g, ...pr(70, 235, 442, 552), y + 0.004, T.tiles, 0.8)    // ванные 4.8 и 5.6
  floorPatch(g, ...pr(235, 405, 415, 660), y, T.planks, 1.6)          // гостиная
  floorPatch(g, ...pr(70, 238, 552, 697), y, T.planksDark, 1.6)       // спальня 19

  w(70, 335, 275, 335, H1); w(300, 335, 405, 335, H1); door(g, U(335), V(275), V(300), y)
  w(405, 335, 405, 545, H1); glassWall(g, U(545), V(405), U(660), V(405), 0, H1)
  w(238, 660, 405, 660, H1); w(238, 600, 238, 697, H1); w(238, 442, 238, 575, H1); w(70, 697, 238, 697, H1); w(70, 335, 70, 697, H1)
  w(70, 442, 200, 442, H1); w(225, 442, 270, 442, H1)
  w(270, 335, 270, 420, H1); w(302, 335, 302, 355, H1); w(302, 385, 302, 415, H1); w(302, 415, 405, 415, H1)
  w(160, 442, 160, 552, H1); w(70, 552, 120, 552, H1); w(150, 552, 238, 552, H1)

  // спальня 14.2: кровать изголовьем к левой стене, шкафы
  bed(g, ...pr(74, 150, 360, 425), V(74), y, M.teal)
  rr(g, ...pr(205, 265, 345, 425), y, 2.0, M.wood, 0.03)
  // ванная 3.2 и кухня под ней
  toilet(g, U(355), V(340), y); vanity(g, ...pr(370, 400, 352, 385), y)
  rr(g, ...pr(308, 400, 418, 440), y, 0.82, M.sage, 0.03); rect(g, ...pr(306, 402, 416, 442), 0.94, 0.05, M.white)
  // ванные 4.8 и 5.6
  tub(g, ...pr(85, 150, 452, 482), y); toilet(g, U(530), V(92), y); vanity(g, ...pr(135, 157, 500, 535), y)
  vanity(g, ...pr(163, 185, 465, 500), y); toilet(g, U(470), V(215), y); shower(g, ...pr(165, 232, 512, 548), y)
  // гостиная: остров со стульями, диван, кресла, ТВ
  rr(g, ...pr(295, 390, 468, 495), y, 0.95, M.sage, 0.04); rect(g, ...pr(292, 393, 466, 497), 1.07, 0.05, M.white)
  for (const x of [310, 330, 350, 370]) stool(g, U(510), V(x), y)
  cyl(g, U(590), V(325), 1.3, 1.3, 0.015, y, M.mustard, 40, false)
  rr(g, ...pr(282, 362, 540, 578), y, 0.42, M.sofa, 0.12); rr(g, ...pr(282, 362, 540, 552), y, 0.85, M.sofa, 0.12)
  rr(g, ...pr(310, 350, 590, 618), y, 0.36, M.woodL, 0.06)
  rr(g, ...pr(262, 292, 603, 635), y, 0.45, M.mustard, 0.15); rr(g, ...pr(362, 392, 603, 635), y, 0.45, M.mustard, 0.15)
  rr(g, ...pr(242, 398, 642, 657), y, 0.5, M.wood, 0.03)
  // спальня 19: кровать изголовьем к шкафам
  rr(g, ...pr(74, 234, 555, 572), y, 2.0, M.wood, 0.03)
  bedU(g, ...pr(115, 185, 600, 668), U(600), y, M.coral)
  rr(g, ...pr(92, 110, 600, 618), y, 0.45, M.woodL, 0.04); rr(g, ...pr(190, 208, 600, 618), y, 0.45, M.woodL, 0.04)
  plant(g, U(685), V(225), y, 0.7)
}
// терраса
{
  const g = floor1G
  rect(g, ...pr(405, 445, 545, 660), 0, 0.1, texMat(T.deck, 1, 2), true, false)
  chair(g, U(590), V(425), 0.1, M.white); plant(g, U(645), V(430), 0.1, 0.6)
  railing(g, U(545), V(445), U(660), V(445), 0.1); railing(g, U(545), V(405), U(545), V(445), 0.1); railing(g, U(660), V(405), U(660), V(445), 0.1)
}
P(floor1G, 1.65, U(520), V(270), Math.PI / 2, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.75, U(460), V(395), -0.5, y, 0x4aa8a8, 0xf3ead8)

ToonKit.start({
  sub: '87 m² · 2 ' + Model3D.roomWord('bedroomsPlural'),
  facts: [{ group: 'floor1', rooms: [['livingKitchen', 32.8], ['bedroom', 19], ['bedroom', 14.2], ['bathroom', 5.6], ['bathroom', 4.8], ['bathroom', 3.2], ['hall', 3.2], ['terrace', 4.2]] }],
  L1: [
    Lb('livingKitchen', 32.8, U(560), 2.3, V(325)),
    Lb('bedroom', 19, U(630), 2.2, V(150)),
    Lb('bedroom', 14.2, U(390), 2.2, V(150)),
    Lb('bathroom', 5.6, U(500), 2.7, V(200)),
    Lb('bathroom', 4.8, U(500), 2.1, V(110)),
    Lb('bathroom', 3.2, U(375), 2.6, V(355)),
    Lb('hall', 3.2, U(390), 1.7, V(286)),
    Lb('terrace', 4.2, U(600), 1.3, V(425), true),
  ],
})
</script>
</body>
</html>
