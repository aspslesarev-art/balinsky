<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyanyi 1BR — 3D планировка</title>
</head>
<body>
<script src="_model-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Слайд застройщика «1BD VILLA, с бассейном, 1 этаж, 71,3 м²». Площади
// с плана: гостиная-кухня 48.89, ванная 3.52, терраса 18.31, бассейн 7.04.
// Размеров на плане нет — метры сняты по пропорциям чертежа (дом ≈10.8×7.3 м).
const PLAN = { name: 'Nyanyi 1BR Villa', W: 10.8, HD: 7.3, BACK: 1.2, FRONT: 2.2, H1: 3.0, floors: 1 }
</script>
<script src="_toon-kit.js"></script>
<script>
lot()
path(1.2, 2.1)
const y = 0.12
const VB = 7.5    // граница гостиной и спального блока
const UT = 2.5    // граница террасы и гостиной
{
  const g = floor1G, wall = makeWall(g, 0)
  rect(g, UT, HD, 0, VB, 0, 0.12, M.slab)
  rect(g, 0, HD, VB, W, 0, 0.12, M.slab)
  floorPatch(g, UT, HD, 0, VB, y, T.planks, 1.6)                 // гостиная
  floorPatch(g, 0, 5.3, VB, W, y + 0.004, T.planksDark, 1.6)       // спальня
  floorPatch(g, 5.3, HD, VB, W, y + 0.004, T.tiles, 0.8)           // ванная

  // наружные стены
  wall(UT, 0, HD, 0, H1)
  wall(HD, 0, HD, 1.2, H1); wall(HD, 2.1, HD, W, H1)
  door(g, HD, 1.2, 2.1, y)
  wall(0, W, HD, W, H1)
  wall(0, VB, 0, W, H1)
  glassWall(g, UT, 0, UT, VB, 0, H1)               // гостиная → терраса
  wall(0, VB, 3.4, VB, H1)                          // спальня | терраса и гостиная
  wall(5.0, VB, HD, VB, H1)                         // проём из гостиной 3.4–5.0
  // ванная: ванна у фасада, ниже — унитаз и душ
  wall(5.3, VB, 5.3, 8.4, H1); wall(5.3, 9.2, 5.3, W, H1)
  wall(5.3, 9.6, 6.25, 9.6, H1)
  tub(g, 6.35, 7.1, 8.3, 10.0, y)
  rect(g, 6.25, 6.29, VB, W, y, 0.9, M.white, false, false)
  toilet(g, 5.75, 8.0, y)
  shower(g, 5.4, 6.2, 9.7, 10.7, y)
  vanity(g, 6.35, 7.1, 10.2, 10.7, y)

  // спальня: кровать изголовьем к правой стене, шкаф у террасы
  bed(g, 1.8, 3.6, 8.6, 10.65, 10.65, y, M.coral)
  rr(g, 1.3, 1.7, 10.2, 10.65, y, 0.45, M.woodL, 0.04); rr(g, 3.7, 4.1, 10.2, 10.65, y, 0.45, M.woodL, 0.04)
  rr(g, 0.1, 0.65, VB + 0.15, W - 0.15, y, 2.1, M.wood, 0.04)    // шкаф
  rr(g, 1.9, 3.5, 7.8, 8.5, y, 0.012, M.cush, 0.005, false)
  plant(g, 4.8, 10.4, y, 0.7)

  // кухня вдоль левой стены, столовая, диван
  rr(g, 3.0, HD - 0.1, 0.05, 0.65, y, 0.82, M.sage, 0.03)
  rect(g, 3.0, HD - 0.1, 0.03, 0.68, 0.94, 0.05, M.white)
  rr(g, 2.65, 3.25, 0.05, 0.7, y, 1.9, M.steel, 0.06)             // холодильник
  roundTable(g, 5.2, 2.4, y, 0.6)
  for (const [u, v] of [[5.2, 1.5], [5.2, 3.3], [6.05, 2.4], [4.35, 2.4]]) chair(g, u, v, y)
  cyl(g, 4.6, 5.4, 1.2, 1.2, 0.015, y, M.mustard, 40, false)
  rr(g, 3.6, 5.8, 4.2, 5.0, y, 0.42, M.sofa, 0.12)
  rr(g, 3.6, 5.8, 4.2, 4.5, y, 0.85, M.sofa, 0.12)
  rr(g, 3.6, 4.4, 5.0, 6.2, y, 0.42, M.sofa, 0.12)
  rr(g, 4.9, 5.3, 4.55, 4.75, y + 0.42, 0.3, M.cush, 0.1)
  cyl(g, 4.9, 5.7, 0.38, 0.34, 0.36, y, M.woodL, 24)
  rr(g, 6.8, HD - 0.1, 4.6, 6.4, y, 0.5, M.wood, 0.04)           // тумба с ТВ
  plant(g, HD - 0.45, VB - 0.45, y, 0.8)
}
// ============ терраса и бассейн ============
{
  const g = floor1G
  rect(g, 0, UT, 0, VB, 0, 0.1, texMat(T.deck, 2.4, 0.9), true, false)
  pool(g, 0.15, 2.35, 3.9, 7.2, 0.1)
  lounger(g, 0.3, 0.95, 0.4, 2.4, 0.1, true)
  lounger(g, 1.2, 1.85, 0.4, 2.4, 0.1, true)
  plant(g, 0.4, 3.3, 0.1, 0.8)
  railing(g, 0, 0, 0, VB, 0.1)
  railing(g, 0, 0, UT, 0, 0.1)
}
P(floor1G, 1.65, 4.8, 3.3, Math.PI, y, 0xf08a6b, 0x4a5a78)
P(floor1G, 1.78, 1.3, 3.2, 0.3, 0.1, 0x4aa8a8, 0xf3ead8)

ToonKit.start({
  sub: '71.3 m² · 1 ' + Model3D.roomWord('bedroom'),
  facts: [{ group: 'floor1', rooms: [['livingKitchen', 48.89], ['bedroom'], ['bathroom', 3.52], ['terrace', 18.31], ['pool', 7.04]] }],
  L1: [
    Lb('livingKitchen', 48.89, 4.6, 2.3, 3.6),
    Lb('bedroom', undefined, 2.6, 2.0, 9.2),
    Lb('bathroom', 3.52, 6.3, 2.4, 9.2),
    Lb('terrace', 18.31, 1.2, 1.3, 1.6, true),
    Lb('pool', 7.04, 1.2, 1.4, 5.5, true),
  ],
})
</script>
</body>
</html>
