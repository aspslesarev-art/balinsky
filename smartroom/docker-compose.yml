services:
  smartroom:
    build: .
    restart: unless-stopped
    ports:
      # Порт на хосте задаётся HOST_PORT: на сервере с Home Assistant 3000
      # часто уже занят (Grafana, Node-RED), 8123 — сам HA.
      - "${HOST_PORT:-3000}:3000"
    environment:
      # Пароль админки. Смените перед тем, как открывать наружу.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      # Адрес, который попадёт в QR-коды. За доменом — https://hotel.example.com
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:3000}"
      # Секрет подписи кук: не задан — сессии слетают при перезапуске.
      SESSION_SECRET: "${SESSION_SECRET:-}"
    volumes:
      - ./data:/app/data
